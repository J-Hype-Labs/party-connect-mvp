<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>파티커넥트 - 파티 탐색 및 신청</title>
  <meta name="description" content="혼술바, 소개팅, 소모임 등 다양한 소셜링 파티를 한 곳에서 만나보세요. 파티커넥트에서 내 취향에 맞는 파티를 찾아 신청하세요.">
  <meta property="og:title" content="파티커넥트 - 파티 탐색 및 신청">
  <meta property="og:description" content="혼술바, 소개팅, 소모임 등 다양한 소셜링 파티를 한 곳에서 만나보세요.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=1200&q=80">

  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
          },
          colors: {
            brand: {
              primary: '#F43F5E',
              secondary: '#FB7185',
              accent: '#2563EB',
              surface: '#FFFFFF',
              ink: '#0F172A',
              muted: '#71717A',
              line: '#E4E4E7',
              dark: '#0F172A',
              light: '#FFF1F2',
            },
            error: '#EF4444'
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <!-- Shared Party Data -->
  <script src="../js/party-data.js"></script>

  <style>
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900 antialiased min-h-screen flex flex-col">
  <div id="root"></div>

  <script type="text/babel">
    // Using shared data from ../js/party-data.js (PARTY_LIST, REGION_CATEGORIES, DAYS, CATEGORIES)

    // ===== MAIN APP COMPONENT =====
    function PartyConnectApp() {
      const [selectedRegion, setSelectedRegion] = React.useState('전체 지역');
      const [selectedDay, setSelectedDay] = React.useState('전체');
      const [selectedCategory, setSelectedCategory] = React.useState('전체');
      const [searchQuery, setSearchQuery] = React.useState('');
      const [searchInput, setSearchInput] = React.useState('');
      const [isRegionModalOpen, setIsRegionModalOpen] = React.useState(false);
      const [modalSelectedCategory, setModalSelectedCategory] = React.useState('all');
      const [activePartyDetail, setActivePartyDetail] = React.useState(null);
      const [selectedDetailImage, setSelectedDetailImage] = React.useState(0);
      const [applyStep, setApplyStep] = React.useState('detail');
      const [applyForm, setApplyForm] = React.useState({ name: '', phone: '', day: '', agree: false });
      const [applyError, setApplyError] = React.useState('');
      const [toastMessage, setToastMessage] = React.useState('');
      const [wishlist, setWishlist] = React.useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem('partyconnect:wishlist') || '[]');
          return new Set(Array.isArray(saved) ? saved : []);
        } catch (e) { return new Set(); }
      });
      const [applications, setApplications] = React.useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem('partyconnect:applications') || '[]');
          return Array.isArray(saved) ? saved : [];
        } catch (e) { return []; }
      });
      const [currentUser, setCurrentUser] = React.useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem('partyconnect:user') || 'null');
          return saved;
        } catch (e) { return null; }
      });
      const [isLoginModalOpen, setIsLoginModalOpen] = React.useState(false);
      const [notifications, setNotifications] = React.useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem('partyconnect:notifications') || '[]');
          return Array.isArray(saved) ? saved : [];
        } catch (e) { return []; }
      });
      const [isNotificationOpen, setIsNotificationOpen] = React.useState(false);
      const [unreadCount, setUnreadCount] = React.useState(0);
      const [prefersReducedMotion, setPrefersReducedMotion] = React.useState(false);

      React.useEffect(() => {
        const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
        setPrefersReducedMotion(mq.matches);
        const handler = (e) => setPrefersReducedMotion(e.matches);
        mq.addEventListener('change', handler);
        return () => mq.removeEventListener('change', handler);
      }, []);

      React.useEffect(() => {
        localStorage.setItem('partyconnect:wishlist', JSON.stringify(Array.from(wishlist)));
      }, [wishlist]);

      React.useEffect(() => {
        localStorage.setItem('partyconnect:applications', JSON.stringify(applications));
      }, [applications]);

      React.useEffect(() => {
        if (currentUser) {
          localStorage.setItem('partyconnect:user', JSON.stringify(currentUser));
        }
      }, [currentUser]);

      React.useEffect(() => {
        localStorage.setItem('partyconnect:notifications', JSON.stringify(notifications));
      }, [notifications]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 2500);
      };

      const addNotification = (notif) => {
        const newNotif = { id: `notif_${Date.now()}`, ...notif, createdAt: new Date().toISOString(), read: false };
        setNotifications(prev => [newNotif, ...prev]);
        setUnreadCount(prev => prev + 1);
      };

      const handleSocialLogin = (provider) => {
        const mockUser = {
          id: `user_${Date.now()}`,
          name: provider === 'kakao' ? '카카오유저' : '네이버유저',
          avatar: provider === 'kakao' ? '🟡' : '🟢',
          provider,
          joinedAt: new Date().toISOString(),
        };
        setCurrentUser(mockUser);
        localStorage.setItem('partyconnect:user', JSON.stringify(mockUser));
        setIsLoginModalOpen(false);
        showToast(`${provider === 'kakao' ? '카카오' : '네이버'} 로그인 완료`);
        addNotification({ type: 'welcome', title: '환영합니다!', message: '파티커넥트 멤버가 되신 것을 환영합니다.', read: false });
      };

      const handleLogout = () => {
        setCurrentUser(null);
        localStorage.removeItem('partyconnect:user');
        showToast('로그아웃 되었습니다.');
      };

      const openLoginModal = () => setIsLoginModalOpen(true);

      const openMyPage = () => {
        if (!currentUser) { openLoginModal(); return; }
        showToast('마이페이지 준비 중입니다.');
      };

      const openPartyDetail = (party) => {
        setActivePartyDetail(party);
        setApplyStep('detail');
        setApplyError('');
        setApplyForm({ name: '', phone: '', day: party.days[0] || '', agree: false });
        setSelectedDetailImage(0);
      };

      const closePartyDetail = () => {
        setActivePartyDetail(null);
        setApplyStep('detail');
        setApplyError('');
      };

      const hasApplied = (partyId) => applications.some(a => a.partyId === partyId);

      const submitApplication = (e) => {
        e.preventDefault();
        if (!activePartyDetail) return;

        const name = applyForm.name.trim();
        const phone = applyForm.phone.replace(/[^0-9]/g, '');

        if (name.length < 2) { setApplyError('이름을 2자 이상 입력해 주세요.'); return; }
        if (phone.length < 10 || phone.length > 11) { setApplyError('연락처를 정확히 입력해 주세요. (예: 01012345678)'); return; }
        if (!applyForm.day) { setApplyError('참여할 요일을 선택해 주세요.'); return; }
        if (!applyForm.agree) { setApplyError('개인정보 수집 및 이용에 동의해 주세요.'); return; }

        const application = {
          id: activePartyDetail.id + '-' + Date.now(),
          partyId: activePartyDetail.id,
          partyTitle: activePartyDetail.title,
          venue: activePartyDetail.venue,
          day: applyForm.day,
          name, phone,
          appliedAt: new Date().toISOString(),
        };

        setApplications(prev => [application, ...prev]);
        setApplyError('');
        setApplyStep('done');
        showToast('신청이 접수되었습니다! (데모 모드)');
        addNotification({ type: 'apply', title: '신청 완료', message: `"${activePartyDetail.title}" 신청이 접수되었습니다.`, read: false });
      };

      const toggleWishlist = (e, partyId) => {
        e.preventDefault(); e.stopPropagation();
        setWishlist(prev => {
          const next = new Set(prev);
          if (next.has(partyId)) { next.delete(partyId); showToast('관심 파티에서 삭제되었습니다.'); }
          else { next.add(partyId); showToast('관심 파티에 추가되었습니다!'); }
          return next;
        });
      };

      const getBadges = (party) => {
        const remaining = party.recruit - party.currentRecruit;
        const badges = party.badges.filter(badge => !(remaining <= 0 && badge === '마감임박'));
        if (remaining <= 0) { if (!badges.includes('마감')) badges.push('마감'); }
        else if (remaining <= 2 && !badges.includes('마감임박')) { badges.push('마감임박'); }
        return badges;
      };

      const badgeClass = (badge) => {
        if (badge === 'NEW') return 'bg-rose-600 text-white';
        if (badge === '이벤트') return 'bg-amber-500 text-white';
        if (badge === '마감임박') return 'bg-orange-500 text-white';
        if (badge === '마감') return 'bg-zinc-400 text-white';
        if (badge === 'HOT') return 'bg-rose-500 text-white';
        return 'bg-zinc-800 text-white';
      };

      const filteredParties = React.useMemo(() => {
        return PARTY_LIST.filter(party => {
          if (selectedRegion !== '전체 지역' && selectedRegion !== '전체') {
            if (!party.region.includes(selectedRegion)) return false;
          }
          if (selectedDay !== '전체') {
            if (!party.days.includes(selectedDay)) return false;
          }
          if (selectedCategory !== '전체') {
            if (party.category !== selectedCategory) return false;
          }
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase().trim();
            const inTitle = party.title.toLowerCase().includes(q);
            const inVenue = party.venue.toLowerCase().includes(q);
            const inRegion = party.region.toLowerCase().includes(q);
            if (!inTitle && !inVenue && !inRegion) return false;
          }
          return true;
        });
      }, [selectedRegion, selectedDay, selectedCategory, searchQuery]);

      const availableCount = React.useMemo(() => filteredParties.filter(p => p.currentRecruit < p.recruit).length, [filteredParties]);

      const handleSearch = (e) => {
        setSearchQuery(e.target.value.trim());
        setSearchInput(e.target.value);
      };

      const clearSearch = () => { setSearchQuery(''); setSearchInput(''); };

      const clearFilters = () => { setSelectedRegion('전체 지역'); setSelectedDay('전체'); setSelectedCategory('전체'); clearSearch(); };

      const getModalRegions = () => {
        if (modalSelectedCategory === 'all') {
          const merged = REGION_CATEGORIES.filter(c => c.id !== 'all').reduce((acc, c) => acc.concat(c.subRegions), []);
          return ['전체'].concat(Array.from(new Set(merged.filter(r => r !== '전체'))));
        }
        const found = REGION_CATEGORIES.find(c => c.id === modalSelectedCategory);
        return found ? found.subRegions : ['전체'];
      };

      // ===== COMPONENTS =====
      const Header = () => (
        <header className="sticky top-0 z-40 border-b border-zinc-200 bg-white/95 backdrop-blur-md">
          <div className="mx-auto flex w-full max-w-7xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8">
            <div className="flex items-center gap-6 md:gap-8">
              <a href="/party-connect-mvp/" className="flex items-center gap-1.5 focus:outline-none" aria-label="파티커넥트 홈으로 이동">
                <span className="text-xl font-extrabold tracking-tighter text-zinc-950 sm:text-2xl">
                  PARTY<span className="text-rose-600">connect</span>
                </span>
              </a>
              <nav className="hidden items-center gap-6 md:flex" aria-label="메인 내비게이션">
                <a href="/party-connect-mvp/party-connect/" className="text-sm font-bold text-rose-600 transition" aria-current="page">파티커넥트</a>
                <a href="/party-connect-mvp/#reviews" className="text-sm font-semibold text-zinc-700 transition hover:text-rose-600">커뮤니티</a>
                <a href="/party-connect-mvp/#partners" className="text-sm font-semibold text-zinc-500 transition hover:text-zinc-900">제휴신청</a>
              </nav>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={() => setIsNotificationOpen(!isNotificationOpen)} className="relative p-2 rounded-full text-zinc-600 hover:bg-zinc-100 transition" aria-label={unreadCount > 0 ? `${unreadCount}개의 읽지 않은 알림` : '알림'}>
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
                {unreadCount > 0 && <span className="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-rose-500 text-[10px] font-bold flex items-center justify-center text-white">{unreadCount > 9 ? '9+' : unreadCount}</span>}
              </button>
              {currentUser ? (
                <button onClick={openMyPage} className="flex items-center gap-2 rounded-full bg-zinc-100 px-3 py-1.5 transition hover:bg-zinc-200" aria-label={`${currentUser.name}님의 마이페이지`}>
                  <span className="text-lg" aria-hidden="true">{currentUser.avatar}</span>
                  <span className="text-xs font-semibold text-zinc-900 hidden sm:inline">{currentUser.name}</span>
                  <svg className="w-4 h-4 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" /></svg>
                </button>
              ) : (
                <button onClick={openLoginModal} className="rounded-full bg-zinc-900 px-4 py-1.5 text-xs font-semibold text-white transition hover:bg-zinc-800 focus:outline-none focus:ring-2 focus:ring-zinc-950 focus:ring-offset-2 sm:text-sm">로그인</button>
              )}
            </div>
          </div>
        </header>
      );

      const SearchBar = () => (
        <div className="relative max-w-2xl mx-auto">
          <label htmlFor="party-search" className="sr-only">파티 검색</label>
          <div className="relative">
            <svg className="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
            <input id="party-search" type="search" value={searchInput} onChange={handleSearch} placeholder="파티명, 업체명, 지역으로 검색" className="w-full pl-12 pr-12 py-3 text-sm sm:text-base border border-zinc-200 bg-white rounded-xl focus:border-rose-400 focus:outline-none focus:ring-2 focus:ring-rose-100 transition" />
            {searchInput && <button onClick={clearSearch} className="absolute right-4 top-1/2 -translate-y-1/2 p-1 rounded-full hover:bg-zinc-100 transition" aria-label="검색어 지우기"><svg className="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg></button>}
          </div>
        </div>
      );

      const FilterChips = ({ label, options, selected, onSelect, ariaLabel }) => (
        <div className="flex flex-wrap gap-2" role="group" aria-label={ariaLabel}>
          {options.map(opt => (
            <button key={opt} onClick={() => onSelect(opt)} className={`px-3 py-1.5 text-sm font-medium rounded-full transition min-h-[44px] min-w-[44px] flex items-center justify-center ${selected === opt ? 'bg-rose-600 text-white shadow-sm' : 'bg-white text-zinc-700 border border-zinc-200 hover:border-rose-300 hover:bg-rose-50'}`} aria-pressed={selected === opt}>{opt}</button>
          ))}
        </div>
      );

      const RegionFilter = () => {
        const regions = getModalRegions();
        return (
          <div>
            <button onClick={() => setIsRegionModalOpen(true)} className="w-full sm:w-auto px-4 py-2 text-sm font-medium text-zinc-700 bg-white border border-zinc-200 rounded-xl hover:border-rose-300 hover:bg-rose-50 transition flex items-center gap-2 min-h-[44px]" aria-haspopup="dialog" aria-label="지역 필터 열기">
              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
              <span>{selectedRegion}</span>
              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" /></svg>
            </button>
            {isRegionModalOpen && (
              <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4" role="dialog" aria-modal="true" aria-label="지역 선택">
                <div className="absolute inset-0 bg-black/50" onClick={() => setIsRegionModalOpen(false)} aria-hidden="true" />
                <div className="relative w-full max-w-md max-h-[80vh] bg-white rounded-t-2xl sm:rounded-xl shadow-xl overflow-hidden flex flex-col">
                  <div className="flex items-center justify-between px-4 py-3 border-b border-zinc-200">
                    <h3 className="text-base font-bold text-zinc-900">지역 선택</h3>
                    <button onClick={() => setIsRegionModalOpen(false)} className="p-2 rounded-full hover:bg-zinc-100 transition" aria-label="닫기"><svg className="w-5 h-5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg></button>
                  </div>
                  <div className="flex border-b border-zinc-200 overflow-x-auto" role="tablist" aria-label="지역 대분류">
                    {REGION_CATEGORIES.map(cat => (
                      <button key={cat.id} onClick={() => setModalSelectedCategory(cat.id)} role="tab" aria-selected={modalSelectedCategory === cat.id} className={`px-4 py-2 text-sm font-medium whitespace-nowrap transition ${modalSelectedCategory === cat.id ? 'text-rose-600 border-b-2 border-rose-600' : 'text-zinc-500 hover:text-zinc-700'}`}>{cat.name}</button>
                    ))}
                  </div>
                  <div className="p-4 overflow-y-auto max-h-[50vh]">
                    {getModalRegions().map(region => (
                      <button key={region} onClick={() => { setSelectedRegion(region); setIsRegionModalOpen(false); }} className={`w-full text-left px-3 py-2 text-sm rounded-lg transition ${selectedRegion === region ? 'bg-rose-50 text-rose-600 font-semibold' : 'text-zinc-700 hover:bg-zinc-50'}`}>{region}</button>
                    ))}
                  </div>
                  <div className="px-4 pb-4 pt-2 border-t border-zinc-200">
                    <button onClick={() => { setSelectedRegion('전체 지역'); setIsRegionModalOpen(false); }} className="w-full px-4 py-2 text-sm font-medium text-zinc-500 hover:text-zinc-700 transition">전체 지역으로 초기화</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      };

      const PartyCard = ({ party }) => {
        const badges = getBadges(party);
        const remaining = party.recruit - party.currentRecruit;
        const isFull = remaining <= 0;
        const hasApplied = applications.some(a => a.partyId === party.id);
        const isWishlisted = wishlist.has(party.id);

        return (
          <article className="group bg-white rounded-2xl border border-zinc-200 overflow-hidden hover:shadow-xl transition-shadow duration-300 flex flex-col h-full" onClick={() => openPartyDetail(party)} tabIndex={0} onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPartyDetail(party); } }} role="button" aria-label={`${party.title} 상세 보기`}>
            <div className="relative aspect-[4/3] overflow-hidden bg-zinc-100">
              {party.images[0] && (
                <img src={party.images[0]} alt="" loading="lazy" className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onError={e => { e.target.src = 'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=600&q=80'; }} />
              )}
              <div className="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent" aria-hidden="true" />
              {badges.length > 0 && (
                <div className="absolute top-3 left-3 flex flex-wrap gap-1.5" aria-label="파티 상태">
                  {badges.map(b => <span key={b} className={`px-2 py-0.5 text-[10px] font-bold rounded-full ${badgeClass(b)}`}>{b}</span>)}
                </div>
              )}

            </div>

      );
    }

    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PartyConnectApp />);

    // Lucide icons
    if (window.lucide) { window.lucide.createIcons(); }
    const obs = new MutationObserver(() => { if (window.lucide) window.lucide.createIcons(); });
