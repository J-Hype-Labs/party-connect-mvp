<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>파티커넥트 - 파티 탐색 및 신청</title>
  <meta name="description" content="혼술바, 소개팅, 소모임 등 다양한 소셜링 파티를 한 곳에서 만나보세요. 파티커넥트에서 내 취향에 맞는 파티를 찾아 신청하세요.">
  <meta property="og:title" content="파티커넥트 - 파티 탐색 및 신청">
  <meta property="og:description" content="혼술바, 소개팅, 소모임 등 다양한 소셜링 파티를 한 곳에서 만나보세요.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=1200&q=80">

  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
          },
          colors: {
            brand: {
              primary: '#F43F5E',
              secondary: '#FB7185',
              accent: '#2563EB',
              surface: '#FFFFFF',
              ink: '#0F172A',
              muted: '#71717A',
              line: '#E4E4E7',
              dark: '#0F172A',
              light: '#FFF1F2',
            },
            error: '#EF4444'
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <!-- Shared Party Data -->
  <script src="../js/party-data.js"></script>

  <!-- Supabase & Auth Modules -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
    // PartyLink 연동 설정 — 두 값을 비워 두면 기존 데모 모드(localStorage)로 동작합니다.
    //   supabaseUrl     : Supabase 대시보드 → Project Settings → API 의 Project URL
    //   supabaseAnonKey : 같은 화면의 anon(또는 publishable) 키. 공개돼도 되는 키입니다.
    //                     ⚠️ service_role / secret 키는 절대 넣지 마세요.
    // 실서비스 모드 조건: 두 값이 있고, localhost 가 아니거나 주소에 ?live=1 이 있을 때
    //   (로컬/CI 테스트는 데모 모드 유지, ?demo=1 로 배포 사이트에서도 데모 강제 가능)
    window.PARTYLINK_CONFIG = {
      supabaseUrl: "https://cpctedhhojmbycnqhzli.supabase.co",
      supabaseAnonKey: "sb_publishable_JEWNbxlUSWRkyVePlejC_A_I0WlLi6e",
    };
  </script>
  <script src="../js/auth-client.js"></script>
  <script src="../js/auth-service.js"></script>
  <script src="../js/auth-ui.js"></script>
  <script src="../js/party-api.js"></script>
  <script src="../js/mission-ui.js"></script>

  <style>
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900 antialiased min-h-screen flex flex-col">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // Using shared data from ../js/party-data.js (PARTY_LIST, REGION_CATEGORIES, DAYS, CATEGORIES)

    // Auth & API modules (with fallbacks for robustness)
    const { live = false, client = null, api = null, toAppUser = (u) => u } = window.PARTYLINK_AUTH || {};
    const { 
      AUTH_STATE = {}, 
      getState = () => 'SIGNED_OUT', 
      getUser = () => null, 
      isAuthenticated = () => false, 
      subscribe = (l) => () => {}, 
      loginWithKakao = async () => { throw new Error('Auth not available'); }, 
      restoreSession = async () => ({ user: null }), 
      logout = async () => {}, 
      saveReturnUrl = () => {}, 
      consumeReturnUrl = () => null 
    } = window.PARTYLINK_AUTH_SERVICE || {};
    const { 
      LoginModal = () => null, 
      WelcomeToast = () => null, 
      ErrorToast = () => null, 
      showToast = () => {} 
    } = window.PARTYLINK_AUTH_UI || {};
    const { 
      fetchParties = async () => ({ data: [], error: new Error('API not available') }), 
      fetchMyApplications = async () => ({ data: [], error: null }), 
      applyToParty = async () => { throw new Error('API not available'); }, 
      cancelApplication = async () => { throw new Error('API not available'); },
      normalizeServerParties = (d) => d,
      normalizeServerApplications = (d) => d,
      getStatusLabel = (s) => ({ label: s, className: '' }),
      isActiveApplication = () => false 
    } = window.PARTYLINK_PARTY_API || {};
    const { ApplicationExtras = () => null } = window.PARTYLINK_MISSION_UI || {};

    const REGION_CATEGORIES = [
      { id: "all", name: "전체 지역", subRegions: ["전체"] },
      { id: "seoul", name: "서울", subRegions: ["전체", "강남/서초", "교대/사당", "홍대/마포", "용산/이태원", "명동/을지로", "잠실/송파", "강북/성북", "마포/상암", "여의도/영등포", "강서/목동", "건대/성수/왕십리", "강동/천호", "종로/광화문", "신촌/이대", "압구정/청담", "관악/신림", "노원/도봉"] },
      { id: "gyeonggi", name: "경기·인천", subRegions: ["전체", "일산/파주", "인천/부천", "수원/성남", "안양/군포", "하남/광주"] },
      { id: "others", name: "지방/기타", subRegions: ["전체", "대전/충청", "대구/경북", "부산/경남", "광주/전라", "제주"] }
    ];

    const DAYS = ["전체", "월", "화", "수", "목", "금", "토", "일"];
    const CATEGORIES = ["전체", "혼술바", "소개팅", "소셜파티"];

    // ===== MAIN APP COMPONENT =====
    function PartyConnectApp() {
      const [selectedRegion, setSelectedRegion] = useState('전체 지역');
      const [selectedDay, setSelectedDay] = useState('전체');
      const [selectedCategory, setSelectedCategory] = useState('전체');
      const [searchQuery, setSearchQuery] = useState('');
      const [searchInput, setSearchInput] = useState('');
      const [isRegionModalOpen, setIsRegionModalOpen] = useState(false);
      const [modalSelectedCategory, setModalSelectedCategory] = useState('all');
      const [activePartyDetail, setActivePartyDetail] = useState(null);
      const [selectedDetailImage, setSelectedDetailImage] = useState(0);
      const [applyStep, setApplyStep] = useState('detail');
      const [applyForm, setApplyForm] = useState({ name: '', phone: '', day: '', agree: false });
      const [applyError, setApplyError] = useState('');
      const [applySubmitting, setApplySubmitting] = useState(false);
      const [toastMessage, setToastMessage] = useState('');
      const [wishlist, setWishlist] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem('partyconnect:wishlist') || '[]');
          return new Set(Array.isArray(saved) ? saved : []);
        } catch (e) { return new Set(); }
      });
      const [applications, setApplications] = useState(() => {
        if (live) return [];
        try {
          const saved = JSON.parse(localStorage.getItem('partyconnect:applications') || '[]');
          return Array.isArray(saved) ? saved : [];
        } catch (e) { return []; }
      });
      const [parties, setParties] = useState(live ? [] : PARTY_LIST);
      const [partiesLoading, setPartiesLoading] = useState(live);
      const [partiesError, setPartiesError] = useState(null);
      const [isLoginModalOpen, setIsLoginModalOpen] = useState(false);
      const [isMyPageOpen, setIsMyPageOpen] = useState(false);
      const [notifications, setNotifications] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem('partyconnect:notifications') || '[]');
          return Array.isArray(saved) ? saved : [];
        } catch (e) { return []; }
      });
      const [isNotificationOpen, setIsNotificationOpen] = useState(false);
      const [unreadCount, setUnreadCount] = useState(0);
      const [prefersReducedMotion, setPrefersReducedMotion] = useState(false);

      // Auth state
      const [currentUser, setCurrentUser] = useState(null);
      const [authState, setAuthState] = useState('INITIALIZING');
      const [loginLoading, setLoginLoading] = useState(false);

      // Welcome/Error toast state
      const [welcomeToast, setWelcomeToast] = useState({ show: false, isNewUser: false });
      const [errorToast, setErrorToast] = useState({ show: false, message: '' });

      // UI/UX Pro Max: Motion preferences
      useEffect(() => {
        const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
        setPrefersReducedMotion(mq.matches);
        const handler = (e) => setPrefersReducedMotion(e.matches);
        mq.addEventListener('change', handler);
        return () => mq.removeEventListener('change', handler);
      }, []);

      // Subscribe to auth state changes
      useEffect(() => {
        const unsubscribe = subscribe((state, user) => {
          setAuthState(state);
          setCurrentUser(user);
          setIsLoginModalOpen(false);
          setLoginLoading(false);
        });

        // Restore session on mount
        restoreSession().then(({ user }) => {
          if (user) {
            setCurrentUser(user);
          }
        });

        return unsubscribe;
      }, []);

      // Handle welcome toast from auth callback
      useEffect(() => {
        const handleWelcome = (event) => {
          setWelcomeToast({ show: true, isNewUser: event.detail.isNewUser });
        };
        window.addEventListener('partylink:welcome', handleWelcome);
        return () => window.removeEventListener('partylink:welcome', handleWelcome);
      }, []);

      // Handle toast events
      useEffect(() => {
        const handleToast = (event) => {
          showToast(event.detail.message);
        };
        window.addEventListener('partylink:toast', handleToast);
        return () => window.removeEventListener('partylink:toast', handleToast);
      }, []);

      // Load parties on mount (live mode)
      useEffect(() => {
        if (!live) return;
        setPartiesLoading(true);
        fetchParties().then(({ data, error }) => {
          setPartiesLoading(false);
          if (error) {
            setPartiesError(error);
            setParties([]);
          } else {
            setParties(normalizeServerParties(data));
          }
        });
      }, [live]);

      // Load my applications on mount (live mode)
      useEffect(() => {
        if (!live || !currentUser) return;
        fetchMyApplications().then(({ data, error }) => {
          if (!error) {
            setApplications(normalizeServerApplications(data));
          }
        });
      }, [live, currentUser]);

      // Persist wishlist & applications (localStorage for demo mode)
      useEffect(() => {
        try {
          localStorage.setItem('partyconnect:wishlist', JSON.stringify(Array.from(wishlist)));
        } catch (e) {}
      }, [wishlist]);

      useEffect(() => {
        if (!live) {
          try {
            localStorage.setItem('partyconnect:applications', JSON.stringify(applications));
          } catch (e) {}
        }
      }, [applications, live]);

      // Close modals on ESC
      useEffect(() => {
        const onKeyDown = (event) => {
          if (event.key !== "Escape") return;
          setIsRegionModalOpen(false);
          setActivePartyDetail(null);
          setApplyStep('detail');
          setApplyError("");
          setIsLoginModalOpen(false);
          setIsNotificationOpen(false);
          setIsMyPageOpen(false);
        };
        window.addEventListener("keydown", onKeyDown);
        return () => window.removeEventListener("keydown", onKeyDown);
      }, []);

      // Lock body scroll while modal is open
      useEffect(() => {
        const hasModal = isRegionModalOpen || Boolean(activePartyDetail) || isLoginModalOpen || isNotificationOpen || isMyPageOpen;
        document.body.style.overflow = hasModal ? "hidden" : "";
        return () => { document.body.style.overflow = ""; };
      }, [isRegionModalOpen, activePartyDetail, isLoginModalOpen, isNotificationOpen, isMyPageOpen]);

      // Lucide icons
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Toast helper
      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(""), 2500);
      };

      // Toggle wishlist
      const toggleWishlist = (e, partyId) => {
        e.preventDefault();
        e.stopPropagation();
        setWishlist((prev) => {
          const next = new Set(prev);
          if (next.has(partyId)) {
            next.delete(partyId);
            showToast("관심 파티에서 삭제되었습니다.");
          } else {
            next.add(partyId);
            showToast("관심 파티에 추가되었습니다! (찜 목록)");
          }
          return next;
        });
      };

      // Open / close party detail modal
      const openPartyDetail = (party) => {
        setActivePartyDetail(party);
        setApplyStep('detail');
        setApplyError("");
        setApplyForm({ name: '', phone: '', day: party.days[0] || '', agree: false });
        setSelectedDetailImage(0);
      };

      const closePartyDetail = () => {
        setActivePartyDetail(null);
        setApplyStep('detail');
        setApplyError("");
      };

      // Auth functions
      const handleLogin = async () => {
        setLoginLoading(true);
        try {
          if (activePartyDetail) {
            saveReturnUrl(activePartyDetail.id, 'apply');
          }
          await loginWithKakao();
        } catch (error) {
          setLoginLoading(false);
          setErrorToast({ show: true, message: error.message });
        }
      };

      const handleLogout = async () => {
        try {
          await logout();
          setApplications([]);
          setIsMyPageOpen(false);
          showToast("로그아웃 되었습니다.");
        } catch (error) {
          setErrorToast({ show: true, message: error.message });
        }
      };

      const openLoginModal = () => {
        setIsLoginModalOpen(true);
      };

      // Notifications
      const addNotification = (notif) => {
        const newNotif = {
          id: `notif_${Date.now()}`,
          ...notif,
          createdAt: new Date().toISOString(),
          read: false
        };
        setNotifications((prev) => [newNotif, ...prev]);
        setUnreadCount((prev) => prev + 1);
      };

      const markAsRead = (notifId) => {
        setNotifications((prev) => prev.map((n) => n.id === notifId ? { ...n, read: true } : n));
        setUnreadCount((prev) => Math.max(0, prev - 1));
      };

      const markAllAsRead = () => {
        setNotifications((prev) => prev.map((n) => ({ ...n, read: true })));
        setUnreadCount(0);
      };

      const deleteNotification = (notifId) => {
        setNotifications((prev) => prev.filter((n) => n.id !== notifId));
      };

      // My Page
      const openMyPage = () => {
        if (!currentUser) { openLoginModal(); return; }
        setIsMyPageOpen(true);
      };

      // Re-fetch my applications so the status shown is the server's current one
      const refreshApplications = async (silent) => {
        const { data, error } = await fetchMyApplications();
        if (!error) setApplications(normalizeServerApplications(data));
        else if (!silent) showToast('신청 상태를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.');
        return !error;
      };

      const handleMissionSubmitted = async () => {
        await refreshApplications(true);
        showToast('미션이 제출되었어요. 검수 결과를 기다려 주세요.');
      };

      const handleMyApplicationCancel = (app) => {
        if (!window.confirm(`"${app.partyTitle}" 신청을 취소하시겠습니까?`)) return;
        
        if (live) {
          cancelApplication(app.id)
            .then(() => fetchMyApplications())
            .then(({ data, error }) => {
              if (!error) {
                setApplications(normalizeServerApplications(data));
              }
              showToast("신청이 취소되었습니다.");
            })
            .catch((err) => showToast(err.message));
        } else {
          setApplications(prev => prev.map(a => a.id === app.id ? { ...a, status: 'CANCELLED' } : a));
          showToast('신청이 취소되었습니다. (데모 모드)');
        }
      };

      // Map
      const openMap = (party) => {
        const addr = encodeURIComponent(party.address || party.venue);
        window.open(`https://map.kakao.com/link/search/${addr}`, '_blank', 'noopener,noreferrer');
      };

      // Filter parties
      const filteredParties = useMemo(() => {
        return parties.filter((party) => {
          const searchMatch = searchQuery === '' || 
            party.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            party.venue.toLowerCase().includes(searchQuery.toLowerCase()) ||
            party.region.toLowerCase().includes(searchQuery.toLowerCase());
          const regionMatch = selectedRegion === '전체 지역' || party.region === selectedRegion;
          const dayMatch = selectedDay === '전체' || party.days.includes(selectedDay);
          const categoryMatch = selectedCategory === '전체' || party.category === selectedCategory;
          return searchMatch && regionMatch && dayMatch && categoryMatch;
        });
      }, [parties, searchQuery, selectedRegion, selectedDay, selectedCategory]);

      // Check if user has applied
      const hasApplied = (partyId) => {
        return applications.some((a) => 
          a.partyId === partyId && 
          isActiveApplication(a.status) &&
          (!live || (currentUser && a.userId === currentUser.id))
        );
      };

      // Submit application
      const submitApplication = async (e) => {
        e.preventDefault();
        if (!activePartyDetail) return;

        const name = applyForm.name.trim();
        const phone = applyForm.phone.replace(/[^0-9]/g, '');

        if (name.length < 2) { setApplyError('이름을 2자 이상 입력해 주세요.'); return; }
        if (phone.length < 10 || phone.length > 11) { setApplyError('연락처를 정확히 입력해 주세요. (예: 01012345678)'); return; }
        if (!applyForm.day) { setApplyError('참여할 요일을 선택해 주세요.'); return; }
        if (!applyForm.agree) { setApplyError('개인정보 수집·이용에 동의해 주세요.'); return; }
        if (applySubmitting) return;

        if (!currentUser) {
          setApplyError('카카오 로그인 후 신청할 수 있어요.');
          openLoginModal();
          return;
        }

        setApplySubmitting(true);
        setApplyError('');

        const applicationData = { name, phone, day: applyForm.day, agree: true };

        try {
          if (live) {
            await applyToParty(activePartyDetail.id, applicationData);
            const [partiesResult, appsResult] = await Promise.all([
              fetchParties(),
              fetchMyApplications()
            ]);
            if (!partiesResult.error) {
              setParties(normalizeServerParties(partiesResult.data));
            }
            if (!appsResult.error) {
              setApplications(normalizeServerApplications(appsResult.data));
            }
            setApplyStep('done');
            showToast("신청이 접수되었습니다!");
          } else {
            const application = {
              id: activePartyDetail.id + "-" + Date.now(),
              partyId: activePartyDetail.id,
              partyTitle: activePartyDetail.title,
              name,
              phone,
              day: applyForm.day,
              appliedAt: new Date().toISOString(),
              status: "APPLIED",
              userId: currentUser.id
            };
            setApplications((prev) => [application, ...prev]);
            setApplyStep('done');
            showToast('신청이 접수되었습니다! (데모 모드)');
          }
          addNotification({
            type: 'apply',
            title: '신청 완료',
            message: `"${activePartyDetail.title}" 신청이 접수되었습니다.`,
            read: false
          });
        } catch (err) {
          setApplyError(err.message);
        } finally {
          setApplySubmitting(false);
        }
      };

      // ================================================================
      // RENDER
      // ================================================================
      return (
        <>
          {/* ================= HEADER ================= */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-sm border-b border-zinc-200">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16">
                {/* Logo */}
                <a href="../" className="flex items-center gap-2" aria-label="PartyConnect 홈">
                  <span className="text-xl font-extrabold tracking-tighter text-zinc-950">
                    PARTY<span className="text-rose-600">connect</span>
                  </span>
                </a>

                {/* Desktop Nav */}
                <nav className="hidden items-center gap-6 md:flex">
                  <a href="../" className="text-sm font-semibold text-zinc-700 transition hover:text-rose-600">홈</a>
                  <a href="#" className="text-sm font-bold text-rose-600 transition">파티 탐색</a>
                </nav>

                {/* Actions: 알림 / 로그인(마이페이지). 모바일에서도 보여야 로그인하고 신청할 수 있다. */}
                <div className="flex items-center gap-3">
                  {/* Notification Bell */}
                  <button 
                    onClick={() => setIsNotificationOpen(true)}
                    className="relative p-2 rounded-full hover:bg-zinc-100 transition text-zinc-600 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:ring-offset-2"
                    aria-label={`알림${unreadCount > 0 ? `, ${unreadCount}개 읽지 않음` : ''}`}
                  >
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                  <div className="flex items-start justify-between gap-4 mb-4">
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2 mb-2 flex-wrap">
                        <span className="px-2 py-0.5 rounded-full bg-rose-50 text-rose-700 text-[10px] font-medium">{activePartyDetail.category}</span>
                        <span className="px-2 py-0.5 rounded-full bg-zinc-100 text-zinc-700 text-[10px] font-medium">{activePartyDetail.region}</span>
                      </div>
                      <h3 id="party-detail-title" className="text-lg font-bold text-zinc-900 line-clamp-2">{activePartyDetail.title}</h3>
                    </div>
                    <button onClick={closePartyDetail} className="p-2 rounded-full hover:bg-zinc-100 transition flex-shrink-0" aria-label="닫기">
                      <svg className="w-5 h-5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                  </div>

                  {/* Application Flow */}
                  {applyStep === 'detail' && (
                    <div className="space-y-4">
                      {/* Venue & Schedule */}
                      <div className="grid grid-cols-2 gap-3 text-sm">
                        <div className="flex items-center gap-2 p-3 bg-zinc-50 rounded-xl">
                          <svg className="w-5 h-5 text-zinc-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                          <div>
                            <p className="text-[10px] text-zinc-500">장소</p>
                            <p className="font-medium text-zinc-900 truncate">{activePartyDetail.venue}</p>
                          </div>
                        </div>
                        <div className="flex items-center gap-2 p-3 bg-zinc-50 rounded-xl">
                          <svg className="w-5 h-5 text-zinc-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                          <div>
                            <p className="text-[10px] text-zinc-500">일정</p>
                            <p className="font-medium text-zinc-900">{activePartyDetail.days.join(', ')}</p>
                          </div>
                        </div>
                        <div className="flex items-center gap-2 p-3 bg-zinc-50 rounded-xl col-span-2">
                          <svg className="w-5 h-5 text-zinc-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                          <div>
                            <p className="text-[10px] text-zinc-500">주소</p>
                            <p className="font-medium text-zinc-900 truncate">{activePartyDetail.address}</p>
                          </div>
                        </div>
                      </div>

                      {/* Description */}
                      <div className="p-3 bg-zinc-50 rounded-xl">
                        <p className="text-xs text-zinc-500 mb-1">소개</p>
                        <p className="text-sm text-zinc-700 whitespace-pre-line">{activePartyDetail.desc}</p>
                      </div>

                      {/* Recruit Status */}
                      <div className="p-3 rounded-xl bg-white border border-zinc-200">
                        <div className="flex items-center justify-between">
                          <div>
                            <p className="text-xs text-zinc-500">모집 현황</p>
                            <p className="font-bold text-zinc-900">{activePartyDetail.currentRecruit} / {activePartyDetail.recruit}명</p>
                          </div>
                          <span className={`px-3 py-1 rounded-full text-[10px] font-bold ${activePartyDetail.currentRecruit >= activePartyDetail.recruit ? 'bg-rose-50 text-rose-600' : 'bg-emerald-50 text-emerald-600'}`}>
                            {activePartyDetail.currentRecruit >= activePartyDetail.recruit ? '모집 마감' : '모집 중'}
                          </span>
                        </div>
                      </div>

                      {/* Action Buttons */}
                      <div className="space-y-2">
                        <button
                          onClick={() => setApplyStep('form')}
                          disabled={activePartyDetail.currentRecruit >= activePartyDetail.recruit || hasApplied(activePartyDetail.id)}
                          className={`w-full py-3 rounded-xl text-sm font-bold transition min-h-[48px] ${
                            activePartyDetail.currentRecruit >= activePartyDetail.recruit
                              ? 'bg-zinc-200 text-zinc-500 cursor-not-allowed'
                              : hasApplied(activePartyDetail.id)
                                ? 'bg-emerald-100 text-emerald-700 cursor-not-allowed'
                                : 'bg-rose-600 text-white hover:bg-rose-700 shadow-md'
                          }`}
                        >
                          {activePartyDetail.currentRecruit >= activePartyDetail.recruit
                            ? "모집 마감"
                            : hasApplied(activePartyDetail.id)
                              ? "신청 완료"
                              : "파티 신청하기"}
                        </button>
                        <button
                          onClick={() => openMap(activePartyDetail)}
                          className="w-full py-3 rounded-xl text-sm font-semibold border border-zinc-200 bg-white text-zinc-700 hover:bg-zinc-50 transition min-h-[48px] flex items-center justify-center gap-2"
                        >
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                          카카오맵에서 보기
                        </button>
                      </div>
                    </div>
                  )}

                  {/* Application Form */}
                  {applyStep === 'form' && (
                    <form onSubmit={submitApplication} className="space-y-4">
                      <h3 className="text-lg font-bold text-zinc-900">파티 신청</h3>
                      <p className="text-sm text-zinc-500">{activePartyDetail.title}</p>
                      
                      {applyError && (
                        <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl text-sm text-rose-700" role="alert">
                          {applyError}
                        </div>
                      )}

                      <div>
                        <label htmlFor="apply-name" className="block text-sm font-medium text-zinc-700 mb-1">신청자 이름 <span className="text-rose-600">*</span></label>
                        <input
                          id="apply-name"
                          type="text"
                          value={applyForm.name}
                          onChange={(e) => setApplyForm({...applyForm, name: e.target.value})}
                          placeholder="이름을 입력해 주세요"
                          className="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-xl text-sm placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent"
                          autoComplete="name"
                          required
                        />
                      </div>

                      <div>
                        <label htmlFor="apply-phone" className="block text-sm font-medium text-zinc-700 mb-1">연락처 <span className="text-rose-600">*</span></label>
                        <input
                          id="apply-phone"
                          type="tel"
                          value={applyForm.phone}
                          onChange={(e) => setApplyForm({...applyForm, phone: e.target.value})}
                          placeholder="010-0000-0000"
                          className="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-xl text-sm placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent"
                          autoComplete="tel"
                          required
                        />
                      </div>

                      <div>
                        <label className="block text-sm font-medium text-zinc-700 mb-1">참여 일정 <span className="text-rose-600">*</span></label>
                        <div className="flex flex-wrap gap-2">
                          {activePartyDetail.days.map((day) => (
                            <label key={day} className="flex items-center gap-2 cursor-pointer">
                              <input
                                type="radio"
                                name="apply-day"
                                value={day}
                                checked={applyForm.day === day}
                                onChange={(e) => setApplyForm({...applyForm, day: e.target.value})}
                                className="w-4 h-4 text-rose-600 border-zinc-300 focus:ring-rose-500"
                              />
                              <span className="px-3 py-1.5 rounded-full text-sm font-medium border border-zinc-200 bg-white hover:bg-zinc-50 transition">{day}요일</span>
                            </label>
                          ))}
                        </div>
                      </div>

                      <label className="flex items-start gap-3 cursor-pointer">
                        <input
                          type="checkbox"
                          checked={applyForm.agree}
                          onChange={(e) => setApplyForm({...applyForm, agree: e.target.checked})}
                          className="mt-1 w-5 h-5 text-rose-600 border-zinc-300 rounded focus:ring-rose-500 focus:ring-2"
                          required
                        />
                        <div className="text-sm text-zinc-600">
                          <span className="font-medium text-zinc-900">파티 신청을 위한 개인정보 수집·이용 동의</span>
                          <a href="../#privacy" className="text-rose-600 hover:underline ml-1">(내용 보기)</a>
                        </div>
                      </label>

                      <div className="flex gap-2 pt-2">
                        <button
                          type="button"
                          onClick={() => setApplyStep('detail')}
                          className="flex-1 py-3 rounded-xl text-sm font-semibold border border-zinc-200 bg-white text-zinc-700 hover:bg-zinc-50 transition min-h-[48px]"
                        >
                          취소
                        </button>
                        <button
                          type="submit"
                          disabled={applySubmitting}
                          className={`flex-1 py-3 rounded-xl text-sm font-bold transition min-h-[48px] ${applySubmitting ? 'bg-zinc-300 cursor-not-allowed' : 'bg-rose-600 text-white hover:bg-rose-700 shadow-md'}`}
                        >
                          {applySubmitting ? '신청 중...' : '신청하기'}
                        </button>
                      </div>
                    </form>
                  )}

                  {/* Application Complete */}
                  {applyStep === 'done' && (
                    <div className="flex flex-col items-center justify-center p-12 text-center">
                      <div className="w-16 h-16 rounded-full bg-emerald-100 flex items-center justify-center mb-4">
                        <svg className="w-8 h-8 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
                        </svg>
                      </div>
                      <h3 className="text-lg font-bold text-zinc-900">신청이 접수되었습니다!</h3>
                      <p className="mt-2 text-sm text-zinc-500">
                        {live 
                          ? '실제 서버에 신청이 접수되었습니다. 알림을 기다려 주세요.' 
                          : '파티 신청이 완료되었습니다. (데모 모드 - 실제 서버 연동 시 알림 발송)'}
                      </p>
                      <button onClick={closePartyDetail} className="mt-6 w-full max-w-xs py-3 text-sm font-bold rounded-xl bg-rose-600 text-white hover:bg-rose-700 transition min-h-[48px]">
                        확인
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Notification Center */}
          {isNotificationOpen && (
            <div className="fixed inset-0 z-[60] flex items-start justify-end bg-black/60 p-4 backdrop-blur-sm animate-fade-in" onClick={() => setIsNotificationOpen(false)}>
              <div role="dialog" aria-modal="true" aria-labelledby="notification-title" onClick={e => e.stopPropagation()} className="animate-slide-up relative w-full max-w-md max-h-[80vh] rounded-2xl bg-white shadow-2xl flex flex-col">
                <div className="flex items-center justify-between border-b border-zinc-100 p-4">
                  <h3 id="notification-title" className="text-base font-bold text-zinc-900">알림</h3>
                  <div className="flex items-center gap-2">
                    {unreadCount > 0 && (
                      <button onClick={markAllAsRead} className="text-xs font-semibold text-rose-600 hover:underline">전체 읽음</button>
                    )}
                    <button onClick={() => setIsNotificationOpen(false)} className="p-2 rounded-full hover:bg-zinc-100 transition" aria-label="닫기">
                      <svg className="w-5 h-5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                  </div>
                </div>
                <div className="flex-1 overflow-y-auto">
                  {notifications.length === 0 ? (
                    <div className="p-8 text-center text-zinc-500">
                      <svg className="mx-auto w-12 h-12 text-zinc-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 17h5l-1.405-1.405A2.032 2.032 0 0018 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
                      <p>알림이 없습니다.</p>
                    </div>
                  ) : (
                    <ul className="divide-y divide-zinc-100">
                      {notifications.map((notif) => (
                        <li key={notif.id} className={`p-4 ${!notif.read ? 'bg-rose-50/50' : ''}`}>
                          <div className="flex items-start gap-3">
                            <div className={`w-2 h-2 rounded-full mt-2 flex-shrink-0 ${!notif.read ? 'bg-rose-500' : 'bg-zinc-300'}`} />
                            <div className="flex-1 min-w-0">
                              <p className={`font-medium text-zinc-900 ${!notif.read ? 'font-bold' : ''}`}>{notif.title}</p>
                              <p className="text-sm text-zinc-600 mt-0.5">{notif.message}</p>
                              <p className="text-xs text-zinc-400 mt-1">{new Date(notif.createdAt).toLocaleString('ko-KR')}</p>
                            </div>
                            <button onClick={() => { markAsRead(notif.id); deleteNotification(notif.id); }} className="p-1 text-zinc-400 hover:text-zinc-600" aria-label="알림 삭제">
                              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                            </button>
                          </div>
                        </li>
                      ))}
                    </ul>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* My Page Modal */}
          {isMyPageOpen && currentUser && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in" role="dialog" aria-modal="true" aria-label="마이페이지" onClick={() => setIsMyPageOpen(false)}>
              <div className="relative w-full max-w-2xl max-h-[90vh] bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col animate-slide-up" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between p-4 border-b border-zinc-200">
                  <h2 className="text-lg font-bold text-zinc-900">마이페이지</h2>
                  <button onClick={() => setIsMyPageOpen(false)} className="p-2 rounded-full hover:bg-zinc-100 transition" aria-label="닫기"><svg className="w-5 h-5 text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg></button>
                </div>
                <div className="p-4 border-b border-zinc-200">
                  <div className="flex items-center gap-3">
                    <span className="text-3xl" aria-hidden="true">{currentUser.avatar || '🟡'}</span>
                    <div>
                      <p className="font-semibold text-zinc-900">{currentUser.name}</p>
                      <p className="text-sm text-zinc-500">카카오 로그인</p>
                    </div>
                  </div>
                </div>
                <div className="flex-1 overflow-y-auto p-4">
                  <div>
                    <div className="flex items-center justify-between mb-3">
                      <h3 className="font-semibold text-zinc-900">내 신청 내역</h3>
                      {live && (
                        <button type="button" onClick={() => refreshApplications(false)} className="px-3 py-1.5 text-xs font-semibold text-zinc-700 border border-zinc-200 rounded-lg hover:bg-zinc-50 transition min-h-[32px]">상태 새로고침</button>
                      )}
                    </div>
                    {applications.length === 0 ? (
                      <div className="text-center py-8 text-zinc-500">
                        <svg className="mx-auto w-12 h-12 text-zinc-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" /></svg>
                        <p>신청한 파티가 없습니다.</p>
                        <button onClick={() => { setIsMyPageOpen(false); }} className="mt-3 inline-block text-sm font-semibold text-rose-600 hover:underline">파티 둘러보기</button>
                      </div>
                    ) : (
                      <div className="space-y-3">
                        {applications.map((app) => {
                          const status = getStatusLabel(app.status);
                          return (
                            <div key={app.id} className="p-3 bg-zinc-50 rounded-xl border border-zinc-100">
                              <div className="flex items-center justify-between">
                                <div>
                                  <p className="font-medium text-zinc-900">{app.partyTitle}</p>
                                  <p className="text-sm text-zinc-500">{app.day}요일 · {new Date(app.appliedAt).toLocaleDateString('ko-KR')}</p>
                                </div>
                                <span className={`px-2 py-1 rounded-full text-[10px] font-bold ${status.className}`}>{status.label}</span>
                              </div>
                              {app.status === 'APPLIED' && (
                                <button onClick={() => handleMyApplicationCancel(app)} className="mt-2 w-full py-2 text-sm font-medium text-rose-600 hover:text-rose-700 transition">신청 취소</button>
                              )}
                              {app.status === 'APPROVED' && app.visitCode && (
                                <div className="mt-2 p-2 bg-emerald-50 rounded-lg text-sm text-emerald-700">방문 인증 코드: <span className="font-mono font-bold">{app.visitCode}</span></div>
                              )}
                              <ApplicationExtras application={app} onChanged={handleMissionSubmitted} />
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </div>
                <div className="border-t border-zinc-200 p-4">
                  <button onClick={handleLogout} className="w-full px-4 py-2 text-sm font-medium text-rose-600 hover:text-rose-700 transition">로그아웃</button>
                </div>
              </div>
            </div>
          )}

          {/* Login Modal */}
          {isLoginModalOpen && (
            <LoginModal 
              isOpen={isLoginModalOpen}
              onClose={() => setIsLoginModalOpen(false)}
              onLogin={handleLogin}
              isLoading={loginLoading}
              isLive={live}
            />
          )}

          {/* Welcome Toast */}
          {welcomeToast.show && (
            <WelcomeToast 
              isOpen={welcomeToast.show}
              onClose={() => setWelcomeToast({ show: false, isNewUser: false })}
              isNewUser={welcomeToast.isNewUser}
            />
          )}

          {/* Error Toast */}
          {errorToast.show && (
            <ErrorToast 
              message={errorToast.message}
              onClose={() => setErrorToast({ show: false, message: '' })}
            />
          )}

          {/* Global Toast */}
          {toastMessage && (
            <div className="fixed bottom-4 right-4 z-50 animate-slide-up">
              <div className="bg-zinc-900 text-white px-4 py-3 rounded-xl shadow-xl text-sm max-w-xs">
                {toastMessage}
              </div>
            </div>
          )}
        </>
      );
    }

    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PartyConnectApp />);
  </script>
</body>
</html>
