<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 처리 중 - HypeConnect</title>
  <link rel="icon" type="image/svg+xml" href="../assets/hypeconnect-icon.svg">
  
  <!-- SEO -->
  <meta name="robots" content="noindex, nofollow">
  
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
          },
          colors: {
            brand: {
              primary: '#E11D48',
              secondary: '#FB7185',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

  <!-- Shared Config & Auth Modules -->
  <script src="../../js/party-data.js"></script>
  <script>
    // 콜백 페이지도 메인·관리자와 같은 Supabase 설정이 있어야 실서비스 모드로 로그인을 마칠 수 있다.
    // 값은 index.html, admin/index.html과 동일하게 유지한다 (publishable key만, 비밀키 금지).
    window.PARTYLINK_CONFIG = {
      supabaseUrl: "https://cpctedhhojmbycnqhzli.supabase.co",
      supabaseAnonKey: "sb_publishable_JEWNbxlUSWRkyVePlejC_A_I0WlLi6e",
    };
  </script>
  <script src="../../js/auth-client.js"></script>
  <script src="../../js/auth-service.js"></script>
  <script src="../../js/auth-ui.js"></script>

  <style>
    :root {
      --color-primary: #E11D48;
      --color-secondary: #FB7185;
      --color-background: #FFFFFF;
      --color-text-main: #18181B;
      --color-text-muted: #71717A;
      --color-border: #E4E4E7;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: var(--color-background);
      color: var(--color-text-main);
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .animate-fade-in { animation: fade-in 0.3s ease-out both; }
    .animate-spin { animation: spin 1s linear infinite; }
  </style>
</head>
<body class="min-h-screen bg-white text-zinc-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;
    const { AuthProcessingScreen, OnboardingConsent } = window.PARTYLINK_AUTH_UI;
    const { handleCallback, restoreSession, AUTH_STATE, saveReturnUrl, consumeReturnUrl, completeOnboarding } = window.PARTYLINK_AUTH_SERVICE;
    const { live, client } = window.PARTYLINK_AUTH;

    function CallbackApp() {
      const [state, setState] = useState('processing'); // processing, success, error, redirecting
      const [message, setMessage] = useState('카카오 로그인을 확인하고 있어요.');
      const [subMessage, setSubMessage] = useState('잠시 후 자동으로 이동해요.');
      const [returnInfo, setReturnInfo] = useState(null);
      const [errorInfo, setErrorInfo] = useState(null);
      const [onboardingUser, setOnboardingUser] = useState(null);
      const [onboardingError, setOnboardingError] = useState(null);
      const [onboardingLoading, setOnboardingLoading] = useState(false);
      const basePath = window.PARTYLINK_AUTH_SERVICE.getBasePath();

      useEffect(() => {
        // Consume return URL info
        const info = consumeReturnUrl();
        setReturnInfo(info);

        // Handle OAuth callback
        const processCallback = async () => {
          try {
            // Check for error params from Kakao/Supabase (login cancelled or error)
            const params = new URLSearchParams(window.location.search);
            const error = params.get('error');
            const errorDescription = params.get('error_description');
            
            if (error) {
              setErrorInfo({ error, errorDescription });
              setState('error');
              setMessage('로그인이 취소되었거나 실패했습니다.');
              setSubMessage(errorDescription || '다시 시도해 주세요.');
              return;
            }

            // Process callback - this will wait for session via detectSessionInUrl
            const result = await handleCallback();
            
            if (result.needsOnboarding) {
              setOnboardingUser(result.user);
              setState('onboarding');
            } else {
              setState('success');
              setMessage('로그인이 완료되었습니다!');
              setSubMessage('원래 페이지로 이동해요.');
              
              // Redirect after short delay
              setTimeout(() => {
                redirectToReturnPage(info);
              }, 1500);
            }
          } catch (error) {
            console.error('Callback error:', error);
            setState('error');
            setMessage('로그인에 실패했어요.');
              setSubMessage(error.message || '다시 시도해 주세요.');
          }
        };

        processCallback();
      }, []);

      const redirectToReturnPage = (info) => {
        let targetPath = basePath;
        
        if (info && info.returnPath) {
          // Validate it's an internal path (same origin, no open redirect)
          if (info.returnPath.startsWith('/') && !info.returnPath.startsWith('//')) {
            // Only allow paths under our base path
            if (info.returnPath.startsWith(basePath)) {
              targetPath = info.returnPath;
            }
          }
        }
        
        // If partyId and intent=apply, ensure we go to party-connect
        if (info && info.partyId && info.intent === 'apply') {
          // Ensure we're on the party-connect page
          if (!targetPath.includes('/party-connect/')) {
            targetPath = basePath + 'party-connect/';
          }
        }
        
        // Clean URL - remove auth params
        window.location.href = targetPath;
      };

      const handleRetry = () => {
        setState('processing');
        setMessage('카카오 로그인을 확인하고 있어요.');
        setSubMessage('잠시 후 자동으로 이동해요.');
        setErrorInfo(null);
        // Reload to restart OAuth flow
        window.location.reload();
      };

      const handleGoHome = () => {
        window.location.href = basePath;
      };

      const handleOnboardingSubmit = async (consentData) => {
        setOnboardingLoading(true);
        setOnboardingError(null);
        try {
          await completeOnboarding(consentData);
          // Success - redirect to return page
          redirectToReturnPage(returnInfo);
        } catch (error) {
          console.error('Onboarding error:', error);
          // Check if it's a 404 or network error
          const isNetworkError = error instanceof TypeError || error.message.includes('fetch') || error.message.includes('network') || error.message.includes('Failed to fetch');
          const is404 = error.status === 404 || error.message.includes('404');
          if (isNetworkError || is404) {
            setOnboardingError('가입 동의 저장에 실패했어요. 서버가 준비되면 다시 시도해 주세요.');
          } else {
            setOnboardingError(error.message || '가입 동의 저장에 실패했어요. 다시 시도해 주세요.');
          }
        } finally {
          setOnboardingLoading(false);
        }
      };

      const handleOnboardingClose = () => {
        // User clicked '나중에 하기' - redirect to base path
        window.location.href = basePath;
      };

      // Render error state with user-friendly screen
      if (state === 'error') {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-white">
            <div className="text-center animate-fade-in max-w-md">
              <div className="text-xl font-extrabold tracking-tighter text-zinc-950 mb-4">
                {'PARTY'}<span className="text-rose-600">connect</span>
              </div>
              <div className="w-16 h-16 mx-auto mb-4 rounded-full bg-rose-50 flex items-center justify-center">
                <svg className="w-8 h-8 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
              </div>
              <p className="text-zinc-700 mb-2">{message}</p>
              <p className="text-zinc-500 text-sm mb-6">{subMessage}</p>
              {errorInfo && (
                <details className="text-left text-xs text-zinc-400 mb-4 p-3 bg-zinc-50 rounded-lg">
                  <summary className="cursor-pointer font-medium text-zinc-500">오류 상세 보기</summary>
                  <pre className="mt-2 whitespace-pre-wrap">{'코드: ' + errorInfo.error + '\n메시지: ' + (errorInfo.errorDescription || '없음')}</pre>
                </details>
              )}
              <div className="space-y-3">
                <button onClick={handleRetry} className="w-full px-4 py-3 rounded-xl text-sm font-bold bg-rose-600 text-white hover:bg-rose-700 transition min-h-[48px]">
                  다시 로그인 시도
                </button>
                <button onClick={handleGoHome} className="w-full px-4 py-3 rounded-xl text-sm font-medium border border-zinc-200 text-zinc-700 hover:bg-zinc-50 transition min-h-[48px]">
                  메인으로 돌아가기
                </button>
              </div>
            </div>
          </div>
        );
      }

      // Render onboarding state
      if (state === 'onboarding') {
        if (!onboardingUser) {
          // Fallback if user not set
          window.location.href = basePath;
          return null;
        }
        return (
          <OnboardingConsent
            user={onboardingUser}
            onSubmit={handleOnboardingSubmit}
            onClose={handleOnboardingClose}
            isLoading={onboardingLoading}
          />
        );
      }

      // Render processing/success state
      return (
        <AuthProcessingScreen 
          message={message} 
          subMessage={subMessage}
        />
      );
    }

    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CallbackApp />);
  </script>
</body>
</html>
