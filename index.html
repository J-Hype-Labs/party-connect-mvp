        avatarBg: "bg-orange-100 text-orange-700",

        comment: "신림에서 이렇게 조용한 혼술바가 있다니 놀랐어요. 안주도 깔끔하고 무엇보다 혼자 와도 눈치 보이지 않는 분위기가 최고입니다. 다음엔 친구도 데려올게요.",

    const PARTNERS = [
      "야화 혼술바 왕십리점", "홍대혼술바 시점", "만남회관", "제로러브", 
      "솔로몬파티", "제주보름 분당야탑점", "제주보름 천호점", "LOVE ATTACK", 
      "43번지 혼술바 을지로점", "동률 혼술바", "제주아홉 동인천점", "살롱드솔내",
      "레몬과김부각", "혼술바 고도 잠실점"
    ];

    // --- Main Application Component ---
    function App() {
      // Filter states
      const [selectedRegion, setSelectedRegion] = useState("전체 지역");
      const [selectedDay, setSelectedDay] = useState("전체");
      const [selectedCategory, setSelectedCategory] = useState("전체");
      
      // Wishlist (favorites) state — persisted in localStorage
      const [wishlist, setWishlist] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem("partyconnect:wishlist") || "[]");
          return new Set(Array.isArray(saved) ? saved : []);
        } catch (e) {
          return new Set();
        }
      });

      // 체험단 신청 내역 — persisted in localStorage
      const [applications, setApplications] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem("partyconnect:applications") || "[]");
          return Array.isArray(saved) ? saved : [];
        } catch (e) {
          return [];
        }
      });

      // Banner carousel state
      const [currentBanner, setCurrentBanner] = useState(0);
      const [isBannerPaused, setIsBannerPaused] = useState(false);

      // Dialog states
      const [isRegionModalOpen, setIsRegionModalOpen] = useState(false);
      const [activePartyDetail, setActivePartyDetail] = useState(null);
      const [toastMessage, setToastMessage] = useState("");

      // Party detail modal flow: detail -> form -> done
      const [applyStep, setApplyStep] = useState("detail");
      const [applyForm, setApplyForm] = useState({ name: "", phone: "", day: "", agree: false });
      const [applyError, setApplyError] = useState("");

      // Reviews "전체보기" toggle
      const [showAllReviews, setShowAllReviews] = useState(false);

      // Region modal helper state
      const [modalSelectedCategory, setModalSelectedCategory] = useState("seoul");
      const [selectedDetailImage, setSelectedDetailImage] = useState(0);

      // Banner Auto-play
      useEffect(() => {
        if (isBannerPaused) return;
        const timer = setInterval(() => {
          setCurrentBanner((prev) => (prev + 1) % BANNER_SLIDES.length);
        }, 4500);
        return () => clearInterval(timer);
      }, [isBannerPaused]);

      // Trigger lucide icons render on update
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Persist wishlist & applications (localStorage)
      useEffect(() => {
        try {
          localStorage.setItem("partyconnect:wishlist", JSON.stringify(Array.from(wishlist)));
        } catch (e) {}
      }, [wishlist]);

      useEffect(() => {
        try {
          localStorage.setItem("partyconnect:applications", JSON.stringify(applications));
        } catch (e) {}
      }, [applications]);

      // Close modals on ESC
      useEffect(() => {
        const onKeyDown = (event) => {
          if (event.key !== "Escape") return;
          setIsRegionModalOpen(false);
          setActivePartyDetail(null);
          setApplyStep("detail");
          setApplyError("");
        };
        window.addEventListener("keydown", onKeyDown);
        return () => window.removeEventListener("keydown", onKeyDown);
      }, []);

      // Lock body scroll while a modal is open
      useEffect(() => {
        const hasModal = isRegionModalOpen || Boolean(activePartyDetail);
        document.body.style.overflow = hasModal ? "hidden" : "";
        return () => { document.body.style.overflow = ""; };
      }, [isRegionModalOpen, activePartyDetail]);

      // Show toast
      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(""), 2500);
      };

      // Toggle wishlist
      const toggleWishlist = (e, partyId) => {
        e.preventDefault();
        e.stopPropagation();
        setWishlist((prev) => {
          const next = new Set(prev);
          if (next.has(partyId)) {
            next.delete(partyId);
            showToast("관심 파티에서 삭제되었습니다.");
          } else {
            next.add(partyId);
            showToast("관심 파티에 추가되었습니다! (찜 목록)");
          }
          return next;
        });
      };

      // Open / close party detail modal
      const openPartyDetail = (party) => {
        setActivePartyDetail(party);
        setApplyStep("detail");
        setApplyError("");
        setApplyForm({ name: "", phone: "", day: party.days[0] || "", agree: false });
        setSelectedDetailImage(0);
      };

      const closePartyDetail = () => {
        setActivePartyDetail(null);
        setApplyStep("detail");
        setApplyError("");
      };

      const hasApplied = (partyId) => applications.some((a) => a.partyId === partyId);

      // Submit free trial application
      const submitApplication = (e) => {
        e.preventDefault();
        if (!activePartyDetail) return;

        const name = applyForm.name.trim();
        const phone = applyForm.phone.replace(/[^0-9]/g, "");

        if (name.length < 2) {
          setApplyError("이름을 2자 이상 입력해 주세요.");
          return;
        }
        if (phone.length < 10 || phone.length > 11) {
          setApplyError("연락처를 정확히 입력해 주세요. (예: 01012345678)");
          return;
        }
        if (!applyForm.day) {
          setApplyError("참여할 요일을 선택해 주세요.");
          return;
        }
        if (!applyForm.agree) {
          setApplyError("개인정보 수집 및 이용에 동의해 주세요.");
          return;
        }

        const application = {
          id: activePartyDetail.id + "-" + Date.now(),
          partyId: activePartyDetail.id,
          partyTitle: activePartyDetail.title,
          venue: activePartyDetail.venue,
          day: applyForm.day,
          name,
          phone,
          appliedAt: new Date().toISOString(),
        };

        setApplications((prev) => [application, ...prev]);
        setApplyError("");
        setApplyStep("done");
      };

      // Status badge helpers (spec 3: NEW / 이벤트 / 마감임박)
      const getBadges = (party) => {
        const remaining = party.recruit - party.currentRecruit;
        const badges = party.badges.filter((badge) => !(remaining <= 0 && badge === "마감임박"));
        if (remaining <= 0) {
          if (!badges.includes("마감")) badges.push("마감");
        } else if (remaining <= 2 && !badges.includes("마감임박")) {
          badges.push("마감임박");
        }
        return badges;
      };

      const badgeClass = (badge) => {
        if (badge === "NEW") return "bg-rose-600";
        if (badge === "이벤트") return "bg-amber-500";
        if (badge === "마감임박") return "bg-orange-500";
        return "bg-zinc-800";
      };

      // Filtered parties
      const filteredParties = useMemo(() => {
        return PARTY_LIST.filter((party) => {
          // Region filter
          if (selectedRegion !== "전체 지역" && selectedRegion !== "전체") {
            if (!party.region.includes(selectedRegion)) return false;
          }
          // Day filter
          if (selectedDay !== "전체") {
            if (!party.days.includes(selectedDay)) return false;
          }
          // Category filter
          if (selectedCategory !== "전체") {
            if (party.category !== selectedCategory) return false;
          }
          return true;
        });
      }, [selectedRegion, selectedDay, selectedCategory]);

      // 참여 가능한(잔여석이 있는) 파티 수 — 실시간 동기화
      const availableCount = useMemo(
        () => filteredParties.filter((party) => party.currentRecruit < party.recruit).length,
        [filteredParties]
      );

      // Region modal sub-region list ("전체 지역" 탭은 모든 세부 지역 노출)
      const modalRegions = useMemo(() => {
        if (modalSelectedCategory === "all") {
          const merged = REGION_CATEGORIES
            .filter((category) => category.id !== "all")
            .reduce((acc, category) => acc.concat(category.subRegions), []);
          return ["전체"].concat(Array.from(new Set(merged.filter((region) => region !== "전체"))));
        }
        const found = REGION_CATEGORIES.find((category) => category.id === modalSelectedCategory);
        return found ? found.subRegions : ["전체"];
      }, [modalSelectedCategory]);

      const visibleReviews = showAllReviews ? REVIEWS : REVIEWS.slice(0, 4);

      const latestApplicationForDetail = activePartyDetail
        ? applications.find((application) => application.partyId === activePartyDetail.id)
        : null;

      return (
        <div className="flex min-h-screen flex-col bg-white">
          
          {/* Toast Notification */}
          {toastMessage && (
            <div
              role="status"
              aria-live="polite"
              className="animate-slide-up fixed bottom-6 left-1/2 z-[60] -translate-x-1/2 transform rounded-full bg-zinc-900/90 px-5 py-2.5 text-xs font-medium text-white shadow-lg backdrop-blur-md"
            >
              {toastMessage}
            </div>
          )}

          {/* ================= HEADER ================= */}
          <header className="sticky top-0 z-40 border-b border-black/[.08] bg-white/95 backdrop-blur-md">
            <div className="mx-auto flex w-full max-w-6xl items-center justify-between px-4 py-2.5 sm:px-6 lg:px-8">
              
              {/* Brand Logo & Nav */}
              <div className="flex items-center gap-6 md:gap-8">
                <a href="#" className="flex items-center gap-1.5 focus:outline-none">
                  <div className="flex items-center">
                    <span className="text-xl font-extrabold tracking-tighter text-zinc-950 sm:text-2xl">
                      PARTY<span className="text-rose-600">connect</span>
                    </span>
                  </div>
                </a>

                {/* Desktop Nav Items */}
                <nav className="hidden items-center gap-6 md:flex">
                  <a href="#parties" className="text-sm font-semibold text-zinc-900 transition hover:text-rose-600">체험단</a>
                  <a href="#parties" className="text-sm font-bold text-rose-600 transition">파티커넥트</a>
                  <a href="#parties" className="inline-flex items-center gap-1 text-sm font-semibold text-zinc-700 transition hover:text-rose-600">
                    러브커넥트
                    <span className="rounded-full bg-rose-100 px-1.5 py-0.2 text-[10px] font-bold text-rose-600">HOT</span>
                  </a>
                  <a href="#reviews" className="text-sm font-semibold text-zinc-700 transition hover:text-rose-600">커뮤니티</a>
                  <a href="#partners" className="text-sm font-semibold text-zinc-500 transition hover:text-zinc-900">제휴신청</a>
                </nav>

                  <div

                  >
                    <img
                      src={slide.img}
                      alt={slide.title}
                      className="absolute inset-0 h-full w-full object-cover brightness-[0.65]"
                    />

                      <span className="mb-2 inline-flex w-fit items-center rounded-full bg-rose-600 px-2.5 py-0.5 text-xs font-bold tracking-wide text-white shadow-sm">
                        {slide.badge}

                        {slide.title}

                      <p className="mt-1.5 max-w-xl text-xs text-zinc-300 sm:text-sm">

                  <button
                    onClick={() => setIsBannerPaused(!isBannerPaused)}

                      <span className="text-[10px]">▶</span>

                      <span className="text-[10px]">❚❚</span>

                  </button>
                </div>

            {/* --- INTRO VALUE PROPOSITION --- */}
            <section className="mb-10 text-center sm:mb-12">

                    <span className="text-base font-bold">✨</span>
                  </div>
                  <h3 className="text-sm font-bold text-zinc-900 sm:text-base">

                  <p className="mt-1 text-xs leading-relaxed text-zinc-600 sm:text-sm">

                  </p>

                <div className="rounded-2xl border border-zinc-100 bg-zinc-50/80 p-5 transition hover:shadow-sm">
                  <div className="mb-2 inline-flex size-8 items-center justify-center rounded-lg bg-amber-100 text-amber-600">
                    <span className="text-base font-bold">🍷</span>
                  </div>
                  <h3 className="text-sm font-bold text-zinc-900 sm:text-base">
                    매일을 파티처럼 즐겨요, 파티커넥트

                  <p className="mt-1 text-xs leading-relaxed text-zinc-600 sm:text-sm">

                  </p>
                </div>
              </div>
            </section>

            {/* --- REAL REVIEWS CAROUSEL --- */}
            <section id="reviews" className="mb-12">
              <div className="flex items-center justify-between mb-4">
                <div>
                  <h2 className="text-lg font-bold text-zinc-900 sm:text-xl">파티커넥트 멤버 실제후기</h2>
                  <p className="text-xs text-zinc-500 mt-0.5">실제 예약 후, 방문까지 완료하여야 작성할 수 있는 검증된 리뷰</p>
                </div>
                <button

                  onClick={() => setShowAllReviews((prev) => !prev)}
                  aria-expanded={showAllReviews}
                  className="text-xs font-semibold text-zinc-500 transition hover:text-zinc-900"
                >
                  {showAllReviews ? "접기" : "전체보기"} &gt;
                </button>
              </div>

              {/* Review Cards Grid */}
              <div className="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-4">
                {visibleReviews.map((r) => (
                  <div key={r.id} className="flex flex-col justify-between rounded-xl border border-zinc-200/80 bg-white p-4 shadow-sm hover:border-zinc-300">
                    <div>
                      {/* Reviewer Header */}

                        <div className={`flex size-9 shrink-0 items-center justify-center rounded-full font-bold text-sm ${r.avatarBg}`}>

                          <p className="truncate text-xs font-bold text-zinc-900">{r.name}</p>

                <button

                  <p className="mt-1 text-xs text-zinc-500">지역이나 요일 필터를 전체로 변경해 보세요.</p>
                  <button
                    onClick={() => { setSelectedRegion("전체 지역"); setSelectedDay("전체"); setSelectedCategory("전체"); }}
                    className="mt-4 rounded-lg bg-zinc-900 px-4 py-2 text-xs font-semibold text-white hover:bg-zinc-800"
                  >
                    필터 초기화
                  </button>
                </div>
              ) : (
                <div className="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2 md:gap-6 lg:grid-cols-4">
                  {filteredParties.map((party) => {
                    const isWished = wishlist.has(party.id);
                    return (
                      <div
                        key={party.id}
                        role="button"
                        tabIndex={0}
                        onClick={() => openPartyDetail(party)}
                        onKeyDown={(event) => {
                          if (event.key === "Enter" || event.key === " ") {
                            event.preventDefault();
                            openPartyDetail(party);
                          }
                        }}
                        className="group relative flex cursor-pointer flex-col overflow-hidden rounded-xl border border-zinc-200/90 bg-white transition-all hover:-translate-y-0.5 hover:shadow-md"
                      >
                        {/* Thumbnail Image Container */}
                        <div className="relative aspect-square w-full overflow-hidden bg-zinc-100">
                          <img
                            src={party.images[0]}
                            alt={party.title}
                            loading="lazy"
                            onError={(event) => { event.currentTarget.style.visibility = "hidden"; }}
                            className="h-full w-full object-cover transition-transform duration-300 group-hover:scale-105"
                          />
                          
                          {/* Badges Overlay */}
                          <div className="absolute left-2.5 top-2.5 z-10 flex flex-wrap gap-1">
                            {getBadges(party).map((b) => (
                              <span
                                key={b}
                                className={`rounded px-1.5 py-0.5 text-[10px] font-bold text-white shadow-sm ${badgeClass(b)}`}
                              >
                                {b}
                              </span>
                            ))}
                          </div>

                          {/* Wishlist Heart Button */}
                          <button
                            type="button"
                            onClick={(e) => toggleWishlist(e, party.id)}
                            onKeyDown={(event) => event.stopPropagation()}
                            aria-label={isWished ? "찜 해제" : "찜하기"}
                            aria-pressed={isWished}
                            className="absolute bottom-2.5 right-2.5 z-20 flex size-8 items-center justify-center rounded-full bg-black/40 text-white backdrop-blur-[2px] transition hover:bg-black/60"
                          >
                            <span className={`text-sm ${isWished ? "text-rose-500" : "text-white"}`}>
                              {isWished ? "❤️" : "🤍"}
                            </span>
                          </button>
                        </div>

                        {/* Card Meta & Title */}
                        <div className="flex flex-1 flex-col p-3.5">
                          <p className="text-[11px] font-bold text-zinc-900">
                            {party.region} <span className="font-normal text-zinc-400">·</span> 모집 {party.recruit}명
                          </p>
                          <h3 className="mt-1 line-clamp-2 text-sm font-extrabold leading-snug text-zinc-900 group-hover:text-rose-600">
                            {party.title}
                          </h3>
                          <p className="mt-1 line-clamp-2 text-[11px] leading-relaxed text-zinc-500">
                            {party.desc}
                          </p>
                          
                          {/* Card Footer tags */}
                          <div className="mt-auto pt-3 flex items-center justify-between text-[11px]">
                            <span className={`font-medium ${party.currentRecruit >= party.recruit ? "text-zinc-400" : "text-rose-600"}`}>
                              {party.currentRecruit >= party.recruit
                                ? `마감 ${party.currentRecruit}/${party.recruit}명`
                                : `신청 ${party.currentRecruit}/${party.recruit}명`}
                            </span>
                            <span className="rounded bg-zinc-100 px-1.5 py-0.5 text-zinc-600">
                              {party.category}
                            </span>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </section>

            {/* --- PARTNER BRANDS GRID --- */}
            <section id="partners" className="mt-16 mb-12 border-t border-zinc-200 pt-10">
              <h2 className="text-center text-sm font-bold tracking-tight text-zinc-900 sm:text-base">
                파티커넥트와 함께하는 제휴사들
              </h2>
              <div className="mt-6 flex flex-wrap justify-center gap-2 sm:gap-2.5">
                {PARTNERS.map((p) => (
                  <span
                    key={p}
                    className="rounded-full border border-zinc-200 bg-white px-3.5 py-1.5 text-xs font-medium text-zinc-700 shadow-sm transition hover:border-zinc-300 hover:text-zinc-950"
                  >
                    {p}
                  </span>
                ))}
              </div>
            </section>

          </main>

          {/* ================= FOOTER ================= */}
          <footer className="border-t border-zinc-200 bg-zinc-50 py-10 text-xs text-zinc-500">
            <div className="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
              
              {/* Policies nav */}
              <div className="flex flex-wrap gap-4 font-medium text-zinc-700">
                <a href="#" className="hover:underline">개인정보 처리방침</a>
                <span>·</span>
                <a href="#" className="hover:underline">이메일 무단수집거부</a>
                <span>·</span>
                <a href="#" className="hover:underline">이용약관</a>
              </div>

              {/* Business info table */}
              <div className="mt-6 grid grid-cols-2 gap-y-1.5 text-[11px] sm:grid-cols-4 leading-relaxed">
                <div>
                  <span className="text-zinc-400">업체명: </span>
                  <span className="text-zinc-700 font-semibold">루미랩</span>
                </div>
                <div>
                  <span className="text-zinc-400">대표자: </span>
                  <span className="text-zinc-700">김혜원</span>
                </div>
                <div>
                  <span className="text-zinc-400">사업자등록번호: </span>
                  <span className="text-zinc-700">884-05-03114</span>
                </div>
                <div>
                  <span className="text-zinc-400">전화번호: </span>
                  <span className="text-zinc-700">010-5390-8692</span>
                </div>
                <div className="col-span-2 sm:col-span-4">
                  <span className="text-zinc-400">E-mail: </span>
                  <span className="text-zinc-700">lea@boutiquedelea.com</span>
                </div>
              </div>

              <div className="mt-6 border-t border-zinc-200 pt-4 flex flex-wrap items-center justify-between gap-2">
                <p className="text-[11px] text-zinc-400">
                  Copyright &copy; 2026 PARTY CONNECT. All Rights Reserved.
                </p>
                <button
                  onClick={() => showToast("비즈니스 제휴 문의 이메일로 연결됩니다.")}
                  className="font-semibold text-rose-600 hover:underline"
                >
                  비즈니스 문의 &rarr;
                </button>
              </div>
            </div>
          </footer>

          {/* ================= REGION SELECTOR MODAL ================= */}
          {isRegionModalOpen && (
            <div
              className="animate-fade-in fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4 backdrop-blur-sm"
              onClick={() => setIsRegionModalOpen(false)}
            >
              <div
                role="dialog"
                aria-modal="true"
                aria-labelledby="region-modal-title"
                onClick={(event) => event.stopPropagation()}
                className="animate-slide-up relative w-full max-w-lg rounded-2xl bg-white p-6 shadow-2xl"
              >
                
                {/* Modal Header */}
                <div className="flex items-center justify-between border-b border-zinc-100 pb-3">
                  <h3 id="region-modal-title" className="text-base font-bold text-zinc-900">지역 선택</h3>
                  <button
                    type="button"
                    onClick={() => setIsRegionModalOpen(false)}
                    aria-label="지역 선택 닫기"
                    className="size-7 rounded-full text-zinc-400 transition hover:bg-zinc-100 hover:text-zinc-700"
                  >
                    ✕
                  </button>
                </div>

                {/* Main Region Category Tabs */}
                <div role="tablist" aria-label="지역 대분류" className="mt-4 flex border-b border-zinc-200">
                  {REGION_CATEGORIES.map((cat) => (
                    <button
                      key={cat.id}
                      type="button"
                      role="tab"
                      aria-selected={modalSelectedCategory === cat.id}
                      onClick={() => setModalSelectedCategory(cat.id)}
                      className={`flex-1 py-2 text-center text-xs font-bold transition border-b-2 ${
                        modalSelectedCategory === cat.id
                          ? "border-rose-600 text-rose-600"
                          : "border-transparent text-zinc-500 hover:text-zinc-800"
                      }`}
                    >
                      {cat.name}
                    </button>
                  ))}
                </div>

                {/* Sub Regions Grid */}
                <div className="mt-4 max-h-60 overflow-y-auto pr-1">
                  <div className="grid grid-cols-3 gap-2">
                    {modalRegions.map((sub) => {
                      const regionValue = sub === "전체" ? "전체 지역" : sub;
                      const isSelected = selectedRegion === regionValue;
                      return (
                        <button
                          key={sub}
                          type="button"
                          aria-pressed={isSelected}
                          onClick={() => {
                            setSelectedRegion(regionValue);
                            setIsRegionModalOpen(false);
                            showToast(`'${regionValue}'이(가) 선택되었습니다.`);
                          }}
                          className={`rounded-lg p-2.5 text-xs font-semibold text-center transition ${
                            isSelected
                              ? "bg-rose-600 text-white shadow-sm"
                              : "bg-zinc-50 text-zinc-700 hover:bg-zinc-100"
                          }`}
                        >
                          {sub}
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Modal Footer */}
                <div className="mt-6 flex items-center justify-between gap-2 border-t border-zinc-100 pt-3">
                  <p className="text-[11px] text-zinc-400">
                    현재 선택: <strong className="font-bold text-rose-600">{selectedRegion}</strong>
                  </p>
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => {
                        setSelectedRegion("전체 지역");
                        setIsRegionModalOpen(false);
                      }}
                      className="rounded-lg px-4 py-2 text-xs font-semibold text-zinc-600 transition hover:bg-zinc-100"
                    >
                      전체 선택
                    </button>
                    <button
                      type="button"
                      onClick={() => setIsRegionModalOpen(false)}
                      className="rounded-lg bg-zinc-900 px-5 py-2 text-xs font-semibold text-white transition hover:bg-zinc-800"
                    >
                      닫기
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ================= PARTY DETAIL MODAL ================= */}
          {activePartyDetail && (
            <div
              className="animate-fade-in fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4 backdrop-blur-sm"
              onClick={closePartyDetail}
            >
              <div
                role="dialog"
                aria-modal="true"
                aria-labelledby="party-detail-title"
                onClick={(event) => event.stopPropagation()}
                className="animate-slide-up relative flex max-h-[92vh] w-full max-w-lg flex-col overflow-hidden rounded-2xl bg-white shadow-2xl"
              >
                
                {/* Modal Image */}
                <div className="relative h-52 w-full shrink-0 bg-zinc-900">
                  <img
                    src={activePartyDetail.images[selectedDetailImage] || activePartyDetail.images[0]}
                    alt={activePartyDetail.title}
                    onError={(event) => { event.currentTarget.style.visibility = "hidden"; }}
                    className="h-full w-full object-cover"
                  />

                  {/* Status badges */}
                  <div className="absolute left-3 top-3 z-10 flex flex-wrap gap-1">
                    {getBadges(activePartyDetail).map((badge) => (
                      <span
                        key={badge}
                        className={`rounded px-1.5 py-0.5 text-[10px] font-bold text-white shadow-sm ${badgeClass(badge)}`}
                      >
                        {badge}
                      </span>
                    ))}
                  </div>

                  {/* Image indicators */}
                  {activePartyDetail.images.length > 1 && (
                    <div className="absolute bottom-3 left-3 z-10 flex gap-1.5">
                      {activePartyDetail.images.map((image, index) => (
                        <button
                          key={image}
                          type="button"
                          onClick={() => setSelectedDetailImage(index)}
                          aria-label={`이미지 ${index + 1} 보기`}
                          className={`h-1.5 rounded-full transition-all ${
                            index === selectedDetailImage ? "w-5 bg-white" : "w-1.5 bg-white/50 hover:bg-white/80"
                          }`}
                        />
                      ))}
                    </div>
                  )}

                  <button
                    type="button"
                    onClick={closePartyDetail}
                    aria-label="상세 닫기"
                    className="absolute right-3 top-3 z-10 flex size-8 items-center justify-center rounded-full bg-black/60 text-white backdrop-blur-md transition hover:bg-black/80"
                  >
                    ✕
                  </button>
                </div>

                {/* Scrollable Content */}
                <div className="overflow-y-auto p-6">

                  {/* ---------- STEP 1: DETAIL ---------- */}
                  {applyStep === "detail" && (
                    <>
                      <div className="flex items-center justify-between">
                        <span className="rounded bg-rose-50 px-2 py-0.5 text-xs font-bold text-rose-600">
                          {activePartyDetail.category}
                        </span>
                        <span className="text-xs font-semibold text-zinc-500">
                          신청 현황: {activePartyDetail.currentRecruit} / {activePartyDetail.recruit}명
                        </span>
                      </div>

                      <h3 id="party-detail-title" className="mt-2 text-lg font-bold text-zinc-900">
                        {activePartyDetail.title}
                      </h3>

                      <div className="mt-4 space-y-1.5 rounded-xl bg-zinc-50 p-3.5 text-xs text-zinc-700">
                        <p>📍 <strong>장소:</strong> {activePartyDetail.venue} ({activePartyDetail.address})</p>
                        <p>🗓️ <strong>일정:</strong> 매주 {activePartyDetail.days.join(", ")}요일 진행</p>
                        <p>👥 <strong>모집 정원:</strong> {activePartyDetail.recruit}명 (남녀 성비 균형)</p>
                        <p>🎟️ <strong>남은 자리:</strong> {Math.max(0, activePartyDetail.recruit - activePartyDetail.currentRecruit)}석</p>
                      </div>

                      <p className="mt-4 text-xs leading-relaxed text-zinc-600">
                        {activePartyDetail.desc}
                      </p>

                      {hasApplied(activePartyDetail.id) && (
                        <p className="mt-4 rounded-lg bg-emerald-50 px-3 py-2 text-[11px] font-semibold leading-relaxed text-emerald-700">
                          ✓ 이미 신청이 접수된 파티입니다. 선정 결과는 입력하신 연락처로 안내됩니다.
                        </p>
                      )}

                      <div className="mt-6 flex gap-3">
                        <button
                          type="button"
                          onClick={(event) => toggleWishlist(event, activePartyDetail.id)}
                          aria-pressed={wishlist.has(activePartyDetail.id)}
                          className={`flex items-center justify-center rounded-xl border px-4 py-3 text-xs font-bold transition ${
                            wishlist.has(activePartyDetail.id)
                              ? "border-rose-300 bg-rose-50 text-rose-600"
                              : "border-zinc-200 text-zinc-700 hover:bg-zinc-50"
                          }`}
                        >
                          {wishlist.has(activePartyDetail.id) ? "❤️ 찜완료" : "🤍 찜하기"}
                        </button>
                        <button
                          type="button"
                          disabled={
                            activePartyDetail.currentRecruit >= activePartyDetail.recruit ||
                            hasApplied(activePartyDetail.id)
                          }
                          onClick={() => {
                            setApplyError("");
                            setApplyStep("form");
                          }}
                          className="flex-1 rounded-xl bg-rose-600 py-3 text-xs font-bold text-white shadow-md transition hover:bg-rose-700 disabled:cursor-not-allowed disabled:bg-zinc-300 disabled:shadow-none"
                        >
                          {activePartyDetail.currentRecruit >= activePartyDetail.recruit
                            ? "모집이 마감되었습니다"
                            : hasApplied(activePartyDetail.id)
                              ? "신청 완료"
                              : "무료 체험단 신청하기"}
                        </button>
                      </div>
                    </>
                  )}

                  {/* ---------- STEP 2: APPLICATION FORM ---------- */}
                  {applyStep === "form" && (
                    <form onSubmit={submitApplication} noValidate>
                      <button
                        type="button"
                        onClick={() => { setApplyStep("detail"); setApplyError(""); }}
                        className="text-xs font-semibold text-zinc-500 transition hover:text-zinc-900"
                      >
                        ← 상세로 돌아가기
                      </button>

                      <h3 id="party-detail-title" className="mt-3 text-lg font-bold text-zinc-900">
                        무료 체험단 신청
                      </h3>
                      <p className="mt-1 line-clamp-1 text-xs text-zinc-500">{activePartyDetail.title}</p>

                      <div className="mt-4 space-y-3">
                        <div>
                          <label htmlFor="applicant-name" className="text-[11px] font-bold text-zinc-700">
                            이름 <span className="text-rose-600">*</span>
                          </label>
                          <input
                            id="applicant-name"
                            type="text"
                            value={applyForm.name}
                            onChange={(event) => setApplyForm((prev) => ({ ...prev, name: event.target.value }))}
                            placeholder="홍길동"
                            autoComplete="name"
                            aria-invalid={Boolean(applyError)}
                            className="mt-1 w-full rounded-lg border border-zinc-200 bg-white px-3 py-2 text-xs text-zinc-900 placeholder:text-zinc-400 focus:border-rose-400 focus:outline-none focus:ring-2 focus:ring-rose-100"
                          />
                        </div>

                        <div>
                          <label htmlFor="applicant-phone" className="text-[11px] font-bold text-zinc-700">
                            연락처 <span className="text-rose-600">*</span>
                          </label>
                          <input
                            id="applicant-phone"
                            type="tel"
                            inputMode="numeric"
                            value={applyForm.phone}
                            onChange={(event) => setApplyForm((prev) => ({ ...prev, phone: event.target.value }))}
                            placeholder="01012345678"
                            autoComplete="tel"
                            aria-invalid={Boolean(applyError)}
                            className="mt-1 w-full rounded-lg border border-zinc-200 bg-white px-3 py-2 text-xs text-zinc-900 placeholder:text-zinc-400 focus:border-rose-400 focus:outline-none focus:ring-2 focus:ring-rose-100"
                          />
                        </div>

                        <div>
                          <label htmlFor="applicant-day" className="text-[11px] font-bold text-zinc-700">
                            참여 요일 <span className="text-rose-600">*</span>
                          </label>
                          <select
                            id="applicant-day"
                            value={applyForm.day}
                            onChange={(event) => setApplyForm((prev) => ({ ...prev, day: event.target.value }))}
                            className="mt-1 w-full rounded-lg border border-zinc-200 bg-white px-3 py-2 text-xs text-zinc-900 focus:border-rose-400 focus:outline-none focus:ring-2 focus:ring-rose-100"
                          >
                            {activePartyDetail.days.map((day) => (
                              <option key={day} value={day}>{day}요일</option>
                            ))}
                          </select>
                        </div>

                        <label className="flex items-start gap-2 text-[11px] leading-relaxed text-zinc-600">
                          <input
                            type="checkbox"
                            checked={applyForm.agree}
                            onChange={(event) => setApplyForm((prev) => ({ ...prev, agree: event.target.checked }))}
                            className="mt-0.5 size-3.5 accent-rose-600"
                          />
                          <span>개인정보 수집 및 이용에 동의합니다. (이름·연락처는 체험단 선정 안내 목적으로만 사용됩니다.)</span>
                        </label>
                      </div>

                      {applyError && (
                        <p role="alert" className="mt-3 rounded-lg bg-rose-50 px-3 py-2 text-[11px] font-semibold text-rose-600">
                          {applyError}
                        </p>
                      )}

                      <button
                        type="submit"
                        className="mt-5 w-full rounded-xl bg-rose-600 py-3 text-xs font-bold text-white shadow-md transition hover:bg-rose-700"
                      >
                        신청 접수하기
                      </button>
                    </form>
                  )}

                  {/* ---------- STEP 3: DONE ---------- */}
                  {applyStep === "done" && (
                    <div className="text-center">
                      <div className="mx-auto flex size-14 items-center justify-center rounded-full bg-emerald-50 text-2xl">✅</div>
                      <h3 id="party-detail-title" className="mt-4 text-lg font-bold text-zinc-900">
                        신청이 접수되었습니다!
                      </h3>
                      <p className="mt-1 text-xs leading-relaxed text-zinc-500">
                        선정되면 입력하신 연락처로 개별 안내드립니다.
                      </p>

                      <div className="mt-5 space-y-2 rounded-xl bg-zinc-50 p-4 text-left text-[11px] text-zinc-700">
                        <p className="flex justify-between gap-3">
                          <span className="shrink-0 text-zinc-400">파티</span>
                          <span className="text-right font-semibold">{activePartyDetail.title}</span>
                        </p>
                        <p className="flex justify-between gap-3">
                          <span className="shrink-0 text-zinc-400">장소</span>
                          <span className="text-right font-semibold">{activePartyDetail.venue}</span>
                        </p>
                        <p className="flex justify-between gap-3">
                          <span className="shrink-0 text-zinc-400">참여 요일</span>
                          <span className="font-semibold">{latestApplicationForDetail ? latestApplicationForDetail.day : applyForm.day}요일</span>
                        </p>
                        <p className="flex justify-between gap-3">
                          <span className="shrink-0 text-zinc-400">신청자</span>
                          <span className="font-semibold">{latestApplicationForDetail ? latestApplicationForDetail.name : applyForm.name}</span>
                        </p>
                        <p className="flex justify-between gap-3">
                          <span className="shrink-0 text-zinc-400">연락처</span>
                          <span className="font-semibold">{latestApplicationForDetail ? latestApplicationForDetail.phone : applyForm.phone}</span>
                        </p>
                      </div>

                      <button
                        type="button"
                        onClick={closePartyDetail}
                        className="mt-5 w-full rounded-xl bg-zinc-900 py-3 text-xs font-bold text-white transition hover:bg-zinc-800"
                      >
                        확인
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
