            next.delete(partyId);

          } else {
            next.add(partyId);
            showToast("관심 파티에 추가되었습니다! (찜 목록)");
          }
          return next;
        });
      };

          }
          // Day filter
          if (selectedDay !== "전체") {
            if (!party.days.includes(selectedDay)) return false;
          }
          // Category filter
          if (selectedCategory !== "전체") {
            if (party.category !== selectedCategory) return false;
          }
          return true;
        });
      }, [selectedRegion, selectedDay, selectedCategory]);

                  <div className="mt-4 rounded-xl bg-zinc-50 p-3.5 text-xs text-zinc-700 space-y-1.5">
                    <p>📍 <strong>장소:</strong> {activePartyDetail.venue} ({activePartyDetail.address})</p>
                    <p>🗓️ <strong>일정:</strong> 매주 {activePartyDetail.days.join(", ")}요일 진행</p>
                    <p>👥 <strong>모집 정원:</strong> {activePartyDetail.recruit}명 (남녀 성비 균형)</p>
                  </div>

                  <p className="mt-4 text-xs leading-relaxed text-zinc-600">
                    {activePartyDetail.desc}
                  </p>

                  <div className="mt-6 flex gap-3">
                    <button
                      onClick={(e) => toggleWishlist(e, activePartyDetail.id)}
                      className={`flex items-center justify-center rounded-xl border px-4 py-3 text-xs font-bold transition ${
                        wishlist.has(activePartyDetail.id)
                          ? "border-rose-300 bg-rose-50 text-rose-600"
                          : "border-zinc-200 text-zinc-700 hover:bg-zinc-50"
                      }`}
                    >
                      {wishlist.has(activePartyDetail.id) ? "❤️ 찜완료" : "🤍 찜하기"}
                    </button>
                    <button
                      onClick={() => {
                        showToast("체험단 신청이 접수되었습니다! (선정 시 알림 발송)");
                        setActivePartyDetail(null);
                      }}
                      className="flex-1 rounded-xl bg-rose-600 py-3 text-xs font-bold text-white shadow-md transition hover:bg-rose-700"
                    >
                      무료 체험단 신청하기
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
