      const [mapParty, setMapParty] = useState(null);

      // Welcome/Error toast state
      const [welcomeToast, setWelcomeToast] = useState({ show: false, isNewUser: false });
      const [errorToast, setErrorToast] = useState({ show: false, message: '' });

      // Profile menu
      const [isProfileMenuOpen, setIsProfileMenuOpen] = useState(false);

      // Banner Auto-play
      useEffect(() => {
        if (isBannerPaused) return;
        const timer = setInterval(() => {
          setCurrentBanner((prev) => (prev + 1) % BANNER_SLIDES.length);
        }, 4500);
        return () => clearInterval(timer);
      }, [isBannerPaused]);

      // Trigger lucide icons render on update
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Persist wishlist & applications (localStorage)
      useEffect(() => {
        try {
          localStorage.setItem("partyconnect:wishlist", JSON.stringify(Array.from(wishlist)));
        } catch (e) {}
      }, [wishlist]);

      useEffect(() => {
        try {
          if (!live) localStorage.setItem("partyconnect:applications", JSON.stringify(applications));
        } catch (e) {}
      }, [applications]);

      // Persist parties & reviews (localStorage)
      useEffect(() => {
        try {
          if (!live) localStorage.setItem(STORAGE_KEYS.parties, JSON.stringify(parties));
        } catch (e) {}
      }, [parties]);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEYS.reviews, JSON.stringify(reviews));
        } catch (e) {}
      }, [reviews]);

      // Close modals on ESC
      useEffect(() => {
        const onKeyDown = (event) => {
          if (event.key !== "Escape") return;
          setIsRegionModalOpen(false);
          setActivePartyDetail(null);
          setApplyStep("detail");
          setApplyError("");
          setIsLoginModalOpen(false);
          setIsNotificationOpen(false);
          setIsMyPageOpen(false);
          setIsProfileMenuOpen(false);
        };
        window.addEventListener("keydown", onKeyDown);
        return () => window.removeEventListener("keydown", onKeyDown);
      }, []);

      // Lock body scroll while a modal is open
      useEffect(() => {
        const hasModal = isRegionModalOpen || Boolean(activePartyDetail) || isLoginModalOpen || isNotificationOpen || isMyPageOpen;
        document.body.style.overflow = hasModal ? "hidden" : "";
        return () => { document.body.style.overflow = ""; };
      }, [isRegionModalOpen, activePartyDetail, isLoginModalOpen, isNotificationOpen, isMyPageOpen]);

      // Show toast
      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(""), 2500);
      };

      // Toggle wishlist
      const toggleWishlist = (e, partyId) => {
        e.preventDefault();
        e.stopPropagation();
        setWishlist((prev) => {
          const next = new Set(prev);
          if (next.has(partyId)) {
            next.delete(partyId);
            showToast("관심 파티에서 삭제되었습니다.");
          } else {
            next.add(partyId);
            showToast("관심 파티에 추가되었습니다! (찜 목록)");
          }
          return next;
        });
      };

      // Open / close party detail modal
      const openPartyDetail = (party) => {
        setActivePartyDetail(party);
        setApplyStep("detail");
        setApplyError("");
        setApplyForm({ name: "", phone: "", day: party.days[0] || "", agree: false });
        setSelectedDetailImage(0);
      };

      const closePartyDetail = () => {
        setActivePartyDetail(null);
        setApplyStep("detail");
        setApplyError("");
      };

      // Auth functions
      const handleLogin = async () => {
        setLoginLoading(true);
        try {
          // Save return URL for post-login redirect
          if (activePartyDetail) {
            saveReturnUrl(activePartyDetail.id, 'apply');
          }
          await loginWithKakao();
        } catch (error) {
          setLoginLoading(false);
          setErrorToast({ show: true, message: error.message });
        }
      };

      const handleLogout = async () => {
        try {
          await logout();
          setApplications([]);
          setIsMyPageOpen(false);
          setIsProfileMenuOpen(false);
          showToast("로그아웃 되었습니다.");
        } catch (error) {
          setErrorToast({ show: true, message: error.message });
        }
      };

      const openLoginModal = () => {
        setIsLoginModalOpen(true);
      };

      // Subscribe to auth state changes
      useEffect(() => {
        const unsubscribe = subscribe((state, user) => {
          setAuthState(state);
          setCurrentUser(user);
          setIsLoginModalOpen(false);
          setLoginLoading(false);
        });

        // Restore session on mount
        restoreSession().then(({ user }) => {
          if (user) {
            setCurrentUser(user);
          }
        });

        return unsubscribe;
      }, []);

      // 실서비스 모드: 파티 목록의 원본은 서버다. 마운트 시 한 번 가져온다.
      // (이 효과가 없으면 실서비스 모드의 메인 페이지는 항상 "검색 결과가 없습니다"로 보인다)
      useEffect(() => {
        if (!live) return;
        let cancelled = false;
        fetchParties().then(({ data, error }) => {
          if (cancelled) return;
          if (error) {
            showToast("파티 목록을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.");
            return;
          }
          setParties(normalizeServerParties(data));
        });
        return () => { cancelled = true; };
      }, []);

      // 실서비스 모드: 로그인 상태가 바뀌면 내 신청 내역을 서버에서 다시 가져온다.
      useEffect(() => {
        if (!live) return;
        if (!currentUser) { setApplications([]); return; }
        let cancelled = false;
        fetchMyApplications().then(({ data, error }) => {
          if (!cancelled && !error) setApplications(normalizeServerApplications(data));
        });
        return () => { cancelled = true; };
      }, [currentUser && currentUser.id]);

      // Handle welcome toast from auth callback
      useEffect(() => {
        const handleWelcome = (event) => {
          setWelcomeToast({ show: true, isNewUser: event.detail.isNewUser });
        };
        window.addEventListener('partylink:welcome', handleWelcome);
        return () => window.removeEventListener('partylink:welcome', handleWelcome);
      }, []);

      // Handle toast events
      useEffect(() => {
        const handleToast = (event) => {
          showToast(event.detail.message);
        };
        window.addEventListener('partylink:toast', handleToast);
        return () => window.removeEventListener('partylink:toast', handleToast);
      }, []);

      // Notifications
      const addNotification = (notif) => {
        const newNotif = {
          id: `notif_${Date.now()}`,
          ...notif,
          createdAt: new Date().toISOString(),
          read: false
        };
        setNotifications((prev) => [newNotif, ...prev]);
        setUnreadCount((prev) => prev + 1);
      };

      const markAsRead = (notifId) => {
        setNotifications((prev) => prev.map((n) => n.id === notifId ? { ...n, read: true } : n));
        setUnreadCount((prev) => Math.max(0, prev - 1));
      };

      const markAllAsRead = () => {
        setNotifications((prev) => prev.map((n) => ({ ...n, read: true })));
        setUnreadCount(0);
      };

      const deleteNotification = (notifId) => {
        setNotifications((prev) => prev.filter((n) => n.id !== notifId));
      };

      // Review writing
      const openReviewWrite = (party) => {
        setReviewWriteParty(party);
        setReviewWriteForm({ rating: 5, comment: "", photos: [], tags: [] });
        setIsReviewWriteOpen(true);
        setActivePartyDetail(null);
      };

      const submitReview = (e) => {
        e.preventDefault();
        if (!reviewWriteParty || !currentUser) return;
        
        if (reviewWriteForm.comment.trim().length < 10) {
          showToast("후기는 10자 이상 작성해 주세요.");
          return;
        }

        const newReview = {
          id: Date.now(),
          avatar: currentUser.name.charAt(0),
          avatarBg: "bg-rose-100 text-rose-700",
          name: currentUser.name,
          time: "방금 전",
          venue: reviewWriteParty.venue,
          address: reviewWriteParty.address,
          comment: reviewWriteForm.comment,
          rating: reviewWriteForm.rating,
          userId: currentUser.id
        };

        setReviews((prev) => [newReview, ...prev]);
        setIsReviewWriteOpen(false);
        showToast("후기가 등록되었습니다!");
        addNotification({
          type: 'review',
          title: '후기 작성 완료',
          message: `"${reviewWriteParty.title}" 후기가 등록되었습니다.`,
          read: false
        });
      };

      // My Page
      const openMyPage = () => {
        if (!currentUser) {
          openLoginModal();
          return;
        }
        setIsMyPageOpen(true);
      };

      // Re-fetch my applications so the status shown is the server's current one
      const refreshApplications = async (silent) => {
        const { data, error } = await fetchMyApplications();
        if (!error) setApplications(normalizeServerApplications(data));
        else if (!silent) showToast('신청 상태를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.');
        return !error;
      };

      const handleMissionSubmitted = async () => {
        await refreshApplications(true);
        showToast('미션이 제출되었어요. 검수 결과를 기다려 주세요.');
      };

      const handleMyApplicationCancel = (app) => {
        if (!window.confirm(`"${app.partyTitle}" 신청을 취소하시겠습니까?`)) return;
        
        if (live) {
          cancelApplication(app.id)
            .then(() => {
              // Refresh from server
              fetchMyApplications().then(({ data, error }) => {
                if (!error) {
                  setApplications(normalizeServerApplications(data));
                }
              });
              showToast("신청이 취소되었습니다.");
            })
            .catch((err) => showToast(err.message));
        } else {
          setApplications(prev => prev.map(a => a.id === app.id ? { ...a, status: 'CANCELLED' } : a));
          showToast('신청이 취소되었습니다. (데모 모드)');
        }
      };

      // Map
      const openMap = (party) => {
        const addr = encodeURIComponent(party.address || party.venue);
        window.open(`https://map.kakao.com/link/search/${addr}`, '_blank', 'noopener,noreferrer');
      };

      // Admin
      const handleAdminLogin = () => {
        if (adminPassword === ADMIN_PASSWORD) {
          setIsAdminAuthenticated(true);
          setAdminPassword("");
        } else {
          showToast("비밀번호가 틀렸습니다.");
        }
      };

      // Render filtered parties
      const filteredParties = useMemo(() => {
        return parties.filter((party) => {
          const regionMatch = selectedRegion === "전체 지역" || party.region === selectedRegion;
          const dayMatch = selectedDay === "전체" || party.days.includes(selectedDay);
          const categoryMatch = selectedCategory === "전체" || party.category === selectedCategory;
          return regionMatch && dayMatch && categoryMatch;
        });
      }, [parties, selectedRegion, selectedDay, selectedCategory]);

      // Check if user has applied to a party
      const hasApplied = (partyId) => {
        return applications.some((a) => 
          a.partyId === partyId && 
          isActiveApplication(a.status) &&
          (!live || (currentUser && a.userId === currentUser.id))
        );
      };

      // Submit free trial application
      const submitApplication = async (e) => {
        e.preventDefault();
        if (!activePartyDetail) return;

        const name = applyForm.name.trim();
        const phone = applyForm.phone.replace(/[^0-9]/g, '');

        if (name.length < 2) { setApplyError("이름을 2자 이상 입력해 주세요."); return; }
        if (phone.length < 10 || phone.length > 11) { setApplyError("연락처를 정확히 입력해 주세요. (예: 01012345678)"); return; }
        if (!applyForm.day) { setApplyError("참여할 요일을 선택해 주세요."); return; }
        if (!applyForm.agree) { setApplyError("개인정보 수집·이용에 동의해 주세요."); return; }
        if (applySubmitting) return;

        // Check login
        if (!currentUser) {
          setApplyError("카카오 로그인 후 신청할 수 있어요.");
          openLoginModal();
          return;
        }

        setApplySubmitting(true);
        setApplyError("");

        const applicationData = {
          name,
          phone,
          day: applyForm.day,
          agree: true
        };

        try {
          if (live) {
            await applyToParty(activePartyDetail.id, applicationData);
            // Refresh from server
            const [partiesResult, appsResult] = await Promise.all([
              fetchParties(),
              fetchMyApplications()
            ]);
            if (!partiesResult.error) {
              setParties(normalizeServerParties(partiesResult.data));
            }
            if (!appsResult.error) {
              setApplications(normalizeServerApplications(appsResult.data));
            }
            setApplyStep("done");
            showToast("신청이 접수되었습니다!");
          } else {
            // Demo mode
            const application = {
              id: activePartyDetail.id + "-" + Date.now(),
              partyId: activePartyDetail.id,
              partyTitle: activePartyDetail.title,
              name,
              phone,
              day: applyForm.day,
              appliedAt: new Date().toISOString(),
              status: "APPLIED",
              userId: currentUser.id
            };
            setApplications((prev) => [application, ...prev]);
            setApplyStep("done");
            showToast('신청이 접수되었습니다! (데모 모드)');
          }
          addNotification({
            type: 'apply',
            title: '신청 완료',
            message: `"${activePartyDetail.title}" 신청이 접수되었습니다.`,
            read: false
          });
        } catch (err) {
          setApplyError(err.message);
        } finally {
          setApplySubmitting(false);
        }
      };

      // UI/UX Pro Max: Motion preferences
      const [prefersReducedMotion, setPrefersReducedMotion] = useState(false);
      useEffect(() => {
        const mediaQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
        setPrefersReducedMotion(mediaQuery.matches);
        const handler = (e) => setPrefersReducedMotion(e.matches);
        mediaQuery.addEventListener('change', handler);
        return () => mediaQuery.removeEventListener('change', handler);
      }, []);

      // ================================================================
      // RENDER
      // ================================================================
      const currentBannerSlide = BANNER_SLIDES[currentBanner];

      return (
        <>
          {/* ================= HEADER ================= */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-sm border-b border-zinc-200">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16">
                {/* Logo */}
                <a href="/" className="flex items-center gap-2" aria-label="HypeConnect 홈">
                  <img src="assets/hypeconnect-logo.svg" alt="HypeConnect" width="140" height="26" className="h-7 w-auto" />
                </a>

                {/* Desktop Nav */}
                <nav className="hidden items-center gap-6 md:flex">
                  <a href="party-connect/" className="text-sm font-bold text-rose-600 transition hover:text-rose-700">
                    HypeConnect
                  </a>
                  <a href="#reviews" className="text-sm font-semibold text-zinc-700 transition hover:text-rose-600">
                    커뮤니티
                  </a>
                  <a href="#partners" className="text-sm font-semibold text-zinc-500 transition hover:text-zinc-900">
                    제휴신청
                  </a>
                </nav>

                {/* Actions: 알림 / 로그인(프로필). 모바일에서도 보여야 로그인하고 마이페이지를 열 수 있다. */}
                <div className="flex items-center gap-3">
                  {/* Notification Bell */}
                  <button 
                    onClick={() => setIsNotificationOpen(true)}
                    className="relative p-2 rounded-full hover:bg-zinc-100 transition text-zinc-600 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:ring-offset-2"
                    aria-label={`알림${unreadCount > 0 ? `, ${unreadCount}개 읽지 않음` : ''}`}
                  >
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 17h5l-1.405-1.405A2.032 2.032 0 0018 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                    </svg>
                    {unreadCount > 0 && (
                      <span className="absolute -top-1 -right-1 w-5 h-5 bg-rose-600 text-white text-[10px] font-bold rounded-full flex items-center justify-center">
                        {unreadCount > 9 ? '9+' : unreadCount}
                      </span>
                    )}
                  </button>

                  {/* Profile / Login */}
                  {currentUser ? (
                    <div className="relative">
                      <button 
                        onClick={() => setIsProfileMenuOpen(!isProfileMenuOpen)}
                        className="flex items-center gap-2 p-1.5 rounded-full hover:bg-zinc-100 transition focus:outline-none focus:ring-2 focus:ring-rose-500 focus:ring-offset-2"
                        aria-label="프로필 메뉴"
                        aria-expanded={isProfileMenuOpen}
                        aria-haspopup="true"
                      >
                        <span className="w-8 h-8 rounded-full bg-rose-100 flex items-center justify-center text-xl" aria-hidden="true">
                          {currentUser.avatar || '🟡'}
                        </span>
                        <span className="text-sm font-medium text-zinc-900 hidden sm:block">{currentUser.name}</span>
                        <svg className="w-4 h-4 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" />
                        </svg>
                      </button>
                      
                      {isProfileMenuOpen && (
                        <ProfileMenu 
                          user={currentUser}
                          onMyPage={() => { setIsProfileMenuOpen(false); openMyPage(); }}
                          onLogout={() => { setIsProfileMenuOpen(false); handleLogout(); }}
                          onClose={() => setIsProfileMenuOpen(false)}
                        />
                      )}
                    </div>
                  ) : (
                    <button
                      onClick={openLoginModal}
                      className="rounded-full bg-rose-600 px-4 py-1.5 text-xs font-semibold text-white transition hover:bg-rose-700 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:ring-offset-2 sm:text-sm"
                    >
                      로그인
                    </button>
                  )}
                </div>

              </div>
            </div>
          </header>

          {/* ================= MOBILE DRAWER ================= */}
          {/* Simplified for brevity - in production would have full mobile nav */}

          {/* ================= MAIN CONTENT ================= */}
          <main className="pt-4 pb-12">
            {/* Hero Banner */}
            <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mb-8" aria-label="메인 배너">
              <div className="relative rounded-2xl overflow-hidden" style={{ background: currentBannerSlide.bgGradient }}>
                <div className="absolute inset-0 bg-black/10" />
                <div className="relative p-6 sm:p-8 md:p-12 flex flex-col md:flex-row items-start md:items-center justify-between gap-6 min-h-[200px]">
                  <div className="text-white z-10 max-w-xl">
                    <span className="inline-block px-3 py-1 rounded-full bg-white/20 text-xs font-semibold mb-3">
                      {currentBannerSlide.badge}
                    </span>
                    <h1 className="text-2xl sm:text-3xl md:text-4xl font-extrabold tracking-tight leading-tight mb-3">
                      {currentBannerSlide.title}
                    </h1>
                    <p className="text-white/90 text-sm sm:text-base mb-6 max-w-md">
                      {currentBannerSlide.desc}
                    </p>
                    <a href="party-connect/" className="inline-flex items-center gap-2 px-5 py-2.5 bg-white text-rose-600 font-semibold rounded-xl hover:bg-white/90 transition shadow-lg">
                      파티 둘러보기
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 8l4 4m0 0l-4 4m4-4H3" />
                      </svg>
                    </a>
                  </div>
                  <div className="relative z-10 w-full md:w-1/2 hidden md:block">
                    <img 
                      src={currentBannerSlide.img} 
                      alt="" 
                      className="w-full h-auto rounded-xl shadow-2xl object-cover"
                      aria-hidden="true"
                    />
                  </div>
                </div>
                {/* Banner Indicators */}
                <div className="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-2">
                  {BANNER_SLIDES.map((_, i) => (
                    <button
                      key={i}
                      onClick={() => { setCurrentBanner(i); setIsBannerPaused(true); }}
                      className={`w-2 h-2 rounded-full transition ${i === currentBanner ? 'bg-white' : 'bg-white/50'}`}
                      aria-label={`배너 ${i + 1}로 이동`}
                    />
                  ))}
                </div>
              </div>
            </section>

            {/* Party Connect Section */}
            <section id="parties" className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8" aria-labelledby="parties-heading">
              <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
                <div>
                  <h2 id="parties-heading" className="text-2xl font-extrabold text-zinc-950">
                    HypeConnect
                  </h2>
                  <p className="text-sm text-zinc-500 mt-1">
                    혼술바, 소개팅, 소셜파티를 한 곳에서 만나보세요
                  </p>
                </div>
                <a 
                  href="party-connect/" 
                  className="inline-flex items-center gap-2 px-4 py-2 bg-rose-600 text-white font-semibold rounded-xl hover:bg-rose-700 transition text-sm"
                >
                  파티 탐색하기
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 8l4 4m0 0l-4 4m4-4H3" />
                  </svg>
                </a>
              </div>

              {/* Search & Filters */}
              <div className="bg-white rounded-2xl border border-zinc-200 p-4 sm:p-6 mb-6">
                {/* Search */}
                <div className="relative mb-4">
                  <svg className="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                  </svg>
                  <input
                    type="text"
                    placeholder="파티명, 장소, 지역으로 검색"
                    className="w-full pl-10 pr-4 py-3 bg-zinc-50 border border-zinc-200 rounded-xl text-sm placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent"
                    onChange={(e) => setSearchQuery(e.target.value)}
                    aria-label="파티 검색"
                  />
                </div>

                {/* Filter Chips */}
                <div className="space-y-3">

                          <button
                            onClick={() => openReviewWrite(activePartyDetail)}
                            className="w-full py-3 rounded-xl text-sm font-semibold border border-zinc-200 bg-white text-zinc-700 hover:bg-zinc-50 transition min-h-[48px]"
                          >
                            후기 작성하기
                          </button>
                        )}
                        <button
                          onClick={() => openMap(activePartyDetail)}
                          className="w-full py-3 rounded-xl text-sm font-semibold border border-zinc-200 bg-white text-zinc-700 hover:bg-zinc-50 transition min-h-[48px] flex items-center justify-center gap-2"
                        >
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                          카카오맵에서 보기
                        </button>
                      </div>
                    </div>
                  )}

                  {/* Application Form */}
                  {applyStep === 'form' && (
                    <form onSubmit={submitApplication} className="space-y-4">
                      <h3 className="text-lg font-bold text-zinc-900">파티 신청</h3>
                      <p className="text-sm text-zinc-500">{activePartyDetail.title}</p>
                      
                      {applyError && (
                        <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl text-sm text-rose-700" role="alert">
                          {applyError}
                        </div>
                      )}

                      <div>
                        <label htmlFor="apply-name" className="block text-sm font-medium text-zinc-700 mb-1">신청자 이름 <span className="text-rose-600">*</span></label>
                        <input
                          id="apply-name"
                          type="text"
                          value={applyForm.name}
                          onChange={(e) => setApplyForm({...applyForm, name: e.target.value})}
                          placeholder="이름을 입력해 주세요"
                          className="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-xl text-sm placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent"
                          autoComplete="name"
                          required
                        />
                      </div>

                      <div>
                        <label htmlFor="apply-phone" className="block text-sm font-medium text-zinc-700 mb-1">연락처 <span className="text-rose-600">*</span></label>
                        <input
                          id="apply-phone"
                          type="tel"
                          value={applyForm.phone}
                          onChange={(e) => setApplyForm({...applyForm, phone: e.target.value})}
                          placeholder="010-0000-0000"
                          className="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-xl text-sm placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent"
                          autoComplete="tel"
                          required
                        />
                      </div>

                      <div>
                        <label className="block text-sm font-medium text-zinc-700 mb-1">참여 일정 <span className="text-rose-600">*</span></label>
                        <div className="flex flex-wrap gap-2">
                          {activePartyDetail.days.map((day) => (
                            <label key={day} className="flex items-center gap-2 cursor-pointer">
                              <input
                                type="radio"
                                name="apply-day"
                                value={day}
                                checked={applyForm.day === day}
                                onChange={(e) => setApplyForm({...applyForm, day: e.target.value})}
                                className="w-4 h-4 text-rose-600 border-zinc-300 focus:ring-rose-500"
                              />
                              <span className="px-3 py-1.5 rounded-full text-sm font-medium border border-zinc-200 bg-white hover:bg-zinc-50 transition">{day}요일</span>
                            </label>
                          ))}
                        </div>
                      </div>

                      <label className="flex items-start gap-3 cursor-pointer">
                        <input
                          type="checkbox"
                          checked={applyForm.agree}
                          onChange={(e) => setApplyForm({...applyForm, agree: e.target.checked})}
                          className="mt-1 w-5 h-5 text-rose-600 border-zinc-300 rounded focus:ring-rose-500 focus:ring-2"
                          required
                        />
                        <div className="text-sm text-zinc-600">
                          <span className="font-medium text-zinc-900">파티 신청을 위한 개인정보 수집·이용 동의</span>
                          <a href="#privacy" className="text-rose-600 hover:underline ml-1">(내용 보기)</a>
                        </div>
                      </label>

                      <div className="flex gap-2 pt-2">
                        <button
                          type="button"
                          onClick={() => setApplyStep('detail')}
                          className="flex-1 py-3 rounded-xl text-sm font-semibold border border-zinc-200 bg-white text-zinc-700 hover:bg-zinc-50 transition min-h-[48px]"
                        >
                          취소
                        </button>
                        <button
                          type="submit"
                          disabled={applySubmitting}
                          className={`flex-1 py-3 rounded-xl text-sm font-bold transition min-h-[48px] ${applySubmitting ? 'bg-zinc-300 cursor-not-allowed' : 'bg-rose-600 text-white hover:bg-rose-700 shadow-md'}`}
                        >
                          {applySubmitting ? '신청 중...' : '신청하기'}
                        </button>
                      </div>
                    </form>
                  )}

                  {/* Application Complete */}
                  {applyStep === 'done' && (
                    <div className="flex flex-col items-center justify-center p-12 text-center">
                      <div className="w-16 h-16 rounded-full bg-emerald-100 flex items-center justify-center mb-4">
                        <svg className="w-8 h-8 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
                        </svg>
                      </div>
                      <h3 className="text-lg font-bold text-zinc-900">신청이 접수되었습니다!</h3>
                      <p className="mt-2 text-sm text-zinc-500">
                        {live 
                          ? '실제 서버에 신청이 접수되었습니다. 알림을 기다려 주세요.' 
                          : '파티 신청이 완료되었습니다. (데모 모드 - 실제 서버 연동 시 알림 발송)'}
                      </p>
                      <button onClick={closePartyDetail} className="mt-6 w-full max-w-xs py-3 text-sm font-bold rounded-xl bg-rose-600 text-white hover:bg-rose-700 transition min-h-[48px]">
                        확인
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Notification Center */}
          {isNotificationOpen && (
            <div className="fixed inset-0 z-[60] flex items-start justify-end bg-black/60 p-4 backdrop-blur-sm animate-fade-in" onClick={() => setIsNotificationOpen(false)}>
              <div role="dialog" aria-modal="true" aria-labelledby="notification-title" onClick={e => e.stopPropagation()} className="animate-slide-up relative w-full max-w-md max-h-[80vh] rounded-2xl bg-white shadow-2xl flex flex-col">
                <div className="flex items-center justify-between border-b border-zinc-100 p-4">
                  <h3 id="notification-title" className="text-base font-bold text-zinc-900">알림</h3>
                  <div className="flex items-center gap-2">
                    {unreadCount > 0 && (
                      <button onClick={markAllAsRead} className="text-xs font-semibold text-rose-600 hover:underline">전체 읽음</button>
                    )}
                    <button onClick={() => setIsNotificationOpen(false)} className="p-2 rounded-full hover:bg-zinc-100 transition" aria-label="닫기">
                      <svg className="w-5 h-5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                  </div>
                </div>
                <div className="flex-1 overflow-y-auto">
                  {notifications.length === 0 ? (
                    <div className="p-8 text-center text-zinc-500">
                      <svg className="mx-auto w-12 h-12 text-zinc-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 17h5l-1.405-1.405A2.032 2.032 0 0018 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
                      <p>알림이 없습니다.</p>
                    </div>
                  ) : (
                    <ul className="divide-y divide-zinc-100">
                      {notifications.map((notif) => (
                        <li key={notif.id} className={`p-4 ${!notif.read ? 'bg-rose-50/50' : ''}`}>
                          <div className="flex items-start gap-3">
                            <div className={`w-2 h-2 rounded-full mt-2 flex-shrink-0 ${!notif.read ? 'bg-rose-500' : 'bg-zinc-300'}`} />
                            <div className="flex-1 min-w-0">
                              <p className={`font-medium text-zinc-900 ${!notif.read ? 'font-bold' : ''}`}>{notif.title}</p>
                              <p className="text-sm text-zinc-600 mt-0.5">{notif.message}</p>
                              <p className="text-xs text-zinc-400 mt-1">{new Date(notif.createdAt).toLocaleString('ko-KR')}</p>
                            </div>
                            <button onClick={() => { markAsRead(notif.id); deleteNotification(notif.id); }} className="p-1 text-zinc-400 hover:text-zinc-600" aria-label="알림 삭제">
                              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                            </button>
                          </div>
                        </li>
                      ))}
                    </ul>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Review Write Modal */}
          {isReviewWriteOpen && reviewWriteParty && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in" role="dialog" aria-modal="true" aria-label="후기 작성" onClick={() => setIsReviewWriteOpen(false)}>
              <div className="relative w-full max-w-md max-h-[90vh] bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col animate-slide-up" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between p-4 border-b border-zinc-100">
                  <h3 className="text-base font-bold text-zinc-900">후기 작성</h3>
                  <button onClick={() => setIsReviewWriteOpen(false)} className="p-2 rounded-full hover:bg-zinc-100 transition" aria-label="닫기"><svg className="w-5 h-5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg></button>
                </div>
                <form onSubmit={submitReview} className="flex-1 overflow-y-auto p-4 space-y-4">
                  <p className="text-sm text-zinc-500 text-center">「{reviewWriteParty.title}」 후기</p>
                  <div>
                    <label className="block text-sm font-medium text-zinc-700 mb-2">별점</label>
                    <div className="flex items-center justify-center gap-2">
                      {[1,2,3,4,5].map((star) => (
                        <button type="button" onClick={() => setReviewWriteForm({...reviewWriteForm, rating: star})} className="p-1" aria-label={`${star}점`}>
                          <svg className={`w-8 h-8 ${star <= reviewWriteForm.rating ? 'text-amber-400 fill-current' : 'text-zinc-300'}`} fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.26-1.18L12 2z"/></svg>
                        </button>
                      ))}
                    </div>
                  </div>
                  <div>
                    <label htmlFor="review-comment" className="block text-sm font-medium text-zinc-700 mb-1">내용 <span className="text-rose-600">*</span></label>
                    <textarea id="review-comment" value={reviewWriteForm.comment} onChange={(e) => setReviewWriteForm({...reviewWriteForm, comment: e.target.value})} rows="4" className="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-xl text-sm placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent resize-none" placeholder="후기를 10자 이상 작성해 주세요" required />
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setIsReviewWriteOpen(false)} className="flex-1 py-3 rounded-xl text-sm font-semibold border border-zinc-200 bg-white text-zinc-700 hover:bg-zinc-50 transition min-h-[48px]">취소</button>
                    <button type="submit" className="flex-1 py-3 rounded-xl text-sm font-bold bg-rose-600 text-white hover:bg-rose-700 transition min-h-[48px]">등록</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* My Page Modal */}
          {isMyPageOpen && currentUser && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in" role="dialog" aria-modal="true" aria-label="마이페이지" onClick={() => setIsMyPageOpen(false)}>
              <div className="relative w-full max-w-2xl max-h-[90vh] bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col animate-slide-up" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between p-4 border-b border-zinc-200">
                  <h2 className="text-lg font-bold text-zinc-900">마이페이지</h2>
                  <button onClick={() => setIsMyPageOpen(false)} className="p-2 rounded-full hover:bg-zinc-100 transition" aria-label="닫기"><svg className="w-5 h-5 text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg></button>
                </div>
                <div className="p-4 border-b border-zinc-200">
                  <div className="flex items-center gap-3">
                    <span className="text-3xl" aria-hidden="true">{currentUser.avatar || '🟡'}</span>
                    <div>
                      <p className="font-semibold text-zinc-900">{currentUser.name}</p>
                      <p className="text-sm text-zinc-500">카카오 로그인</p>
                    </div>
                  </div>
                </div>
                <div className="flex-1 overflow-y-auto p-4">
                  {/* My Applications */}
                  <div>
                    <div className="flex items-center justify-between mb-3">
                      <h3 className="font-semibold text-zinc-900">내 신청 내역</h3>
                      {live && (
                        <button type="button" onClick={() => refreshApplications(false)} className="px-3 py-1.5 text-xs font-semibold text-zinc-700 border border-zinc-200 rounded-lg hover:bg-zinc-50 transition min-h-[32px]">상태 새로고침</button>
                      )}
                    </div>
                    {applications.length === 0 ? (
                      <div className="text-center py-8 text-zinc-500">
                        <svg className="mx-auto w-12 h-12 text-zinc-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" /></svg>
                        <p>신청한 파티가 없습니다.</p>
                        <a href="party-connect/" className="mt-3 inline-block text-sm font-semibold text-rose-600 hover:underline">파티 둘러보기</a>
                      </div>
                    ) : (
                      <div className="space-y-3">
                        {applications.map((app) => {
                          const status = getStatusLabel(app.status);
                          return (
                            <div key={app.id} className="p-3 bg-zinc-50 rounded-xl border border-zinc-100">
                              <div className="flex items-center justify-between">
                                <div>
                                  <p className="font-medium text-zinc-900">{app.partyTitle}</p>
                                  <p className="text-sm text-zinc-500">{app.day}요일 · {new Date(app.appliedAt).toLocaleDateString('ko-KR')}</p>
                                </div>
                                <span className={`px-2 py-1 rounded-full text-[10px] font-bold ${status.className}`}>{status.label}</span>
                              </div>
                              {app.status === 'APPLIED' && (
                                <button onClick={() => handleMyApplicationCancel(app)} className="mt-2 w-full py-2 text-sm font-medium text-rose-600 hover:text-rose-700 transition">신청 취소</button>
                              )}
                              {app.status === 'APPROVED' && app.visitCode && (
                                <div className="mt-2 p-2 bg-emerald-50 rounded-lg text-sm text-emerald-700">방문 인증 코드: <span className="font-mono font-bold">{app.visitCode}</span></div>
                              )}
                              <ApplicationExtras application={app} onChanged={handleMissionSubmitted} />
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </div>
                <div className="border-t border-zinc-200 p-4">
                  <button onClick={handleLogout} className="w-full px-4 py-2 text-sm font-medium text-rose-600 hover:text-rose-700 transition">로그아웃</button>
                </div>
              </div>
            </div>
          )}

          {/* Login Modal */}
          {isLoginModalOpen && (
            <LoginModal 
              isOpen={isLoginModalOpen}
              onClose={() => setIsLoginModalOpen(false)}
              onLogin={handleLogin}
              isLoading={loginLoading}
              isLive={live}
            />
          )}

          {/* Welcome Toast */}
          {welcomeToast.show && (
            <WelcomeToast 
              isOpen={welcomeToast.show}
              onClose={() => setWelcomeToast({ show: false, isNewUser: false })}
              isNewUser={welcomeToast.isNewUser}
            />
          )}

          {/* Error Toast */}
          {errorToast.show && (
            <ErrorToast 
              message={errorToast.message}
              onClose={() => setErrorToast({ show: false, message: '' })}
            />
          )}

          {/* Global Toast */}
          {toastMessage && (
            <div className="fixed bottom-4 right-4 z-50 animate-slide-up">
              <div className="bg-zinc-900 text-white px-4 py-3 rounded-xl shadow-xl text-sm max-w-xs">
                {toastMessage}
              </div>
            </div>
          )}

          {/* Admin Modal (Demo Only) */}
          {isAdminOpen && (
            <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in" role="dialog" aria-modal="true" aria-label="관리자" onClick={() => setIsAdminOpen(false)}>
              <div className="relative w-full max-w-4xl max-h-[90vh] bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col animate-slide-up" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between p-4 border-b border-zinc-200">
                  <h2 className="text-lg font-bold text-zinc-900">관리자 대시보드 (데모)</h2>
                  <button onClick={() => setIsAdminOpen(false)} className="p-2 rounded-full hover:bg-zinc-100 transition" aria-label="닫기"><svg className="w-5 h-5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg></button>
                </div>
                {!isAdminAuthenticated ? (
                  <div className="flex-1 flex items-center justify-center p-8">
                    <div className="w-full max-w-md p-6">
                      <h3 className="text-lg font-bold text-zinc-900 text-center mb-4">관리자 비밀번호 입력</h3>
                      <input type="password" value={adminPassword} onChange={(e) => setAdminPassword(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleAdminLogin()} className="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-xl text-sm placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent mb-4" placeholder="비밀번호" autoComplete="current-password" />
                      <button onClick={handleAdminLogin} className="w-full py-3 rounded-xl text-sm font-bold bg-rose-600 text-white hover:bg-rose-700 transition">확인</button>
                    </div>
                  </div>
                ) : (
                  <div className="flex-1 overflow-hidden flex flex-col">
                    <div className="flex border-b border-zinc-200 overflow-x-auto no-scrollbar">
                      {['dashboard', 'parties', 'applications', 'reviews', 'stats'].map((tab) => (
                        <button key={tab} onClick={() => setAdminTab(tab)} className={`px-4 py-2 text-sm font-medium transition whitespace-nowrap ${adminTab === tab ? 'text-rose-600 border-b-2 border-rose-600' : 'text-zinc-500 hover:text-zinc-700'}`}>
                          {tab.charAt(0).toUpperCase() + tab.slice(1)}
                        </button>
                      ))}
                    </div>
                    <div className="flex-1 overflow-y-auto p-4">
                      <p className="text-zinc-500 text-center py-8">{adminTab} 탭 - 데모 구현 영역</p>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </>
      );
    }

    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
