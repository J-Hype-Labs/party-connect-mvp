    // ===== PARTYLINK Module (Supabase Auth + PartyLink DB) =====
    const PARTYLINK = (() => {
      const cfg = window.PARTYLINK_CONFIG || {};
      const params = new URLSearchParams(window.location.search);
      const isLocal = ["localhost", "127.0.0.1", "[::1]"].includes(window.location.hostname);
      const configured = Boolean(cfg.supabaseUrl && cfg.supabaseAnonKey && window.supabase);
      const live = configured && params.get("demo") !== "1" && (!isLocal || params.get("live") === "1");
      const client = live
        ? window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
            auth: { flowType: "pkce", persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
          })
        : null;

      async function api(path, { method = "GET", body } = {}) {
        const { data } = await client.auth.getSession();
        const token = data.session ? data.session.access_token : cfg.supabaseAnonKey;
        let res;
        try {
          res = await fetch(`${cfg.supabaseUrl}/functions/v1/partylink-api/${path}`, {
            method,
            headers: {
              "Content-Type": "application/json",
              apikey: cfg.supabaseAnonKey,
              Authorization: `Bearer ${token}`,
            },
            body: body ? JSON.stringify(body) : undefined,
          });
        } catch (e) {
          throw new Error("서버에 연결하지 못했습니다. 네트워크를 확인해 주세요.");
        }
        const json = await res.json().catch(() => ({}));
        if (!res.ok) {
          const err = new Error(json.message || "요청을 처리하지 못했습니다.");
          err.status = res.status;
          err.code = json.code;
          throw err;
        }
        return json;
      }

        if (!u) return null;
        const meta = u.user_metadata || {};

          id: u.id,
          name: meta.name || meta.full_name || meta.nickname || meta.preferred_username || "카카오유저",

          provider: (u.app_metadata && u.app_metadata.provider) || "kakao",
          joinedAt: u.created_at,
          preferences: { regions: [], categories: [] },
        };
      }

      return { live, client, api, toAppUser };

      const [notifications, setNotifications] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem("partyconnect:notifications") || "[]");
          return Array.isArray(saved) ? saved : [];
        } catch (e) {
          return [];
        }
      });
      const [isNotificationOpen, setIsNotificationOpen] = useState(false);
      const [unreadCount, setUnreadCount] = useState(0);

      // Review writing
      const [isReviewWriteOpen, setIsReviewWriteOpen] = useState(false);
      const [reviewWriteParty, setReviewWriteParty] = useState(null);
      const [reviewWriteForm, setReviewWriteForm] = useState({
        rating: 5,
        comment: "",
        photos: [],
        tags: []
      });

      // My Page
      const [isMyPageOpen, setIsMyPageOpen] = useState(false);
      const [myPageTab, setMyPageTab] = useState("applications"); // applications, wishlist, reviews, settings

      // Map
      const [isMapOpen, setIsMapOpen] = useState(false);
      const [mapParty, setMapParty] = useState(null);

      // UI/UX Pro Max: Motion preferences
      const [prefersReducedMotion, setPrefersReducedMotion] = useState(false);

      // Banner Auto-play
      useEffect(() => {
        if (isBannerPaused) return;
        const timer = setInterval(() => {
          setCurrentBanner((prev) => (prev + 1) % BANNER_SLIDES.length);
        }, 4500);
        return () => clearInterval(timer);
      }, [isBannerPaused]);

      // Trigger lucide icons render on update
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Persist wishlist & applications (localStorage)
      useEffect(() => {
        try {
          localStorage.setItem("partyconnect:wishlist", JSON.stringify(Array.from(wishlist)));
        } catch (e) {}
      }, [wishlist]);

      useEffect(() => {
        try {
          localStorage.setItem("partyconnect:applications", JSON.stringify(applications));
        } catch (e) {}
      }, [applications]);

      // Persist parties & reviews (localStorage)
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEYS.parties, JSON.stringify(parties));
        } catch (e) {}
      }, [parties]);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEYS.reviews, JSON.stringify(reviews));
        } catch (e) {}
      }, [reviews]);

      // Close modals on ESC
      useEffect(() => {
        const onKeyDown = (event) => {
          if (event.key !== "Escape") return;
          setIsRegionModalOpen(false);
          setActivePartyDetail(null);
          setApplyStep("detail");
          setApplyError("");
        };
        window.addEventListener("keydown", onKeyDown);
        return () => window.removeEventListener("keydown", onKeyDown);
      }, []);

      // Lock body scroll while a modal is open
      useEffect(() => {
        const hasModal = isRegionModalOpen || Boolean(activePartyDetail);
        document.body.style.overflow = hasModal ? "hidden" : "";
        return () => { document.body.style.overflow = ""; };
      }, [isRegionModalOpen, activePartyDetail]);

      // Show toast
      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(""), 2500);
      };

      // Toggle wishlist
      const toggleWishlist = (e, partyId) => {
        e.preventDefault();
        e.stopPropagation();
        setWishlist((prev) => {
          const next = new Set(prev);
          if (next.has(partyId)) {
            next.delete(partyId);
            showToast("관심 파티에서 삭제되었습니다.");
          } else {
            next.add(partyId);
            showToast("관심 파티에 추가되었습니다! (찜 목록)");
          }
          return next;
        });
      };

      // Open / close party detail modal
      const openPartyDetail = (party) => {
        setActivePartyDetail(party);
        setApplyStep("detail");
        setApplyError("");
        setApplyForm({ name: "", phone: "", day: party.days[0] || "", agree: false });
        setSelectedDetailImage(0);
      };

      const closePartyDetail = () => {
        setActivePartyDetail(null);
        setApplyStep("detail");
        setApplyError("");
      };

      const hasApplied = (partyId) => applications.some((a) => a.partyId === partyId);

      // Submit free trial application
      const submitApplication = (e) => {
        e.preventDefault();
        if (!activePartyDetail) return;

        const name = applyForm.name.trim();
        const phone = applyForm.phone.replace(/[^0-9]/g, "");

        if (name.length < 2) {
          setApplyError("이름을 2자 이상 입력해 주세요.");
          return;
        }
        if (phone.length < 10 || phone.length > 11) {
          setApplyError("연락처를 정확히 입력해 주세요. (예: 01012345678)");
          return;
        }
        if (!applyForm.day) {
          setApplyError("참여할 요일을 선택해 주세요.");
          return;
        }
        if (!applyForm.agree) {
          setApplyError("개인정보 수집 및 이용에 동의해 주세요.");
          return;
        }

        if (live) {
          if (!currentUser) {
            setApplyError("카카오 로그인 후 신청할 수 있어요.");
            openLoginModal();
            return;
          }
          if (applySubmitting) return;
          setApplySubmitting(true);
          setApplyError("");
          api("applications", {
            method: "POST",
            body: { slotId: activePartyDetail.id, name, phone, agree: true },
          })
            .then(() => Promise.all([refreshMyApplications(), refreshParties()]))
            .then(() => setApplyStep("done"))
            .catch((err) => setApplyError(err.message))
            .finally(() => setApplySubmitting(false));
          return;
        }

        const application = {
          id: activePartyDetail.id + "-" + Date.now(),
          partyId: activePartyDetail.id,
          partyTitle: activePartyDetail.title,
          venue: activePartyDetail.venue,
          day: applyForm.day,
          name,
          phone,
          appliedAt: new Date().toISOString(),
          userId: currentUser ? currentUser.id : null,
        };

        setApplications((prev) => [application, ...prev]);
        setApplyError("");
        setApplyStep("done");
      };

      // Status badge helpers (spec 3: NEW / 이벤트 / 마감임박)
      const getBadges = (party) => {
        const remaining = party.recruit - party.currentRecruit;
        const badges = party.badges.filter((badge) => !(remaining <= 0 && badge === "마감임박"));
        if (remaining <= 0) {
          if (!badges.includes("마감")) badges.push("마감");
        } else if (remaining <= 2 && !badges.includes("마감임박")) {
          badges.push("마감임박");
        }
        return badges;
      };

      const badgeClass = (badge) => {
        if (badge === "NEW") return "bg-rose-600";
        if (badge === "이벤트") return "bg-amber-500";
        if (badge === "마감임박") return "bg-orange-500";
        return "bg-zinc-800";
      };

      // ===== Admin Dashboard Functions =====
      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPassword === ADMIN_PASSWORD) {
          setIsAdminAuthenticated(true);
          setAdminPassword("");
          showToast("관리자 모드 진입");
        } else {
          showToast("비밀번호가 틀렸습니다.");
        }
      };

      const handleAdminLogout = () => {
        setIsAdminAuthenticated(false);
        setIsAdminOpen(false);
        setAdminTab("dashboard");
        setEditingPartyId(null);
        setEditingReviewId(null);
      };

      const openAdmin = () => {
        setIsAdminOpen(true);
        setIsAdminAuthenticated(false);
        setAdminPassword("");
      };

      const closeAdmin = () => {
        setIsAdminOpen(false);
        setIsAdminAuthenticated(false);
        setAdminPassword("");
      };

      // Filtered parties
      const filteredParties = useMemo(() => {
        return parties.filter((party) => {
          // Region filter
          if (selectedRegion !== "전체 지역" && selectedRegion !== "전체") {
            if (!party.region.includes(selectedRegion)) return false;
          }
          // Day filter
          if (selectedDay !== "전체") {
            if (!party.days.includes(selectedDay)) return false;
          }
          // Category filter
          if (selectedCategory !== "전체") {
            if (party.category !== selectedCategory) return false;
          }
          return true;
        });
      }, [selectedRegion, selectedDay, selectedCategory]);

      // 참여 가능한(잔여석이 있는) 파티 수 — 실시간 동기화
      const availableCount = useMemo(
        () => filteredParties.filter((party) => party.currentRecruit < party.recruit).length,
        [filteredParties]
      );

      // Region modal sub-region list ("전체 지역" 탭은 모든 세부 지역 노출)
      const modalRegions = useMemo(() => {
        if (modalSelectedCategory === "all") {
          const merged = REGION_CATEGORIES
            .filter((category) => category.id !== "all")
            .reduce((acc, category) => acc.concat(category.subRegions), []);
          return ["전체"].concat(Array.from(new Set(merged.filter((region) => region !== "전체"))));
        }
        const found = REGION_CATEGORIES.find((category) => category.id === modalSelectedCategory);
        return found ? found.subRegions : ["전체"];
      }, [modalSelectedCategory]);

      // Party CRUD
      const handlePartySubmit = (e) => {
        e.preventDefault();
        const newParty = {
          ...adminPartyForm,
          id: editingPartyId || Date.now(),
          days: Array.isArray(adminPartyForm.days) ? adminPartyForm.days : [adminPartyForm.days],
          badges: Array.isArray(adminPartyForm.badges) ? adminPartyForm.badges : [],
          images: adminPartyForm.images.filter((img) => img.trim()),
          currentRecruit: Number(adminPartyForm.currentRecruit) || 0,
          recruit: Number(adminPartyForm.recruit) || 10,
        };

        if (editingPartyId) {
          setParties((prev) => prev.map((p) => (p.id === editingPartyId ? newParty : p)));
          showToast("파티가 수정되었습니다.");
        } else {
          setParties((prev) => [newParty, ...prev]);
          showToast("파티가 등록되었습니다.");
        }
        setEditingPartyId(null);
        setAdminPartyForm({
          title: "",
          region: "강남/서초",
          category: "소개팅",
          days: ["금", "토", "일"],
          recruit: 10,
          currentRecruit: 0,
          venue: "",
          address: "",
          desc: "",
          images: [""],
          badges: [],
          isFeatured: false
        });
      };

      const handlePartyEdit = (party) => {
        setEditingPartyId(party.id);
        setAdminPartyForm({
          title: party.title,
          region: party.region,
          category: party.category,
          days: party.days,
          recruit: party.recruit,
          currentRecruit: party.currentRecruit,
          venue: party.venue,
          address: party.address,
          desc: party.desc,
          images: party.images.length ? party.images : [""],
          badges: party.badges || [],
          isFeatured: party.isFeatured || false
        });
      };

      const handlePartyDelete = (partyId) => {
        if (window.confirm("정말 삭제하시겠습니까?")) {
          setParties((prev) => prev.filter((p) => p.id !== partyId));
          showToast("파티가 삭제되었습니다.");
        }
      };

      // Review CRUD
      const handleReviewSubmit = (e) => {
        e.preventDefault();
        const newReview = {
          ...adminReviewForm,
          id: editingReviewId || Date.now(),
          rating: Number(adminReviewForm.rating) || 5,
        };

        if (editingReviewId) {
          setReviews((prev) => prev.map((r) => (r.id === editingReviewId ? newReview : r)));
          showToast("후기가 수정되었습니다.");
        } else {
          setReviews((prev) => [newReview, ...prev]);
          showToast("후기가 등록되었습니다.");
        }
        setEditingReviewId(null);
        setAdminReviewForm({
          avatar: "관",
          avatarBg: "bg-rose-100 text-rose-700",
          name: "",
          time: "방금 전",
          venue: "",
          address: "",
          comment: "",
          rating: 5
        });
      };

      const handleReviewEdit = (review) => {
        setEditingReviewId(review.id);
        setAdminReviewForm({
          avatar: review.avatar,
          avatarBg: review.avatarBg,
          name: review.name,
          time: review.time,
          venue: review.venue,
          address: review.address,
          comment: review.comment,
          rating: review.rating
        });
      };

      const handleReviewDelete = (reviewId) => {
        if (window.confirm("정말 삭제하시겠습니까?")) {
          setReviews((prev) => prev.filter((r) => r.id !== reviewId));
          showToast("후기가 삭제되었습니다.");
        }
      };

      // Application actions
      const handleApplicationDelete = (appId) => {
        if (window.confirm("신청 내역을 삭제하시겠습니까?")) {
          setApplications((prev) => prev.filter((a) => a.id !== appId));
          showToast("신청 내역이 삭제되었습니다.");
        }
      };

      // Stats helpers
      const getStats = () => ({
        totalParties: parties.length,
        activeParties: parties.filter((p) => p.currentRecruit < p.recruit).length,
        totalApplications: applications.length,
        totalReviews: reviews.length,
        totalWishlists: wishlist.size,
        categories: parties.reduce((acc, p) => {
          acc[p.category] = (acc[p.category] || 0) + 1;
          return acc;
        }, {}),
        regions: parties.reduce((acc, p) => {
          acc[p.region] = (acc[p.region] || 0) + 1;
          return acc;
        }, {}),
      });

      // ===== Phase 2: User & Social Functions =====
      // User auth
      // 실서비스 모드: 파티 목록 / 내 신청 내역 불러오기
      const refreshParties = async () => {
        if (!live) return;
        try {
          setParties(await api("parties"));
        } catch (err) {
          showToast(err.message);
        }
      };

      const refreshMyApplications = async () => {
        if (!live) return;
        try {
          setApplications(await api("applications"));
        } catch (err) {
          if (err.status !== 401) showToast(err.message);
        }
      };

      // 실서비스 모드: Supabase Auth 세션 복원 + 카카오 로그인 완료 처리
      useEffect(() => {
        if (!live) return;
        refreshParties();
        client.auth.getSession().then(({ data }) => {
          setCurrentUser(toAppUser(data.session ? data.session.user : null));
        });
        const { data: sub } = client.auth.onAuthStateChange((event, session) => {
          setCurrentUser(toAppUser(session ? session.user : null));
          let pending = false;
          try {
            pending = sessionStorage.getItem("partylink:loginPending") === "1";
            sessionStorage.removeItem("partylink:loginPending");
          } catch (e) {}
          if (event === "SIGNED_IN" && pending) {
            showToast("카카오 로그인 완료");
            addNotification({
              type: "welcome",
              title: "환영합니다!",
              message: "파티커넥트 멤버가 되신 것을 환영합니다.",
              read: false,
            });
          }
        });
        return () => sub.subscription.unsubscribe();
      }, []);

      const currentUserId = currentUser ? currentUser.id : null;
      useEffect(() => {
        if (!live) return;
        if (!currentUserId) {
          setApplications([]);
          return;
        }
        refreshMyApplications();
      }, [currentUserId]);

      const handleMyApplicationCancel = (app) => {
        if (!window.confirm(`"${app.partyTitle}" 신청을 취소하시겠습니까?`)) return;
        api(`applications/${app.id}/cancel`, { method: "POST" })
          .then(() => Promise.all([refreshMyApplications(), refreshParties()]))
          .then(() => showToast("신청이 취소되었습니다."))
          .catch((err) => showToast(err.message));
      };

      // 소셜 로그인은 카카오만 지원합니다.
      const handleSocialLogin = () => {
        if (live) {
          try { sessionStorage.setItem("partylink:loginPending", "1"); } catch (e) {}
          client.auth
            .signInWithOAuth({
              provider: "kakao",
              options: { redirectTo: window.location.origin + window.location.pathname + window.location.search },
            })
            .then(({ error }) => {
              if (error) showToast("카카오 로그인을 시작하지 못했습니다. 잠시 후 다시 시도해 주세요.");
            });
          return;
        }
        const mockUser = {
          id: `user_${Date.now()}`,
          name: '카카오유저',
          avatar: '🟡',
          provider: 'kakao',
          joinedAt: new Date().toISOString(),
          preferences: { regions: [], categories: [] }
        };
        setCurrentUser(mockUser);
        localStorage.setItem("partyconnect:user", JSON.stringify(mockUser));
        setIsLoginModalOpen(false);
        setLoginMethod(null);
        showToast("카카오 로그인 완료");
        addNotification({
          type: 'welcome',
          title: '환영합니다!',
          message: '파티커넥트 멤버가 되신 것을 환영합니다.',
          read: false
        });
      };

      const handleLogout = () => {
        if (live) {
          client.auth.signOut();
          setApplications([]);
        }
        setCurrentUser(null);
        localStorage.removeItem("partyconnect:user");
        showToast("로그아웃 되었습니다.");
      };

      const openLoginModal = (method = null) => {
        setLoginMethod(method);
        setIsLoginModalOpen(true);
      };

      // Notifications
      const addNotification = (notif) => {
        const newNotif = {
          id: `notif_${Date.now()}`,
          ...notif,
          createdAt: new Date().toISOString(),
          read: false
        };
        setNotifications((prev) => [newNotif, ...prev]);
        setUnreadCount((prev) => prev + 1);
      };

      const markAsRead = (notifId) => {
        setNotifications((prev) => prev.map((n) => n.id === notifId ? { ...n, read: true } : n));
        setUnreadCount((prev) => Math.max(0, prev - 1));
      };

      const markAllAsRead = () => {
        setNotifications((prev) => prev.map((n) => ({ ...n, read: true })));
        setUnreadCount(0);
      };

      const deleteNotification = (notifId) => {
        setNotifications((prev) => prev.filter((n) => n.id !== notifId));
      };

      // Review writing
      const openReviewWrite = (party) => {
        setReviewWriteParty(party);
        setReviewWriteForm({ rating: 5, comment: "", photos: [], tags: [] });
        setIsReviewWriteOpen(true);
        setActivePartyDetail(null);
      };

      const submitReview = (e) => {
        e.preventDefault();
        if (!reviewWriteParty || !currentUser) return;
        
        if (reviewWriteForm.comment.trim().length < 10) {
          showToast("후기는 10자 이상 작성해 주세요.");
          return;
        }

        const newReview = {
          id: `review_${Date.now()}`,
          avatar: currentUser.avatar || "👤",
          avatarBg: "bg-rose-100 text-rose-700",
          name: currentUser.name,
          time: "방금 전",
          venue: reviewWriteParty.venue,
          address: reviewWriteParty.address,
          comment: reviewWriteForm.comment.trim(),
          rating: reviewWriteForm.rating,
          photos: reviewWriteForm.photos,
          tags: reviewWriteForm.tags,
          userId: currentUser.id
        };

        setReviews((prev) => [newReview, ...prev]);
        setIsReviewWriteOpen(false);
        setReviewWriteParty(null);
        showToast("후기가 등록되었습니다!");
        addNotification({
          type: 'review',
          title: '후기 작성 완료',
          message: `"${reviewWriteParty.title}" 후기가 등록되었습니다.`,
          read: false
        });
      };

      // My Page
      const openMyPage = () => {
        if (!currentUser) {
          openLoginModal();
          return;
        }
        setMyPageTab("applications");
        setIsMyPageOpen(true);
      };

      const closeMyPage = () => {
        setIsMyPageOpen(false);
      };

      // Map
      const openMap = (party) => {
        setMapParty(party);
        setIsMapOpen(true);
      };

      // Persist notifications
      useEffect(() => {
        try {
          localStorage.setItem("partyconnect:notifications", JSON.stringify(notifications));
        } catch (e) {}
      }, [notifications]);

      // Persist user
      useEffect(() => {
        if (currentUser) {
          localStorage.setItem("partyconnect:user", JSON.stringify(currentUser));
        }
      }, [currentUser]);

      // Reduced motion detection
      useEffect(() => {
        const mediaQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
        setPrefersReducedMotion(mediaQuery.matches);
        const handler = (e) => setPrefersReducedMotion(e.matches);
        mediaQuery.addEventListener('change', handler);
        return () => mediaQuery.removeEventListener('change', handler);
      }, []);

      // ===== Admin Tab Components =====
      const AdminDashboardTab = ({ parties, applications, reviews, wishlist }) => {
        const stats = getStats();
        return (
          <div className="space-y-4">
            <h4 className="text-sm font-bold text-zinc-900">개요</h4>
            <div className="grid grid-cols-2 gap-3 sm:grid-cols-5">
              <StatCard title="전체 파티" value={stats.totalParties} icon="📋" />
              <StatCard title="모집 중" value={stats.activeParties} icon="🟢" />
              <StatCard title="신청자" value={stats.totalApplications} icon="📝" />
              <StatCard title="후기" value={stats.totalReviews} icon="⭐" />
              <StatCard title="찜하기" value={stats.totalWishlists} icon="❤️" />
            </div>
            <div className="grid grid-cols-1 gap-4 sm:grid-cols-2">
              <div className="rounded-xl border border-zinc-200 p-4">
                <h5 className="text-xs font-bold text-zinc-600 mb-2">카테고리별 분포</h5>
                <div className="space-y-2">
                  {Object.entries(stats.categories).map(([cat, count]) => (
                    <div key={cat} className="flex justify-between text-xs">
                      <span className="text-zinc-600">{cat}</span>
                      <span className="font-bold text-zinc-900">{count}개</span>
                    </div>
                  ))}
                </div>
              </div>
              <div className="rounded-xl border border-zinc-200 p-4">
                <h5 className="text-xs font-bold text-zinc-600 mb-2">지역별 분포</h5>
                <div className="space-y-2 max-h-40 overflow-y-auto">
                  {Object.entries(stats.regions).map(([region, count]) => (
                    <div key={region} className="flex justify-between text-xs">
                      <span className="text-zinc-600 truncate pr-2">{region}</span>
                      <span className="font-bold text-zinc-900">{count}개</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        );
      };

      const StatCard = ({ title, value, icon }) => (
        <div className="rounded-xl border border-zinc-200 bg-zinc-50/50 p-4 text-center">

              <div
                role="dialog"
                aria-modal="true"
                aria-labelledby="login-modal-title"
                onClick={(e) => e.stopPropagation()}
                className="animate-slide-up relative w-full max-w-md rounded-2xl bg-white shadow-2xl overflow-hidden"
              >
                <div className="p-6">
                  <div className="flex items-center justify-between mb-6">
                    <h3 id="login-modal-title" className="text-lg font-bold text-zinc-900">로그인 / 회원가입</h3>
                    <button
                      onClick={() => setIsLoginModalOpen(false)}
                      className="text-zinc-400 hover:text-zinc-700"
                    >✕</button>
                  </div>

                  <div className="space-y-3">
                    <p className="text-center text-xs text-zinc-500 mb-4">카카오로 시작하세요</p>
                    <button
                      onClick={handleSocialLogin}
                      className="w-full flex items-center justify-center gap-3 rounded-xl border border-zinc-200 bg-white px-4 py-3 hover:bg-zinc-50 transition"
                    >
                      <span className="text-2xl">🟡</span>
                      <span className="font-semibold text-zinc-900">카카오로 계속하기</span>
                    </button>
                    <p className="text-center text-xs text-zinc-400">데모 모드: 모의 로그인 / 실서비스: 카카오 OAuth</p>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ================= NOTIFICATION CENTER ================= */}
          {isNotificationOpen && (
            <div
              className="animate-fade-in fixed inset-0 z-[60] flex items-start justify-end bg-black/60 p-4 backdrop-blur-sm"
              onClick={() => setIsNotificationOpen(false)}
            >
              <div
                role="dialog"
                aria-modal="true"
                aria-labelledby="notification-title"
                onClick={(e) => e.stopPropagation()}
                className="animate-slide-up relative w-full max-w-md max-h-[80vh] rounded-2xl bg-white shadow-2xl flex flex-col"
              >
                <div className="flex items-center justify-between border-b border-zinc-100 p-4">
                  <h3 id="notification-title" className="text-base font-bold text-zinc-900">알림</h3>
                  <div className="flex items-center gap-2">
                    {unreadCount > 0 && (
                      <button
                        onClick={markAllAsRead}
                        className="text-xs text-rose-600 font-semibold hover:underline"
                      >
                        모두 읽음
                      </button>
                    )}
                    <button
                      onClick={() => setIsNotificationOpen(false)}
                      className="size-7 rounded-full text-zinc-400 hover:bg-zinc-100"
                    >✕</button>
                  </div>
                </div>
                <div className="flex-1 overflow-y-auto p-4 space-y-2">
                  {notifications.length === 0 ? (
                    <div className="text-center py-8 text-zinc-500">
                      <div className="text-3xl mb-2">🔔</div>
                      <p className="text-sm">새 알림이 없습니다</p>
                    </div>
                  ) : (
                    notifications.map((notif) => (
                      <div
                        key={notif.id}
                        className={`p-3 rounded-xl border transition ${notif.read ? 'bg-white border-zinc-100' : 'bg-rose-50 border-rose-100'}`}
                        onClick={() => !notif.read && markAsRead(notif.id)}
                      >
                        <div className="flex items-start gap-3">
                          <div className={`flex size-8 items-center justify-center rounded-full ${notif.type === 'welcome' ? 'bg-emerald-100 text-emerald-600' : notif.type === 'review' ? 'bg-amber-100 text-amber-600' : 'bg-rose-100 text-rose-600'}`}
                          >
                            {notif.type === 'welcome' ? '✨' : notif.type === 'review' ? '⭐' : '📢'}
                          </div>
                          <div className="flex-1 min-w-0">
                            <p className="text-xs font-bold text-zinc-900">{notif.title}</p>
                            <p className="text-xs text-zinc-600 mt-0.5 line-clamp-2">{notif.message}</p>
                            <p className="text-[10px] text-zinc-400 mt-1">{new Date(notif.createdAt).toLocaleString()}</p>
                          </div>
                          <button
                            onClick={(e) => { e.stopPropagation(); deleteNotification(notif.id); }}
                            className="text-zinc-400 hover:text-zinc-700"
                          >✕</button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ================= REVIEW WRITE MODAL ================= */}
          {isReviewWriteOpen && reviewWriteParty && (
            <div
              className="animate-fade-in fixed inset-0 z-[60] flex items-center justify-center bg-black/80 p-4 backdrop-blur-sm"
              onClick={() => setIsReviewWriteOpen(false)}
            >
              <div
                role="dialog"
                aria-modal="true"
                aria-labelledby="review-write-title"
                onClick={(e) => e.stopPropagation()}
                className="animate-slide-up relative w-full max-w-md max-h-[90vh] rounded-2xl bg-white shadow-2xl overflow-y-auto"
              >
                <div className="p-6">
                  <div className="flex items-center justify-between mb-4">
                    <h3 id="review-write-title" className="text-base font-bold text-zinc-900">후기 작성</h3>
                    <button
                      onClick={() => setIsReviewWriteOpen(false)}
                      className="text-zinc-400 hover:text-zinc-700"
                    >✕</button>
                  </div>
                  <p className="text-xs text-zinc-500 mb-4">{reviewWriteParty.title}</p>
                  <form onSubmit={submitReview} className="space-y-4">
                    <div>
                      <label className="text-xs font-bold text-zinc-700">별점</label>
                      <div className="mt-2 flex gap-1">
                        {[5,4,3,2,1].map((star) => (
                          <button
                            key={star}
                            type="button"
                            onClick={() => setReviewWriteForm((prev) => ({ ...prev, rating: star }))}
                            className={`text-3xl transition ${reviewWriteForm.rating >= star ? 'text-amber-400' : 'text-zinc-200'}`}
                          >
                            ★
                          </button>
                        ))}
                      </div>
                    </div>
                    <div>
                      <label className="text-xs font-bold text-zinc-700">후기 내용 <span className="text-rose-600">*</span></label>
                      <textarea
                        value={reviewWriteForm.comment}
                        onChange={(e) => setReviewWriteForm((prev) => ({ ...prev, comment: e.target.value }))}
                        placeholder="어떤 점이 좋았나요? 분위기, 서비스, 메뉴 등 자유롭게 적어주세요 (10자 이상)"
                        rows={4}
                        className="mt-1 w-full rounded-lg border border-zinc-200 bg-white px-3 py-2 text-xs text-zinc-900 placeholder:text-zinc-400 focus:border-rose-400 focus:outline-none focus:ring-2 focus:ring-rose-100"
                        required
                      />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-zinc-700">태그 (콤마로 구분)</label>
                      <input
                        value={reviewWriteForm.tags.join(', ')}
                        onChange={(e) => setReviewWriteForm((prev) => ({ ...prev, tags: e.target.value.split(',').map(s => s.trim()).filter(Boolean) }))}
                        placeholder="친절함, 분위기굿, 재방문의사, 가성비"
                        className="mt-1 w-full rounded-lg border border-zinc-200 bg-white px-3 py-2 text-xs text-zinc-900 placeholder:text-zinc-400 focus:border-rose-400 focus:outline-none focus:ring-2 focus:ring-rose-100"
                      />
                    </div>
                    <div className="flex gap-2 pt-2">
                      <button
                        type="button"
                        onClick={() => setIsReviewWriteOpen(false)}
                        className="flex-1 rounded-lg border border-zinc-200 bg-white py-2.5 text-xs font-bold text-zinc-700 hover:bg-zinc-50"
                      >
                        취소
                      </button>
                      <button
                        type="submit"
                        className="flex-1 rounded-lg bg-rose-600 py-2.5 text-xs font-bold text-white hover:bg-rose-700"
                      >
                        등록하기
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          )}

          {/* ================= MY PAGE MODAL ================= */}
          {isMyPageOpen && currentUser && (
            <div
              className="animate-fade-in fixed inset-0 z-[60] flex items-center justify-center bg-black/80 p-4 backdrop-blur-sm"
              onClick={closeMyPage}
            >
              <div
                role="dialog"
                aria-modal="true"
                aria-labelledby="mypage-title"
                onClick={(e) => e.stopPropagation()}
                className="animate-slide-up relative w-full max-w-lg max-h-[90vh] rounded-2xl bg-white shadow-2xl overflow-y-auto"
              >
                <div className="p-4 border-b border-zinc-100">
                  <div className="flex items-center gap-3">
                    <span className="text-3xl">{currentUser.avatar}</span>
                    <div>
                      <p className="font-bold text-zinc-900">{currentUser.name}</p>
                      <p className="text-xs text-zinc-500">멤버 가입: {new Date(currentUser.joinedAt).toLocaleDateString()}</p>
                    </div>
                  </div>
                </div>
                <div className="border-b border-zinc-100">
                  <div className="flex overflow-x-auto no-scrollbar">
                    {['applications', 'wishlist', 'reviews', 'settings'].map((tab) => (
                      <button
                        key={tab}
                        onClick={() => setMyPageTab(tab)}
                        className={`shrink-0 px-4 py-2 text-xs font-bold border-b-2 transition ${myPageTab === tab ? 'border-rose-600 text-rose-600' : 'border-transparent text-zinc-500 hover:text-zinc-900'}`}
                      >
                        {tab === 'applications' ? '내 신청' : tab === 'wishlist' ? '찜한 파티' : tab === 'reviews' ? '내 후기' : '설정'}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="p-4">
                  {myPageTab === 'applications' && (
                    <div className="space-y-3">
                      <h4 className="text-sm font-bold text-zinc-900">체험단 신청 내역 ({applications.filter(a => a.userId === currentUser.id).length}건)</h4>
                      {applications.filter(a => a.userId === currentUser.id).length === 0 ? (
                        <p className="text-center py-8 text-zinc-500 text-sm">신청 내역이 없습니다</p>
                      ) : (
                        applications.filter(a => a.userId === currentUser.id).map((app) => (
                          <div key={app.id} className="rounded-lg border border-zinc-200 p-3">
                            <p className="font-semibold text-zinc-900">{app.partyTitle}</p>
                            <p className="text-xs text-zinc-500">{app.venue} · {app.day}요일</p>
                            <p className="text-xs text-zinc-400 mt-1">신청일: {new Date(app.appliedAt).toLocaleString()}</p>
                          </div>
                        ))
                      )}
                    </div>
                  )}
                  {myPageTab === 'wishlist' && (
                    <div className="space-y-3">
                      <h4 className="text-sm font-bold text-zinc-900">찜한 파티 ({Array.from(wishlist).length}개)</h4>
                      {Array.from(wishlist).length === 0 ? (
                        <p className="text-center py-8 text-zinc-500 text-sm">찜한 파티가 없습니다</p>
                      ) : (
                        Array.from(wishlist).map((partyId) => {
                          const party = parties.find(p => p.id === partyId);
                          return party ? (
                            <div key={party.id} className="rounded-lg border border-zinc-200 p-3">
                              <p className="font-semibold text-zinc-900">{party.title}</p>
                              <p className="text-xs text-zinc-500">{party.region} · {party.category}</p>
                            </div>
                          ) : null;
                        })
                      )}
                    </div>
                  )}
                  {myPageTab === 'reviews' && (
                    <div className="space-y-3">
                      <h4 className="text-sm font-bold text-zinc-900">내가 쓴 후기 ({reviews.filter(r => r.userId === currentUser.id).length}개)</h4>
                      {reviews.filter(r => r.userId === currentUser.id).length === 0 ? (
                        <p className="text-center py-8 text-zinc-500 text-sm">작성한 후기가 없습니다</p>
                      ) : (
                        reviews.filter(r => r.userId === currentUser.id).map((review) => (
                          <div key={review.id} className="rounded-lg border border-zinc-200 p-3">
                            <div className="flex items-center gap-2 mb-1">
                              <span className="text-amber-500 font-bold">★ {review.rating}.0</span>
                              <span className="text-xs text-zinc-500">{review.venue}</span>
                            </div>
                            <p className="text-xs text-zinc-700 line-clamp-2">{review.comment}</p>
                          </div>
                        ))
                      )}
                    </div>
                  )}
                  {myPageTab === 'settings' && (
                    <div className="space-y-4">
                      <h4 className="text-sm font-bold text-zinc-900">설정</h4>
                      <div className="rounded-xl border border-zinc-200 p-4 space-y-3">
                        <button
                          onClick={handleLogout}
                          className="w-full text-left text-rose-600 font-semibold hover:underline"
                        >
                          로그아웃
                        </button>
                        <div className="pt-2 border-t border-zinc-100">
                          <p className="text-xs text-zinc-500">계정 삭제는 고객센터로 문의해 주세요.</p>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ================= MAP MODAL ================= */}
          {isMapOpen && mapParty && (
            <div
              className="animate-fade-in fixed inset-0 z-[60] flex items-center justify-center bg-black/80 p-4 backdrop-blur-sm"
              onClick={() => setIsMapOpen(false)}
            >
              <div
                role="dialog"
                aria-modal="true"
                aria-labelledby="map-title"
                onClick={(e) => e.stopPropagation()}
                className="animate-slide-up relative w-full max-w-lg max-h-[80vh] rounded-2xl bg-white shadow-2xl overflow-hidden"
              >
                <div className="flex items-center justify-between border-b border-zinc-100 p-3">
                  <h3 id="map-title" className="text-sm font-bold text-zinc-900">위치 안내</h3>
                  <button
                    onClick={() => setIsMapOpen(false)}
                    className="size-7 rounded-full text-zinc-400 hover:bg-zinc-100"
                  >✕</button>
                </div>
                <div className="p-4 space-y-3">
                  <div className="rounded-xl bg-zinc-100 aspect-[4/3] flex items-center justify-center">
                    <div className="text-center text-zinc-500">
                      <div className="text-4xl mb-2">🗺️</div>
                      <p className="text-sm font-medium">카카오맵 연동 준비 중</p>
                      <p className="text-xs text-zinc-400 mt-1">{mapParty.venue}<br/>{mapParty.address}</p>
                    </div>
                  </div>
                  <div className="rounded-lg bg-zinc-50 p-3 text-xs space-y-1">
                    <p><strong>장소:</strong> {mapParty.venue}</p>
                    <p><strong>주소:</strong> {mapParty.address}</p>
                    <p><strong>일정:</strong> 매주 {mapParty.days.join(', ')}요일</p>
                  </div>
                  <div className="flex gap-2">
                    <button
                      onClick={() => { navigator.clipboard.writeText(mapParty.address); showToast('주소가 복사되었습니다'); }}
                      className="flex-1 rounded-lg border border-zinc-200 bg-white py-2 text-xs font-semibold text-zinc-700 hover:bg-zinc-50"
                    >
                      주소 복사
                    </button>
                    <button
                      onClick={() => { window.open(`https://map.kakao.com/link/search/${encodeURIComponent(mapParty.venue)}`, '_blank'); }}
                      className="flex-1 rounded-lg bg-rose-600 py-2 text-xs font-bold text-white hover:bg-rose-700"
                    >
                      카카오맵에서 보기
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
