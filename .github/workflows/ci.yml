name: CI - Deploy Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate JSX syntax (balanced brackets)
        run: |
          python3 << 'EOF'
import re
import sys

with open('index.html', 'r', encoding='utf-8') as f:
    content = f.read()

scripts = re.findall(r'<script type="text/babel">(.*?)</script>', content, re.DOTALL)
if not scripts:
    print("ERROR: No babel script found")
    sys.exit(1)

script = scripts[0]

# Check balanced braces, brackets, parens
def check_balanced(text):
    stack = []
    pairs = {')': '(', ']': '[', '}': '{'}
    for idx, ch in enumerate(text):
        if ch in '([{':
            stack.append((ch, idx))
        elif ch in ')]}':
            if not stack:
                return False, f'Unmatched {ch} at position {idx}'
            last, pos = stack.pop()
            if pairs[ch] != last:
                return False, f'Mismatch at {idx}: expected {pairs[ch]} but got {last} (from pos {pos})'
    if stack:
        for ch, pos in stack:
            return False, f'Unclosed {ch} at position {pos}'
    return True, 'OK'

ok, msg = check_balanced(script)
if not ok:
    print(f"ERROR: JSX syntax check failed - {msg}")
    sys.exit(1)
print(f"JSX syntax check passed: {msg}")

# Check component definitions vs usage
jsx_opens = re.findall(r'<([A-Z]\w*)', script)
jsx_closes = re.findall(r'</([A-Z]\w*)>', script)
from collections import Counter
open_counter = Counter(jsx_opens)
close_counter = Counter(jsx_closes)

for tag, count in open_counter.items():
    if close_counter.get(tag, 0) != count and tag not in ['StatCard', 'AdminDashboardTab', 'AdminPartiesTab', 'AdminApplicationsTab', 'AdminReviewsTab', 'AdminStatsTab', 'App']:
        print(f"WARNING: <{tag}> opens={count} closes={close_counter.get(tag, 0)} (may be component definition)")

print("Component validation passed")
EOF

      - name: Validate HTML structure
        run: |
          python3 << 'EOF'
import re
import sys

with open('index.html', 'r', encoding='utf-8') as f:
    html = f.read()

checks = [
    ('Root element', r'id="root"', True),
    ('Babel script type', r'type="text/babel"', True),
    ('ReactDOM.createRoot', r'ReactDOM\.createRoot', True),
    ('App component render', r'<App />', True),
    ('Tailwind CDN', r'cdn\.tailwindcss\.com', True),
    ('React CDN', r'unpkg\.com/react@18', True),
    ('ReactDOM CDN', r'unpkg\.com/react-dom@18', True),
    ('Babel CDN', r'unpkg\.com/@babel/standalone', True),
    ('Pretendard CDN', r'cdn\.jsdelivr\.net.*pretendard', True),
]

all_passed = True
for name, pattern, required in checks:
    found = bool(re.search(pattern, html))
    if found:
        print(f"  ✅ {name}")
    elif required:
        print(f"  ❌ {name} - MISSING (required)")
        all_passed = False
    else:
        print(f"  ⚠️ {name} - MISSING (optional)")

# Check for common JSX issues
classNameConcat = re.search(r'className\s*=\s*["\'][^"\']*["\']\s*\+\s*\(', html)
if classNameConcat:
    print("  ❌ Found string concatenation in className (use template literals)")
    all_passed = False
else:
    print("  ✅ No string concatenation in className")

z60 = re.search(r'z-60(?![0-9])', html)
if z60:
    print("  ❌ Found invalid z-60 class (use z-[60] instead)")
    all_passed = False
else:
    print("  ✅ No invalid z-60 classes")

# Check component definitions
components = ['AdminDashboardTab', 'AdminPartiesTab', 'AdminApplicationsTab', 'AdminReviewsTab', 'AdminStatsTab', 'StatCard']
for name in components:
    has_def = bool(re.search(rf'const {name}\s*=', html))
    has_usage = bool(re.search(rf'<{name}[\s>]', html))
    if has_usage and not has_def:
        print(f"  ❌ Component {name} is used but not defined")
        all_passed = False
    elif has_def and has_usage:
        print(f"  ✅ Component {name} defined and used")

if not all_passed:
    sys.exit(1)
print("✅ HTML validation PASSED")
EOF

      - name: Validate external dependencies
        run: |
          for url in \
            "https://cdn.tailwindcss.com" \
            "https://unpkg.com/react@18/umd/react.development.js" \
            "https://unpkg.com/react-dom@18/umd/react-dom.development.js" \
            "https://unpkg.com/@babel/standalone/babel.min.js" \
            "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"; do
            if ! curl -s -o /dev/null -w "%{http_code}" "$url" | grep -q "200\|302"; then
              echo "ERROR: CDN dependency unavailable: $url"
              exit 1
            fi
          done
          echo "External dependency check passed"

      - name: Validate deployment config
        run: |
          if [ ! -f _config.yml ]; then
            echo "ERROR: _config.yml not found"
            exit 1
          fi
          if [ ! -f .gitignore ]; then
            echo "ERROR: .gitignore not found"
            exit 1
          fi
          echo "Deployment config check passed"

  test-e2e:
    name: E2E Browser Tests (Non-blocking)
    runs-on: ubuntu-latest
    needs: validate
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests against live URL
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: https://j-hype-labs.github.io/party-connect-mvp/

      - name: Run E2E tests against local server
        if: github.event_name == 'pull_request'
        run: |
          python3 -m http.server 3000 &
          sleep 5
          npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

  deploy-check:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for GitHub Pages deployment
        run: |
          echo "Waiting for GitHub Pages deployment to complete (up to 10 minutes)..."
          for i in {1..40}; do
            echo "Waiting for Pages deployment... (attempt $i/40)"
            sleep 15
          done
          echo "Proceeding to verification"

      - name: Verify deployment URL accessible
        run: |
          for i in {1..20}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://j-hype-labs.github.io/party-connect-mvp/ || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Deployment verified: HTTP 200"
              exit 0
            fi
            echo "Waiting for deployment... (attempt $i/20, got $HTTP_CODE)"
            sleep 15
          done
          echo "ERROR: Deployment not accessible after 5 minutes"
          exit 1

      - name: Verify content rendered
        run: |
          CONTENT=$(curl -s https://j-hype-labs.github.io/party-connect-mvp/)
          
          if ! echo "$CONTENT" | grep -q "id=\"root\""; then
            echo "ERROR: Root element missing"
            exit 1
          fi
          if ! echo "$CONTENT" | grep -q "text/babel"; then
            echo "ERROR: Babel script missing"
            exit 1
          fi
          if ! echo "$CONTENT" | grep -q "파티커넥트"; then
            echo "ERROR: Korean content not found"
            exit 1
          fi
          
          echo "Static content verification passed"

      - name: Report success
        if: success()
        run: |
          echo "✅ All checks passed - Deployment verified"
          echo "🌐 Live URL: https://j-hype-labs.github.io/party-connect-mvp/"

      - name: Report failure
        if: failure()
        run: |
          echo "❌ Deployment verification failed"
          echo "Check GitHub Actions logs for details"
          exit 1