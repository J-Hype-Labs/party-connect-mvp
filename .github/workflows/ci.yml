name: CI - Deploy Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML structure (basic grep)
        run: |
          echo "Checking required elements..."
          grep -q 'id="root"' index.html && echo "✅ Root element" || (echo "❌ Root element missing" && exit 1)
          grep -q 'text/babel' index.html && echo "✅ Babel script type" || (echo "❌ Babel script type missing" && exit 1)
          grep -q 'ReactDOM.createRoot' index.html && echo "✅ ReactDOM.createRoot" || (echo "❌ ReactDOM.createRoot missing" && exit 1)
          grep -q '<App />' index.html && echo "✅ App component render" || (echo "❌ App component render missing" && exit 1)
          grep -q 'cdn.tailwindcss.com' index.html && echo "✅ Tailwind CDN" || (echo "❌ Tailwind CDN missing" && exit 1)
          grep -q 'unpkg.com/react@18' index.html && echo "✅ React CDN" || (echo "❌ React CDN missing" && exit 1)
          grep -q 'unpkg.com/react-dom@18' index.html && echo "✅ ReactDOM CDN" || (echo "❌ ReactDOM CDN missing" && exit 1)
          grep -q 'unpkg.com/@babel/standalone' index.html && echo "✅ Babel CDN" || (echo "❌ Babel CDN missing" && exit 1)
          grep -q 'cdn.jsdelivr.net.*pretendard' index.html && echo "✅ Pretendard CDN" || (echo "❌ Pretendard CDN missing" && exit 1)
          echo "✅ HTML validation PASSED"

      - name: Validate JSX syntax (Python bracket checker)
        run: |
          python3 << 'PYEOF'
import re, sys
with open('index.html', 'r', encoding='utf-8') as f:
    content = f.read()
scripts = re.findall(r'<script type="text/babel">(.*?)</script>', content, re.DOTALL)
if not scripts:
    print("ERROR: No babel script found"); sys.exit(1)
script = scripts[0]

stack = []
pairs = {')': '(', ']': '[', '}': '{'}
for idx, ch in enumerate(script):
    if ch in '([{':
        stack.append((ch, idx))
    elif ch in ')]}':
        if not stack:
            print(f"ERROR: Unmatched {ch} at {idx}"); sys.exit(1)
        last, pos = stack.pop()
        if pairs[ch] != last:
            print(f"ERROR: Mismatch at {idx}: expected {pairs[ch]} got {last}"); sys.exit(1)
if stack:
    for ch, pos in stack:
        print(f"ERROR: Unclosed {ch} at {pos}"); sys.exit(1)
print("✅ JSX bracket validation PASSED")
PYEOF

      - name: Validate external dependencies
        run: |
          for url in \
            "https://cdn.tailwindcss.com" \
            "https://unpkg.com/react@18/umd/react.development.js" \
            "https://unpkg.com/react-dom@18/umd/react-dom.development.js" \
            "https://unpkg.com/@babel/standalone/babel.min.js" \
            "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"; do
            if ! curl -s -o /dev/null -w "%{http_code}" "$url" | grep -q "200\|302"; then
              echo "ERROR: CDN dependency unavailable: $url"
              exit 1
            fi
          done
          echo "External dependency check passed"

      - name: Validate deployment config
        run: |
          if [ ! -f _config.yml ]; then
            echo "ERROR: _config.yml not found"
            exit 1
          fi
          if [ ! -f .gitignore ]; then
            echo "ERROR: .gitignore not found"
            exit 1
          fi
          echo "Deployment config check passed"

  deploy-check:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for GitHub Pages deployment
        run: |
          echo "Waiting for GitHub Pages deployment to complete (up to 10 minutes)..."
          for i in {1..40}; do
            echo "Waiting for Pages deployment... (attempt $i/40)"
            sleep 15
          done
          echo "Proceeding to verification"

      - name: Verify deployment URL accessible
        run: |
          for i in {1..20}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://j-hype-labs.github.io/party-connect-mvp/ || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Deployment verified: HTTP 200"
              exit 0
            fi
            echo "Waiting for deployment... (attempt $i/20, got $HTTP_CODE)"
            sleep 15
          done
          echo "ERROR: Deployment not accessible after 5 minutes"
          exit 1

      - name: Verify content rendered
        run: |
          CONTENT=$(curl -s https://j-hype-labs.github.io/party-connect-mvp/)
          
          if ! echo "$CONTENT" | grep -q "id=\"root\""; then
            echo "ERROR: Root element missing"
            exit 1
          fi
          if ! echo "$CONTENT" | grep -q "text/babel"; then
            echo "ERROR: Babel script missing"
            exit 1
          fi
          if ! echo "$CONTENT" | grep -q "파티커넥트"; then
            echo "ERROR: Korean content not found"
            exit 1
          fi
          
          echo "Static content verification passed"

      - name: Report success
        if: success()
        run: |
          echo "✅ All checks passed - Deployment verified"
          echo "🌐 Live URL: https://j-hype-labs.github.io/party-connect-mvp/"

      - name: Report failure
        if: failure()
        run: |
          echo "❌ Deployment verification failed"
          echo "Check GitHub Actions logs for details"
          exit 1