name: CI - Deploy Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Validate HTML structure (grep)
        run: |
          echo "Checking required elements..."
          grep -q 'id="root"' index.html && echo "✅ Root element" || (echo "❌ Root element missing" && exit 1)
          grep -q 'text/babel' index.html && echo "✅ Babel script type" || (echo "❌ Babel script type missing" && exit 1)
          grep -q 'ReactDOM.createRoot' index.html && echo "✅ ReactDOM.createRoot" || (echo "❌ ReactDOM.createRoot missing" && exit 1)
          grep -q '<App />' index.html && echo "✅ App component render" || (echo "❌ App component render missing" && exit 1)
          grep -q 'cdn.tailwindcss.com' index.html && echo "✅ Tailwind CDN" || (echo "❌ Tailwind CDN missing" && exit 1)
          grep -q 'unpkg.com/react@18' index.html && echo "✅ React CDN" || (echo "❌ React CDN missing" && exit 1)
          grep -q 'unpkg.com/react-dom@18' index.html && echo "✅ ReactDOM CDN" || (echo "❌ ReactDOM CDN missing" && exit 1)
          grep -q 'unpkg.com/@babel/standalone' index.html && echo "✅ Babel CDN" || (echo "❌ Babel CDN missing" && exit 1)
          grep -q 'cdn.jsdelivr.net.*pretendard' index.html && echo "✅ Pretendard CDN" || (echo "❌ Pretendard CDN missing" && exit 1)
          echo "✅ HTML validation PASSED"

      - name: Validate JSX syntax with @babel/parser
        run: npm run validate:jsx

      - name: Validate JSX syntax (Python bracket checker - secondary)
        run: python3 scripts/validate-jsx-ci.py

      - name: Validate external dependencies
        run: |
          for url in \
            "https://cdn.tailwindcss.com" \
            "https://unpkg.com/react@18/umd/react.development.js" \
            "https://unpkg.com/react-dom@18/umd/react-dom.development.js" \
            "https://unpkg.com/@babel/standalone/babel.min.js" \
            "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"; do
            if ! curl -s -o /dev/null -w "%{http_code}" "$url" | grep -q "200\|302"; then
              echo "ERROR: CDN dependency unavailable: $url"
              exit 1
            fi
          done
          echo "External dependency check passed"

      - name: Validate deployment config
        run: |
          if [ ! -f _config.yml ]; then
            echo "ERROR: _config.yml not found"
            exit 1
          fi
          if [ ! -f .gitignore ]; then
            echo "ERROR: .gitignore not found"
            exit 1
          fi
          if [ ! -f .nojekyll ]; then
            echo "ERROR: .nojekyll not found"
            exit 1
          fi
          echo "Deployment config check passed"

  test-e2e:
    name: E2E Browser Tests (Chromium)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 3000 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          # Wait for server to be ready
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ | grep -q "200"; then
              echo "Local server ready"
              break
            fi
            echo "Waiting for local server... ($i/30)"
            sleep 2
          done

      - name: Debug - show local server content
        run: |
          echo "=== Local server HTML (first 2000 chars) ==="
          curl -s http://localhost:3000/ | head -c 2000
          echo ""
          echo "=== End HTML ==="

      - name: Run Playwright E2E tests (inline)
        run: |
          node << 'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            let failed = false;
            
            try {
              console.log('Test 1: Load page and check root element');
              await page.goto('http://localhost:3000/', { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForSelector('#root', { timeout: 30000 });
              await page.waitForTimeout(5000);
              
              const rootVisible = await page.locator('#root').isVisible();
              console.log('  Root visible:', rootVisible);
              if (!rootVisible) { console.error('  FAIL: Root not visible'); failed = true; }
              
              const koreanText = await page.locator('text=파티커넥트').first().isVisible();
              console.log('  Korean text visible:', koreanText);
              if (!koreanText) { console.error('  FAIL: Korean text not visible'); failed = true; }
              
              console.log('Test 2: Check hero banner section');
              const sectionVisible = await page.locator('section').first().isVisible();
              console.log('  Section visible:', sectionVisible);
              if (!sectionVisible) { console.error('  FAIL: Section not visible'); failed = true; }
              
              console.log('Test 3: Check filter buttons');
              const regionBtn = await page.locator('button').filter({ hasText: '지역 선택' }).isVisible();
              console.log('  Region button visible:', regionBtn);
              if (!regionBtn) { console.error('  FAIL: Region button not visible'); failed = true; }
              
              const allDayBtn = await page.locator('button').filter({ hasText: '전체' }).isVisible();
              console.log('  All day button visible:', allDayBtn);
              if (!allDayBtn) { console.error('  FAIL: All day button not visible'); failed = true; }
              
              const categoryBtn = await page.locator('button').filter({ hasText: '혼술바' }).isVisible();
              console.log('  Category button visible:', categoryBtn);
              if (!categoryBtn) { console.error('  FAIL: Category button not visible'); failed = true; }
              
              console.log('Test 4: Check party cards');
              const cards = page.locator('[role="button"]').or(page.locator('text=무료 체험단'));
              const cardCount = await cards.count();
              console.log('  Card count:', cardCount);
              if (cardCount === 0) { console.error('  FAIL: No cards found'); failed = true; }
              
              const firstCardVisible = await cards.first().isVisible();
              console.log('  First card visible:', firstCardVisible);
              if (!firstCardVisible) { console.error('  FAIL: First card not visible'); failed = true; }
              
              console.log('Test 5: Open region modal');
              await page.locator('button').filter({ hasText: '지역 선택' }).click();
              await page.waitForTimeout(1000);
              const modalVisible = await page.locator('text=지역 선택').isVisible();
              console.log('  Modal visible:', modalVisible);
              if (!modalVisible) { console.error('  FAIL: Modal not visible'); failed = true; }
              
              const seoulVisible = await page.locator('text=서울').isVisible();
              console.log('  Seoul visible:', seoulVisible);
              if (!seoulVisible) { console.error('  FAIL: Seoul not visible'); failed = true; }
              
              await page.keyboard.press('Escape');
              await page.waitForTimeout(500);
              const modalHidden = await page.locator('text=지역 선택').isHidden();
              console.log('  Modal hidden after ESC:', modalHidden);
              if (!modalHidden) { console.error('  FAIL: Modal not hidden'); failed = true; }
              
              console.log('Test 6: Check reviews section');
              const reviewsVisible = await page.locator('text=파티커넥트 멤버 실제후기').isVisible();
              console.log('  Reviews visible:', reviewsVisible);
              if (!reviewsVisible) { console.error('  FAIL: Reviews not visible'); failed = true; }
              
              console.log('Test 7: Check admin link');
              const adminVisible = await page.locator('button').filter({ hasText: '관리자' }).isVisible();
              console.log('  Admin link visible:', adminVisible);
              if (!adminVisible) { console.error('  FAIL: Admin link not visible'); failed = true; }
              
              console.log('Test 8: Mobile viewport test');
              await page.setViewportSize({ width: 390, height: 844 });
              await page.reload({ waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForTimeout(3000);
              
              const mobileRoot = await page.locator('#root').isVisible();
              console.log('  Mobile root visible:', mobileRoot);
              if (!mobileRoot) { console.error('  FAIL: Mobile root not visible'); failed = true; }
              
              const mobileKorean = await page.locator('text=파티커넥트').first().isVisible();
              console.log('  Mobile Korean text visible:', mobileKorean);
              if (!mobileKorean) { console.error('  FAIL: Mobile Korean text not visible'); failed = true; }
              
              const bodyWidth = await page.evaluate(() => document.body.scrollWidth);
              const viewportWidth = await page.evaluate(() => window.innerWidth);
              const noHorizontalScroll = bodyWidth <= viewportWidth + 1;
              console.log('  Body width:', bodyWidth, 'Viewport width:', viewportWidth, 'No horizontal scroll:', noHorizontalScroll);
              if (!noHorizontalScroll) { console.error('  FAIL: Horizontal scroll detected'); failed = true; }
              
              console.log('Test 9: Open region modal on mobile');
              await page.locator('button').filter({ hasText: '지역 선택' }).click();
              await page.waitForTimeout(1000);
              const mobileModal = await page.locator('text=지역 선택').isVisible();
              console.log('  Mobile modal visible:', mobileModal);
              if (!mobileModal) { console.error('  FAIL: Mobile modal not visible'); failed = true; }
              
            } catch (e) {
              console.error('Test error:', e.message);
              failed = true;
            } finally {
              await browser.close();
            }
            
            if (failed) {
              console.error('\\n❌ Some tests failed');
              process.exit(1);
            } else {
              console.log('\\n✅ All tests passed');
            }
          })();
          EOF

      - name: Stop local server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID 2>/dev/null || true
          fi

  deploy-check:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: [validate, test-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for GitHub Pages deployment
        run: |
          echo "Waiting for GitHub Pages deployment to complete (up to 10 minutes)..."
          for i in {1..40}; do
            echo "Waiting for Pages deployment... (attempt $i/40)"
            sleep 15
          done
          echo "Proceeding to verification"

      - name: Verify deployment URL accessible
        run: |
          for i in {1..20}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://j-hype-labs.github.io/party-connect-mvp/ || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Deployment verified: HTTP 200"
              exit 0
            fi
            echo "Waiting for deployment... (attempt $i/20, got $HTTP_CODE)"
            sleep 15
          done
          echo "ERROR: Deployment not accessible after 5 minutes"
          exit 1

      - name: Verify content rendered (static HTML)
        run: |
          CONTENT=$(curl -s https://j-hype-labs.github.io/party-connect-mvp/)
          
          if ! echo "$CONTENT" | grep -q "id=\"root\""; then
            echo "ERROR: Root element missing"
            exit 1
          fi
          if ! echo "$CONTENT" | grep -q "text/babel"; then
            echo "ERROR: Babel script missing"
            exit 1
          fi
          if ! echo "$CONTENT" | grep -q "파티커넥트"; then
            echo "ERROR: Korean content not found"
            exit 1
          fi
          
          echo "Static content verification passed"

      - name: Report success
        if: success()
        run: |
          echo "✅ All checks passed - Deployment verified"
          echo "🌐 Live URL: https://j-hype-labs.github.io/party-connect-mvp/"

      - name: Report failure
        if: failure()
        run: |
          echo "❌ Deployment verification failed"
          echo "Check GitHub Actions logs for details"
          exit 1