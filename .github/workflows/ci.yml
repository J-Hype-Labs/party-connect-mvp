name: CI - Deploy Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install @babel/parser globally
        run: npm install -g @babel/parser

      - name: Validate JSX syntax with @babel/parser
        run: |
          node << 'EOF'
const fs = require('fs');
const parser = require('@babel/parser');

const html = fs.readFileSync('index.html', 'utf-8');
const scriptRegex = /<script type="text\/babel">([\s\S]*?)<\/script>/;
const match = html.match(scriptRegex);
if (!match) {
  console.error('ERROR: No <script type="text/babel"> found');
  process.exit(1);
}

const jsxCode = match[1];
console.log(`Extracted ${jsxCode.length} characters of JSX`);

try {
  parser.parse(jsxCode, {
    sourceType: 'module',
    plugins: ['jsx', 'typescript'],
    strictMode: false
  });
  console.log('✅ JSX syntax validation PASSED');
} catch (error) {
  console.error('❌ JSX syntax validation FAILED');
  console.error(`  Line ${error.loc?.line}, Column ${error.loc?.column}: ${error.message}`);
  process.exit(1);
}
EOF

      - name: Validate HTML structure
        run: |
          node << 'EOF'
const fs = require('fs');
const html = fs.readFileSync('index.html', 'utf-8');

const checks = [
  { name: 'Root element', pattern: /id="root"/, required: true },
  { name: 'Babel script type', pattern: /type="text\/babel"/, required: true },
  { name: 'ReactDOM.createRoot', pattern: /ReactDOM\.createRoot/, required: true },
  { name: 'App component render', pattern: /<App \/>/, required: true },
  { name: 'Tailwind CDN', pattern: /cdn\.tailwindcss\.com/, required: true },
  { name: 'React CDN', pattern: /unpkg\.com\/react@18/, required: true },
  { name: 'ReactDOM CDN', pattern: /unpkg\.com\/react-dom@18/, required: true },
  { name: 'Babel CDN', pattern: /unpkg\.com\/@babel\/standalone/, required: true },
  { name: 'Pretendard CDN', pattern: /cdn\.jsdelivr\.net.*pretendard/, required: true },
];

let allPassed = true;
for (const check of checks) {
  const found = check.pattern.test(html);
  if (found) {
    console.log(`  ✅ ${check.name}`);
  } else if (check.required) {
    console.error(`  ❌ ${check.name} - MISSING (required)`);
    allPassed = false;
  }
}

if (!allPassed) process.exit(1);
console.log('✅ HTML validation PASSED');
EOF

      - name: Validate external dependencies
        run: |
          for url in \
            "https://cdn.tailwindcss.com" \
            "https://unpkg.com/react@18/umd/react.development.js" \
            "https://unpkg.com/react-dom@18/umd/react-dom.development.js" \
            "https://unpkg.com/@babel/standalone/babel.min.js" \
            "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"; do
            if ! curl -s -o /dev/null -w "%{http_code}" "$url" | grep -q "200\|302"; then
              echo "ERROR: CDN dependency unavailable: $url"
              exit 1
            fi
          done
          echo "External dependency check passed"

      - name: Validate deployment config
        run: |
          if [ ! -f _config.yml ]; then
            echo "ERROR: _config.yml not found"
            exit 1
          fi
          if [ ! -f .gitignore ]; then
            echo "ERROR: .gitignore not found"
            exit 1
          fi
          echo "Deployment config check passed"

  test-e2e:
    name: E2E Browser Tests (Non-blocking)
    runs-on: ubuntu-latest
    needs: validate
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests against live URL
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: https://j-hype-labs.github.io/party-connect-mvp/

      - name: Run E2E tests against local server
        if: github.event_name == 'pull_request'
        run: |
          python3 -m http.server 3000 &
          sleep 5
          npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

  deploy-check:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for GitHub Pages deployment
        run: |
          echo "Waiting for GitHub Pages deployment to complete (up to 10 minutes)..."
          for i in {1..40}; do
            echo "Waiting for Pages deployment... (attempt $i/40)"
            sleep 15
          done
          echo "Proceeding to verification"

      - name: Verify deployment URL accessible
        run: |
          for i in {1..20}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://j-hype-labs.github.io/party-connect-mvp/ || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Deployment verified: HTTP 200"
              exit 0
            fi
            echo "Waiting for deployment... (attempt $i/20, got $HTTP_CODE)"
            sleep 15
          done
          echo "ERROR: Deployment not accessible after 5 minutes"
          exit 1

      - name: Verify content rendered
        run: |
          CONTENT=$(curl -s https://j-hype-labs.github.io/party-connect-mvp/)
          
          if ! echo "$CONTENT" | grep -q "id=\"root\""; then
            echo "ERROR: Root element missing"
            exit 1
          fi
          if ! echo "$CONTENT" | grep -q "text/babel"; then
            echo "ERROR: Babel script missing"
            exit 1
          fi
          if ! echo "$CONTENT" | grep -q "파티커넥트"; then
            echo "ERROR: Korean content not found"
            exit 1
          fi
          
          echo "Static content verification passed"

      - name: Report success
        if: success()
        run: |
          echo "✅ All checks passed - Deployment verified"
          echo "🌐 Live URL: https://j-hype-labs.github.io/party-connect-mvp/"

      - name: Report failure
        if: failure()
        run: |
          echo "❌ Deployment verification failed"
          echo "Check GitHub Actions logs for details"
          exit 1