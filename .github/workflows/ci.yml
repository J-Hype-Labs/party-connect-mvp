name: CI - Deploy Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Validate HTML structure (grep)
        run: |
          echo "Checking required elements..."
          grep -q 'id="root"' index.html && echo "✅ Root element" || (echo "❌ Root element missing" && exit 1)
          grep -q 'text/babel' index.html && echo "✅ Babel script type" || (echo "❌ Babel script type missing" && exit 1)
          grep -q 'ReactDOM.createRoot' index.html && echo "✅ ReactDOM.createRoot" || (echo "❌ ReactDOM.createRoot missing" && exit 1)
          grep -q '<App />' index.html && echo "✅ App component render" || (echo "❌ App component render missing" && exit 1)
          grep -q 'cdn.tailwindcss.com' index.html && echo "✅ Tailwind CDN" || (echo "❌ Tailwind CDN missing" && exit 1)
          grep -q 'unpkg.com/react@18' index.html && echo "✅ React CDN" || (echo "❌ React CDN missing" && exit 1)
          grep -q 'unpkg.com/react-dom@18' index.html && echo "✅ ReactDOM CDN" || (echo "❌ ReactDOM CDN missing" && exit 1)
          grep -q 'unpkg.com/@babel/standalone' index.html && echo "✅ Babel CDN" || (echo "❌ Babel CDN missing" && exit 1)
          grep -q 'cdn.jsdelivr.net.*pretendard' index.html && echo "✅ Pretendard CDN" || (echo "❌ Pretendard CDN missing" && exit 1)
          echo "✅ HTML validation PASSED"

      - name: Validate JSX syntax with @babel/parser
        run: npm run validate:jsx

      - name: Validate JSX syntax (Python bracket checker - secondary)
        run: python3 scripts/validate-jsx-ci.py

      - name: Validate external dependencies
        run: |
          for url in \
            "https://cdn.tailwindcss.com" \
            "https://unpkg.com/react@18/umd/react.development.js" \
            "https://unpkg.com/react-dom@18/umd/react-dom.development.js" \
            "https://unpkg.com/@babel/standalone/babel.min.js" \
            "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"; do
            if ! curl -s -o /dev/null -w "%{http_code}" "$url" | grep -q "200\|302"; then
              echo "ERROR: CDN dependency unavailable: $url"
              exit 1
            fi
          done
          echo "External dependency check passed"

      - name: Validate deployment config
        run: |
          if [ ! -f _config.yml ]; then
            echo "ERROR: _config.yml not found"
            exit 1
          fi
          if [ ! -f .gitignore ]; then
            echo "ERROR: .gitignore not found"
            exit 1
          fi
          if [ ! -f .nojekyll ]; then
            echo "ERROR: .nojekyll not found"
            exit 1
          fi
          echo "Deployment config check passed"

  test-e2e:
    name: E2E Browser Tests (Chromium)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 3000 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ | grep -q "200"; then
              echo "Local server ready"
              break
            fi
            echo "Waiting for local server... ($i/30)"
            sleep 2
          done

      - name: Debug - show local server content
        run: |
          echo "=== Local server HTML (first 5000 chars) ==="
          curl -s http://localhost:3000/ | head -c 5000
          echo ""
          echo "=== End HTML ==="

      - name: Run Playwright E2E test - Basic load
        run: |
          node << 'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            try {
              await page.goto('http://localhost:3000/', { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForSelector('#root', { timeout: 30000 });
              await page.waitForTimeout(5000);
              
              const rootVisible = await page.locator('#root').isVisible();
              console.log('Root visible:', rootVisible);
              if (!rootVisible) throw new Error('Root not visible');
              
              const koreanText = await page.locator('text=파티커넥트').first().isVisible();
              console.log('Korean text visible:', koreanText);
              if (!koreanText) throw new Error('Korean text not visible');
              
              console.log('✅ Basic load test passed');
            } catch (e) {
              console.error('❌ Basic load test failed:', e.message);
              process.exit(1);
            } finally {
              await browser.close();
            }
          })();
          EOF

      - name: Run Playwright E2E test - Discover UI elements
        run: |
          node << 'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            try {
              await page.goto('http://localhost:3000/', { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForSelector('#root', { timeout: 30000 });
              await page.waitForTimeout(5000);
              
              // Get all button texts
              const buttons = await page.locator('button').all();
              console.log('=== BUTTONS FOUND ===');
              for (const btn of buttons) {
                const text = await btn.textContent().catch(() => '');
                if (text.trim()) console.log('  Button:', text.trim().substring(0, 50));
              }
              
              // Get all section texts
              const sections = await page.locator('section').all();
              console.log('=== SECTIONS FOUND ===');
              for (const sec of sections) {
                const text = await sec.textContent().catch(() => '');
                if (text.trim()) console.log('  Section:', text.trim().substring(0, 100));
              }
              
              // Get all text containing Korean keywords
              const koreanElements = await page.locator('text=파티커넥트, text=지역, text=전체, text=혼술, text=소개팅, text=소셜, text=파티, text=체험단, text=후기, text=관리자').all();
              console.log('=== KOREAN ELEMENTS FOUND ===');
              for (const el of koreanElements) {
                const text = await el.textContent().catch(() => '');
                if (text.trim()) console.log('  Korean:', text.trim().substring(0, 100));
              }
              
              // Count elements with role=button
              const roleButtons = await page.locator('[role="button"]').count();
              console.log('Elements with role=button:', roleButtons);
              
              // Count card-like elements
              const cards = await page.locator('.card, article, [class*="card"]').count();
              console.log('Card-like elements:', cards);
              
              // Check for any visible text content
              const bodyText = await page.locator('body').textContent();
              console.log('=== BODY TEXT (first 500 chars) ===');
              console.log(bodyText.substring(0, 500));
              
              console.log('✅ Discovery test completed');
            } catch (e) {
              console.error('❌ Discovery test failed:', e.message);
              process.exit(1);
            } finally {
              await browser.close();
            }
          })();
          EOF

      - name: Run Playwright E2E test - UI elements (robust)
        run: |
          node << 'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            try {
              await page.goto('http://localhost:3000/', { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForSelector('#root', { timeout: 30000 });
              await page.waitForTimeout(5000);
              
              // Hero banner - use more flexible selector
              const sections = page.locator('section');
              const sectionCount = await sections.count();
              console.log('Section count:', sectionCount);
              if (sectionCount === 0) throw new Error('No section elements found');
              const sectionVisible = await sections.first().isVisible();
              console.log('Hero section visible:', sectionVisible);
              if (!sectionVisible) throw new Error('Hero section not visible');
              
              // Filter buttons - try multiple selectors
              const regionBtn = page.locator('button:has-text("지역"), button:has-text("지역 선택")').first();
              const regionVisible = await regionBtn.isVisible({ timeout: 5000 }).catch(() => false);
              console.log('Region button visible:', regionVisible);
              if (!regionVisible) throw new Error('Region button not visible');
              
              // Day tabs - try "전체" or first day tab
              const dayButtons = page.locator('button:has-text("전체"), button:has-text("월"), button:has-text("일")').first();
              const dayVisible = await dayButtons.isVisible({ timeout: 5000 }).catch(() => false);
              console.log('Day button visible:', dayVisible);
              if (!dayVisible) throw new Error('Day button not visible');
              
              // Category buttons - try any category
              const catButtons = page.locator('button:has-text("혼술"), button:has-text("소개팅"), button:has-text("소셜"), button:has-text("파티")').first();
              const catVisible = await catButtons.isVisible({ timeout: 5000 }).catch(() => false);
              console.log('Category button visible:', catVisible);
              if (!catVisible) throw new Error('Category button not visible');
              
              // Party cards - flexible selector
              const cards = page.locator('[role="button"], .card, article, .party-card, text=무료').first();
              const cardVisible = await cards.isVisible({ timeout: 5000 }).catch(() => false);
              console.log('Party card visible:', cardVisible);
              if (!cardVisible) throw new Error('Party card not visible');
              
              // Reviews section
              const reviews = page.locator('text=실제후기, text=후기, text=리뷰').first();
              const reviewsVisible = await reviews.isVisible({ timeout: 5000 }).catch(() => false);
              console.log('Reviews section visible:', reviewsVisible);
              if (!reviewsVisible) throw new Error('Reviews section not visible');
              
              // Admin link
              const admin = page.locator('button:has-text("관리자"), a:has-text("관리자")').first();
              const adminVisible = await admin.isVisible({ timeout: 5000 }).catch(() => false);
              console.log('Admin link visible:', adminVisible);
              if (!adminVisible) throw new Error('Admin link not visible');
              
              console.log('✅ UI elements test passed');
            } catch (e) {
              console.error('❌ UI elements test failed:', e.message);
              process.exit(1);
            } finally {
              await browser.close();
            }
          })();
          EOF

      - name: Run Playwright E2E test - Modal interactions
        run: |
          node << 'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            try {
              await page.goto('http://localhost:3000/', { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForSelector('#root', { timeout: 30000 });
              await page.waitForTimeout(5000);
              
              // Open region modal
              const regionBtn = page.locator('button:has-text("지역"), button:has-text("지역 선택")').first();
              await regionBtn.click();
              await page.waitForTimeout(1000);
              const modalVisible = await page.locator('text=지역 선택, text=지역').isVisible({ timeout: 5000 }).catch(() => false);
              console.log('Region modal visible:', modalVisible);
              if (!modalVisible) throw new Error('Region modal not visible');
              
              const seoulVisible = await page.locator('text=서울').isVisible({ timeout: 5000 }).catch(() => false);
              console.log('Seoul visible:', seoulVisible);
              if (!seoulVisible) throw new Error('Seoul not visible');
              
              // Close modal with ESC
              await page.keyboard.press('Escape');
              await page.waitForTimeout(500);
              const modalHidden = await page.locator('text=지역 선택, text=지역').isHidden({ timeout: 5000 }).catch(() => true);
              console.log('Modal hidden after ESC:', modalHidden);
              
              // Open party detail modal
              const cards = page.locator('[role="button"], .card, article, .party-card, text=무료').first();
              await cards.click();
              await page.waitForTimeout(2000);
              const detailModal = await page.locator('text=신청, text=체험단, text=무료 체험단').isVisible({ timeout: 10000 }).catch(() => false);
              console.log('Detail modal visible:', detailModal);
              if (!detailModal) throw new Error('Detail modal not visible');
              
              // Close detail modal with ESC
              await page.keyboard.press('Escape');
              await page.waitForTimeout(500);
              const detailHidden = await page.locator('text=신청, text=체험단, text=무료 체험단').isHidden({ timeout: 5000 }).catch(() => true);
              console.log('Detail modal hidden after ESC:', detailHidden);
              
              console.log('✅ Modal interactions test passed');
            } catch (e) {
              console.error('❌ Modal interactions test failed:', e.message);
              process.exit(1);
            } finally {
              await browser.close();
            }
          })();
          EOF

      - name: Run Playwright E2E test - Mobile viewport
        run: |
          node << 'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            try {
              await page.setViewportSize({ width: 390, height: 844 });
              await page.goto('http://localhost:3000/', { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForSelector('#root', { timeout: 30000 });
              await page.waitForTimeout(3000);
              
              const mobileRoot = await page.locator('#root').isVisible();
              console.log('Mobile root visible:', mobileRoot);
              if (!mobileRoot) throw new Error('Mobile root not visible');
              
              const mobileKorean = await page.locator('text=파티커넥트').first().isVisible();
              console.log('Mobile Korean text visible:', mobileKorean);
              if (!mobileKorean) throw new Error('Mobile Korean text not visible');
              
              const bodyWidth = await page.evaluate(() => document.body.scrollWidth);
              const viewportWidth = await page.evaluate(() => window.innerWidth);
              const noHorizontalScroll = bodyWidth <= viewportWidth + 1;
              console.log('Body width:', bodyWidth, 'Viewport width:', viewportWidth, 'No horizontal scroll:', noHorizontalScroll);
              if (!noHorizontalScroll) throw new Error('Horizontal scroll detected');
              
              // Mobile region modal
              const regionBtn = page.locator('button:has-text("지역"), button:has-text("지역 선택")').first();
              await regionBtn.click();
              await page.waitForTimeout(1000);
              const mobileModal = await page.locator('text=지역 선택, text=지역').isVisible({ timeout: 5000 }).catch(() => false);
              console.log('Mobile modal visible:', mobileModal);
              if (!mobileModal) throw new Error('Mobile modal not visible');
              
              console.log('✅ Mobile viewport test passed');
            } catch (e) {
              console.error('❌ Mobile viewport test failed:', e.message);
              process.exit(1);
            } finally {
              await browser.close();
            }
          })();
          EOF

      - name: Stop local server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID 2>/dev/null || true
          fi

  deploy-check:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: [validate, test-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for GitHub Pages deployment
        run: |
          echo "Waiting for GitHub Pages deployment to complete (up to 10 minutes)..."
          for i in {1..40}; do
            echo "Waiting for Pages deployment... (attempt $i/40)"
            sleep 15
          done
          echo "Proceeding to verification"

      - name: Verify deployment URL accessible
        run: |
          for i in {1..20}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://j-hype-labs.github.io/party-connect-mvp/ || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Deployment verified: HTTP 200"
              exit 0
            fi
            echo "Waiting for deployment... (attempt $i/20, got $HTTP_CODE)"
            sleep 15
          done
          echo "ERROR: Deployment not accessible after 5 minutes"
          exit 1

      - name: Verify content rendered (static HTML)
        run: |
          CONTENT=$(curl -s https://j-hype-labs.github.io/party-connect-mvp/)
          
          if ! echo "$CONTENT" | grep -q "id=\"root\""; then
            echo "ERROR: Root element missing"
            exit 1
          fi
          if ! echo "$CONTENT" | grep -q "text/babel"; then
            echo "ERROR: Babel script missing"
            exit 1
          fi
          if ! echo "$CONTENT" | grep -q "파티커넥트"; then
            echo "ERROR: Korean content not found"
            exit 1
          fi
          
          echo "Static content verification passed"

      - name: Report success
        if: success()
        run: |
          echo "✅ All checks passed - Deployment verified"
          echo "🌐 Live URL: https://j-hype-labs.github.io/party-connect-mvp/"

      - name: Report failure
        if: failure()
        run: |
          echo "❌ Deployment verification failed"
          echo "Check GitHub Actions logs for details"
          exit 1